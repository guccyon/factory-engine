# QA 役（ADR 0028 の決定 2。P5a の qa_verdict）
#
# QA の定義は「プロダクトの利用者（エンドユーザー、カスタマーサポート、運営担当）にとって使いやすいシステムであるかの品質を担保する」。
# 保証の対象は機能の正しさより「利用者の流れ」で、入力は製品の specs/stories/ のユーザーストーリー（型は user_story.yaml）。
# Gen1 は QA 役 1 つが観点を切り替える。診断役と障害対応役は P5b で分ける。
#
# 流れ: factoryctl qa run（または固定 Issue の factory:qa）→ dispatcher が qa のジョブを積む → ワーカー（worker/qa.sh、core-gates/qa.py）が
# 触れる環境（staging を兼ねる）にストーリーを流し、ストーリーごとに Verdict を返す → dispatcher が qa.verdict と QAVerdict を残し、
# hold の Defect を Issue に起票し、固定 Issue にまとめを書く（dispatcher/qa_line.py）。
#
# 見た目（aesthetic、ADR 0025 の E4）と言葉の温度は判定しない。印（flags）として人に出す。

schema_version: "0.1"
status: draft

# 判定（Verdict）。judge と同じ判断の型（決定・確信度・根拠。judgments.yaml の record）で残す
decisions:
  pass:    "流れが exit まで通り、must_not のどれにも当たらなかった"
  hold:    "流れが途中で止まった・exit の見えるものが違った・must_not に当たった。Defect を 1 件以上付ける"
  blocked: "環境・データ・道具が足りず、流れを確かめられなかった（例: 再起動と時計の道具が渡っていない、Mac ランナーがない）。Defect ではなく、何が足りないかを書く"

# Verdict 1 件の形（core-gates/qa.py が検査する。ワーカーは out/verdicts.yaml にストーリーの数だけ書く）
verdict:
  required: [story_id, decision, confidence, steps, evidence, interpretation]
  steps: "ストーリーの steps と同じ数。1 歩ごとに {n, result: ok | ng | skipped, saw: 実際に見えたもの}"
  evidence: "根拠の配列。画面の文言・URL・API の応答の要点・スクリーンショットのファイル名（out/ の下）"
  interpretation: "根拠をどう読んで決定に至ったか"
  confidence: "自己申告の確信度 0〜1"
  defects: "hold のとき 1 件以上。{title, step, must_not, viewpoint, severity, reproduce, expected, actual, known_gap}"
  flags: "任意。見た目と言葉の温度の印 {viewpoint: aesthetic | tone, where, note}。判定に使わない"

# 観点（ADR 0028 の文脈）。Gen1 で流すのは flow・authz・persistence・words。端末・アクセシビリティ・脆弱性は P5b と ci_diagnose
viewpoints:
  flow:        "利用者の流れ（steps の sees と exit）"
  authz:       "してはいけないこと（must_not の認可の裏返し。別の利用者として試す）"
  persistence: "データの持続（再読み込み・ログインし直し・時間をまたぐ）"
  words:       "言葉と文脈（reader に合った語・内部のコードが出ていないか）"

# 重要度の既定（ADR 0043 の O5）。製品の .factory-config/quality_policy.yaml に s1.conditions と severities があれば、ワーカーはそちらの条件も読む。
# s1 は止める: dispatcher（incident.py）が Incident を開き、ラインを差し止める（line.held_by_qa。解除は人）
severities:
  s1: "個人情報・他人のデータが見える、お金・契約が消える"
  s2: "流れが exit まで通らない"
  s3: "通るが、見えるもの・言葉が違う"
  s4: "気づきにくい小さな食い違い"

worker:
  max_turns: 80                 # ブラウザで 3 本を流す。足りなければ blocked で返す
  stories_max: 6                # 1 回に流す本数の上限
  env_host: host.docker.internal   # ワーカーのコンテナから工場の機械（触れる環境）に届く名前。dispatcher の QA_ENV_HOST で上書き
  mobile_api_url: "http://127.0.0.1:18080"   # Mac のシミュレーターから見た staging の backend（Gen1 は工場と Mac が同じ機械。BIND_HOST の 127.0.0.1 に届く）

# Mac ランナー（ADR 0028 の one_orchestrator）。dispatcher がジョブごとに中継（dispatcher/runner_relay.py）を立て、合言葉をワーカーに渡す。
# ランナーの鍵と窓口の合言葉はワーカーに渡さない。通すのは下の道具だけ（sim_erase・sim_shutdown は通さない）。呼んだ道具は events の runner.relayed
# 工場の側の道具（ADR 0028 の scenario_time）。Mac には送らず dispatcher が受け、shipper に依頼する（runner_relay.py の LOCAL_TOOLS）。
# env_restart は QA を積んだときの環境（staging）だけを再起動し、サーバーの時計を進める。製品の .factory-config/ship.yaml の touch.restart と touch.clock_env が要る
env_tools: [env_restart, env_clock]
# 時刻を合わせる決まり（ADR 0055）。env_restart の set_to で時刻を指定して合わせる。同じ製品でほかの QA のジョブが動いていれば断る（0 に戻すのは通す）。
# 時計を動かしたジョブが終わったら、戻し忘れを dispatcher が 0 に戻す（release.restart_requested の by が qa:<job_id>:cleanup）
clock:
  max_restarts_per_job: 8       # 1 ジョブで再起動してよい回数（0 に戻すのは数えても断らない）。運用パラメータ
runner_tools: [sim_devices, sim_boot, app_build, build_status, app_install, app_launch, app_terminate, screenshot, open_url, push, logs,
               ui_describe, ui_tap, ui_swipe, ui_text, ui_key]

# dispatcher の作用
act:
  issue_label: "factory:qa"                     # 固定 Issue（QA の判定。閉じない）。まとめをコメントする
  explore_issue_label: "factory:qa-explore"     # 探索の固定 Issue（閉じない）。1 つの Issue に動けるジョブは 1 つなので、出荷の関門で判定と並行に積むために分けた（ADR 0049）
  defect_labels: ["factory:qa-defect", "factory:fix-proposed"]   # hold の Defect。流すときは人が factory:fix-proposed を factory:planned に替える（差し戻しと同じ）
  defects_per_run_max: 5        # 1 回の判定で起票する Defect の上限（残りはまとめに載せるだけ）
  known_gap_issue: false        # known_gaps に当たった Defect は起票しない（ストーリーに既に書いてある。まとめに載せる）

# 夜間の探索（ADR 0028 の決定 3 と P5a の nightly_explore）。台本（ストーリーの steps）どおりに流す判定と違い、その夜のチャーター（狙い）に沿って
# 利用者として寄り道し、ストーリーが書いていないところの食い違いを探す。人のいない夜（unattended）に回し、結果は朝の報告に出す。
# 流れ: supervisor が JST の hours の間に、製品ごとに 1 晩 1 回 QA のジョブ（入力の mode: explore）を探索の固定 Issue（factory:qa-explore）に積む
# → ワーカー（core-gates/qa.py の探索）が out/explore.yaml を返す → dispatcher が QAExplore と qa.explore（1 晩 1 件）を残し、
# 見つけたもの（findings）の Defect を判定と同じラベルで起票し、固定 Issue にまとめを書く → 日報（health/daily/status_report.py）が昨夜の分を載せる。
# 見た目と言葉の温度は判定と同じく印（flags）として人に出す。印は人が採点して Golden Set に入れる（P5b の quality_learn の材料）。
explore:
  hours: [1, 5]                 # JST。この間に積む（5 時の日報の前に終わるように。予算の枠を使い切っていれば次の枠を待つ）
  through_pause: true           # ラインの一時停止中も探索のジョブだけ流す（factoryctl qa run --through-pause と同じ）。予算の枠は守る
  priority: p2                  # 夜は実装のチケットより後ろ
  max_turns: 80
  findings_max: 8               # 1 晩に返す見つけたものの上限（重い順）
  defects_per_night_max: 3      # 1 晩に起票する Defect の上限（s4 と known_gap は起票しない。残りはまとめに載せる）
  file_severities: [s1, s2, s3]
  # チャーターは夜ごとに順番に替える（夜の通し番号 % 数）。viewpoint は見つけたものの既定の観点
  charters:
    - id: detour
      viewpoint: flow
      ja: "寄り道: 戻る・やり直す・途中でやめる・二度押す・空や長い入力・順番を変える"
    - id: other-user
      viewpoint: authz
      ja: "別の利用者: 他人の id や URL を開く・権限のない役で操作する・ログアウトした後に戻る"
    - id: come-back
      viewpoint: persistence
      ja: "戻ってくる: 再読み込み・ログインし直し・2 つのタブ・別の端末の幅で同じ人が開く"
    - id: reader-words
      viewpoint: words
      ja: "読み手の言葉: 役ごとに、内部のコードや英語の取り残し・用語集と違う語・何をすればよいか分からない文言"
    - id: first-time
      viewpoint: flow
      ja: "初めての人: 空の状態から、案内だけを頼りに目的（ストーリーの goal）にたどり着けるか"
  # 結果の形（core-gates/qa.py が検査する。ワーカーは out/explore.yaml に書く）
  result:
    required: [charter, tried, findings, interpretation, confidence]
    tried: "試したこと 1 件以上。{actor, where, did, saw, story_id（近いストーリーがあれば）}"
    findings: "見つけたもの（なければ []）。{title, viewpoint, severity, where, reproduce, expected, actual, story_id, known_gap, same_as}。same_as は入力の open_defects（開いている不具合）と同じなら、その Issue の番号（dispatcher が既存の Issue にまとめ、起票し直さない）"
    flags: "任意。判定と同じ印 {viewpoint: aesthetic | tone, where, note}"

# 出荷の QA の関門（ADR 0049）。staging に配備した版に、判定（mode: verdict、全ストーリーの E2E）と探索（mode: explore、チャーター 1 つ）を
# 同時に積み、両方の結果を 1 つの報告にまとめて承認に添える。関門は合否を決めない。ブロッカーの候補を挙げ、ブロッカーにするかは承認者が決める。
# 流れ: supervisor（qa_gate_step）が release.deployed を見て開く → 判定は factory:qa、探索は factory:qa-explore に積む
# → dispatcher が今までどおり記録する → そろったら qa.gate_decided と判定の固定 Issue へのまとめ → 受信トレイの「本番待ち」に報告を添える
gate:
  priority: p1                  # 承認を待たせるので、夜の探索（p2）より前
  hours: 6                      # 開いてから結果がそろうのを待つ時間。過ぎたらそろった分だけで報告を作る
  attempts: 2                   # 確かめられなかったジョブ（失敗・結果なし・判定が blocked だけ）は 1 回だけ積み直す
  blocker_severities: [s1, s2]  # 探索の見つけたもののうち、ブロッカーの候補に挙げる重要度（判定は known_gap でない Defect の hold を全部挙げる）

# 合成の利用者（ADR 0043 の O4 synthetic_users_loop。ADR 0023 の決めどころ 3）。夜間の探索の道具（ワーカー・触れる環境・Chromium）を流用し、
# ユーザーストーリーに沿って合成の利用者が staging を一定量歩き、行動ログ（製品の specs/analytics/events.yaml の名前）と応答時間を残す。
# 応答時間はエージェントの申告ではなく、ワーカーの中の中継（core-gates/synthetic_proxy.py）が 1 回ごとに測る。
# 歩いた結果から、遅い API（テーマ 2 信頼性と性能）と、入口を見つけられなかった・詰まった流れ（テーマ 1 利用者の体験）を決定論で拾い、
# 改善の提案（Opportunity）にして受信トレイに出す。起票はしない（人かプランナーが拾う。ADR 0043 の O2 と同じ）。
# 流れ: supervisor が週に 1 回（JST の weekday・hours）、製品ごとに QA のジョブ（入力の mode: synthetic）を固定 Issue（factory:qa）に積む
# （factoryctl qa synthetic でも積める）→ ワーカー（core-gates/qa.py の合成の利用者）が out/walk.yaml を返し、中継が応答時間を足す
# → dispatcher（qa_line.record_synthetic）が QASynthetic と qa.synthetic を残し、提案を opportunity.proposed と受信トレイに出し、固定 Issue にまとめを書く。
synthetic:
  weekday: 6                    # JST の曜日（0 が月曜）。日曜の朝
  hours: [5, 7]                 # JST。夜間の探索（1〜5 時）のあと
  through_pause: true           # ラインの一時停止中もこのジョブだけ流す。予算の枠は守る
  priority: p2
  max_turns: 80
  walks_focus: 2                # 品質の Learn の重点（qa.focus_updated）のストーリーを歩く回数
  walks_other: 1                # それ以外のストーリーを歩く回数
  stories_max: 6
  # 提案にする線（運用パラメータ。工場が調整してよい）
  slow_p95_ms: 1500             # API のパスごとの p95 がこれ以上なら「遅い」（テーマ 2）
  slow_min_calls: 2             # 呼ばれた回数がこれより少ないパスは見ない
  hard_entry_attempts: 3        # 入口（ストーリーの最初の歩の場所）を見つけるまでの試行がこれ以上、または見つけられなかったら「入口が見つけにくい」（テーマ 1）
  opportunities_max: 4          # 1 回に出す提案の上限
  # わざと仕込む詰まり（ADR 0043 の O4）。工場の環境変数 SYNTH_FRICTION で入れる（staging のときだけ。製品のコードには入れない）。
  # SYNTH_FRICTION=example で下の例を、JSON で任意の形を入れる。空なら仕込まない。入れた仕込みは qa.synthetic の planted に残り、
  # 提案が仕込みに当たったか（planted_hit）を数える（roadmap の synthetic_users_loop）
  friction_env: SYNTH_FRICTION
  friction_example:
    slow: { path: /api/bookings, method: GET, delay_ms: 2500 }             # 本部の予約の一覧（CS が「予約が消えた」を追うストーリー）
    hide: { entry: ADMIN_WEB_PORT, selector: "a[href='/headquarters/bookings']" }   # 本部の画面のトップから予約の一覧への入口
  # 結果の形（core-gates/qa.py が検査する。ワーカーは out/walk.yaml に書く）
  result:
    required: [walks, interpretation, confidence]
    walk: "1 回歩いた分。{story_id, round, actor, entry, found_entry, attempts_to_entry, reached_exit, steps, felt}"
    entry: "使った画面の入口（env.json の entries の port_env）"
    steps: "1 歩ごとに {n, did, event（このとき起きたはずの行動イベントの name。製品の specs/analytics/events.yaml にあるもの。なければ null）, waited: none | short | long, stuck: 真偽, note}"
