# QA 役（ADR 0028 の決定 2。P5a の qa_verdict）
#
# QA の定義は「プロダクトの利用者（エンドユーザー、カスタマーサポート、運営担当）にとって使いやすいシステムであるかの品質を担保する」。
# 保証の対象は機能の正しさより「利用者の流れ」で、入力は製品の specs/stories/ のユーザーストーリー（型は user_story.yaml）。
# Gen1 は QA 役 1 つが観点を切り替える。診断役と障害対応役は P5b で分ける。
#
# 流れ: factoryctl qa run（または固定 Issue の factory:qa）→ dispatcher が qa のジョブを積む → ワーカー（worker/qa.sh、core-gates/qa.py）が
# 触れる環境（staging を兼ねる）にストーリーを流し、ストーリーごとに Verdict を返す → dispatcher が qa.verdict と QAVerdict を残し、
# hold の Defect を Issue に起票し、固定 Issue にまとめを書く（dispatcher/qa_line.py）。
#
# 見た目（aesthetic、ADR 0025 の E4）と言葉の温度は判定しない。印（flags）として人に出す。

schema_version: "0.1"
status: draft

# 判定（Verdict）。judge と同じ判断の型（決定・確信度・根拠。judgments.yaml の record）で残す
decisions:
  pass:    "流れが exit まで通り、must_not のどれにも当たらなかった"
  hold:    "流れが途中で止まった・exit の見えるものが違った・must_not に当たった。Defect を 1 件以上付ける"
  blocked: "環境・データ・道具が足りず、流れを確かめられなかった（例: 時間をまたぐ手順、Mac ランナーがない）。Defect ではなく、何が足りないかを書く"

# Verdict 1 件の形（core-gates/qa.py が検査する。ワーカーは out/verdicts.yaml にストーリーの数だけ書く）
verdict:
  required: [story_id, decision, confidence, steps, evidence, interpretation]
  steps: "ストーリーの steps と同じ数。1 歩ごとに {n, result: ok | ng | skipped, saw: 実際に見えたもの}"
  evidence: "根拠の配列。画面の文言・URL・API の応答の要点・スクリーンショットのファイル名（out/ の下）"
  interpretation: "根拠をどう読んで決定に至ったか"
  confidence: "自己申告の確信度 0〜1"
  defects: "hold のとき 1 件以上。{title, step, must_not, viewpoint, severity, reproduce, expected, actual, known_gap}"
  flags: "任意。見た目と言葉の温度の印 {viewpoint: aesthetic | tone, where, note}。判定に使わない"

# 観点（ADR 0028 の文脈）。Gen1 で流すのは flow・authz・persistence・words。端末・アクセシビリティ・脆弱性は P5b と ci_diagnose
viewpoints:
  flow:        "利用者の流れ（steps の sees と exit）"
  authz:       "してはいけないこと（must_not の認可の裏返し。別の利用者として試す）"
  persistence: "データの持続（再読み込み・ログインし直し・時間をまたぐ）"
  words:       "言葉と文脈（reader に合った語・内部のコードが出ていないか）"

# 重要度（P5b の severity_budget までの仮置き）。s1 は「止める」条件の候補（quality_policy.yaml の stop_conditions）
severities:
  s1: "個人情報・他人のデータが見える、お金・契約が消える"
  s2: "流れが exit まで通らない"
  s3: "通るが、見えるもの・言葉が違う"
  s4: "気づきにくい小さな食い違い"

worker:
  max_turns: 80                 # ブラウザで 3 本を流す。足りなければ blocked で返す
  stories_max: 6                # 1 回に流す本数の上限
  env_host: host.docker.internal   # ワーカーのコンテナから工場の機械（触れる環境）に届く名前。dispatcher の QA_ENV_HOST で上書き
  mobile_api_url: "http://127.0.0.1:18080"   # Mac のシミュレーターから見た staging の backend（Gen1 は工場と Mac が同じ機械。BIND_HOST の 127.0.0.1 に届く）

# Mac ランナー（ADR 0028 の one_orchestrator）。dispatcher がジョブごとに中継（dispatcher/runner_relay.py）を立て、合言葉をワーカーに渡す。
# ランナーの鍵と窓口の合言葉はワーカーに渡さない。通すのは下の道具だけ（sim_erase・sim_shutdown は通さない）。呼んだ道具は events の runner.relayed
runner_tools: [sim_devices, sim_boot, app_build, build_status, app_install, app_launch, app_terminate, screenshot, open_url, push, logs,
               ui_describe, ui_tap, ui_swipe, ui_text, ui_key]

# dispatcher の作用
act:
  issue_label: "factory:qa"                     # 固定 Issue（QA の判定。閉じない）。まとめをコメントする
  defect_labels: ["factory:qa-defect", "factory:fix-proposed"]   # hold の Defect。流すときは人が factory:fix-proposed を factory:planned に替える（差し戻しと同じ）
  defects_per_run_max: 5        # 1 回の判定で起票する Defect の上限（残りはまとめに載せるだけ）
  known_gap_issue: false        # known_gaps に当たった Defect は起票しない（ストーリーに既に書いてある。まとめに載せる）

# 夜間の探索（ADR 0028 の決定 3 と P5a の nightly_explore）。台本（ストーリーの steps）どおりに流す判定と違い、その夜のチャーター（狙い）に沿って
# 利用者として寄り道し、ストーリーが書いていないところの食い違いを探す。人のいない夜（unattended）に回し、結果は朝の報告に出す。
# 流れ: supervisor が JST の hours の間に、製品ごとに 1 晩 1 回 QA のジョブ（入力の mode: explore）を固定 Issue（factory:qa）に積む
# → ワーカー（core-gates/qa.py の探索）が out/explore.yaml を返す → dispatcher が QAExplore と qa.explore（1 晩 1 件）を残し、
# 見つけたもの（findings）の Defect を判定と同じラベルで起票し、固定 Issue にまとめを書く → 日報（health/daily/status_report.py）が昨夜の分を載せる。
# 見た目と言葉の温度は判定と同じく印（flags）として人に出す。印は人が採点して Golden Set に入れる（P5b の quality_learn の材料）。
explore:
  hours: [1, 5]                 # JST。この間に積む（5 時の日報の前に終わるように。予算の枠を使い切っていれば次の枠を待つ）
  through_pause: true           # ラインの一時停止中も探索のジョブだけ流す（factoryctl qa run --through-pause と同じ）。予算の枠は守る
  priority: p2                  # 夜は実装のチケットより後ろ
  max_turns: 80
  findings_max: 8               # 1 晩に返す見つけたものの上限（重い順）
  defects_per_night_max: 3      # 1 晩に起票する Defect の上限（s4 と known_gap は起票しない。残りはまとめに載せる）
  file_severities: [s1, s2, s3]
  # チャーターは夜ごとに順番に替える（夜の通し番号 % 数）。viewpoint は見つけたものの既定の観点
  charters:
    - id: detour
      viewpoint: flow
      ja: "寄り道: 戻る・やり直す・途中でやめる・二度押す・空や長い入力・順番を変える"
    - id: other-user
      viewpoint: authz
      ja: "別の利用者: 他人の id や URL を開く・権限のない役で操作する・ログアウトした後に戻る"
    - id: come-back
      viewpoint: persistence
      ja: "戻ってくる: 再読み込み・ログインし直し・2 つのタブ・別の端末の幅で同じ人が開く"
    - id: reader-words
      viewpoint: words
      ja: "読み手の言葉: 役ごとに、内部のコードや英語の取り残し・用語集と違う語・何をすればよいか分からない文言"
    - id: first-time
      viewpoint: flow
      ja: "初めての人: 空の状態から、案内だけを頼りに目的（ストーリーの goal）にたどり着けるか"
  # 結果の形（core-gates/qa.py が検査する。ワーカーは out/explore.yaml に書く）
  result:
    required: [charter, tried, findings, interpretation, confidence]
    tried: "試したこと 1 件以上。{actor, where, did, saw, story_id（近いストーリーがあれば）}"
    findings: "見つけたもの（なければ []）。{title, viewpoint, severity, where, reproduce, expected, actual, story_id, known_gap}"
    flags: "任意。判定と同じ印 {viewpoint: aesthetic | tone, where, note}"
