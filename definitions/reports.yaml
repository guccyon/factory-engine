# 定期レポートの中身（ADR 0032 の決定 9）。通知の種類は notifications.yaml。
# status: provisional は仮置き。中身を決めるタスクで書き換えて外す。
# 節（sections）ごとに載せてよい組織（parties）を持ち、事業主の宛先に出すときは事業主に出せない節を落とす。
# 組み立ては orchestrator/dispatcher/report_health.py など（節の id ごとの関数）。dispatcher のコンテナには definitions/ がないので節の一覧を写す（食い違いはテストで見る）
schema_version: "0.1"

reports:
  report.factory_health:
    status: provisional      # 2026-11-05。朝の報告の操業タブと同じ数を仮に置く
    period: day              # JST の 0〜24 時。前日の分を毎朝出す（後で頻度を落とすかもしれない）
    sections:
      - { id: line,  ja: ライン,     parties: [provider, business_owner] }   # 動いていた割合、停止の件数、戻るまでの時間、開いている停止
      - { id: jobs,  ja: ジョブ,     parties: [provider, business_owner] }   # 終わったジョブの成否
      - { id: inbox, ja: 人の判断待ち, parties: [provider, business_owner] }   # 受信トレイに残っている件数、判断までの待ち時間
      - { id: cost,  ja: 費用,       parties: [provider, business_owner] }   # API 単価に換算した消費、予算の上限で止まった時間（R5: 健康のレポートにだけ載せる）
