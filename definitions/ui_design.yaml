# デザイナー役とデザイン検査役（ADR 0025。P4-6・P4-10）
#
# 画面を含むタスクは、実装の前にデザインの線を通る:
#   Issue に factory:design → デザイナー役（ui_design）: UXSpec と 2〜3 案のモック（静的 HTML）とキャプチャ
#   → デザイン検査役（ui_design_review）: 承認／直し（1 回まで）／人へ
#   → 承認か人の選択のあと、UXSpec を Issue の本文に足して factory:planned（依存を見て supervisor が実装に回す）
# 数値は仮置き（2026-11-01。委任の範囲で運用しながら直す）。観点の追加・変更はデザインガイドラインの変更と同じ入り口（ADR 0025）。

schema_version: "0.1"
status: draft

labels:
  trigger: factory:design            # 画面を含むタスク。人かプランナーが付ける（factory:planned の代わり）
  choice: factory:design-choice      # 人の選択待ち（factoryctl design pick か、操業コンソールの選択の画面 P4-7）
  after: factory:planned             # デザインが決まったタスクは投入待ちへ

designer:
  max_turns: 40
  variants: {min: 2, max: 3, small_change_min: 1}   # 体験の案（axis: flow）の数。小さな追加（既存の画面に要素を 1 つ足す程度）は 1 案でよい
  look_variants: {min: 2, max: 3}                   # 見た目の案（axis: look）の数。brand_impact のときだけ作る（ADR 0026 の決定 4・6）
  viewports:                                        # 案ごとに選ぶ。アプリの種類で決める
    mobile: [390, 844]
    desktop: [1280, 900]
  frames_max: 8                                     # 案 1 つあたりのコマ（画面の流れ・状態ごとのカンプ）の上限
  max_file_bytes: 2000000                           # 1 ファイル（HTML・PNG）の上限。超えた案は捨てる
  rules:
    - "案はデザインシステム（製品の specs/design/）の部品と画面の型だけで組む。トークン外の色・余白・部品を直書きしない"
    - "足りない部品は design_system_gaps に書く（画面のタスクとは別に、デザインシステムに部品を足すタスクを切る）"
    - "デザインシステムがまだない製品では、今の画面の見た目（apps/ のコード）を写し、そのことを design_system_constraints に書く"
    - "画面の要素と振る舞い（操作・状態・遷移）は必ず決める。見た目の細部は後追いでよい（ADR 0025 の E1）"
    - "状態（読み込み中・空・失敗・送信中・確認・権限がないとき）のうち、その画面に起きるものを states に全部書く"
    - "モックは外部の資源を読まない（Web フォント・CDN・画像の URL を使わない。書体は同梱のものを font-family で指定するだけ）"
    - "案は 2 つの軸に分ける。体験の案（axis: flow）は流れ・情報の優先順位・密度が違う案で、プロダクトオーナーが選ぶ。色違いだけの案は体験の案にしない"
    - "brand_impact が true のときだけ、推す体験の案（recommended）に見た目だけを変えた案（axis: look。色・書体・角丸・写真の扱いなど、トークンの差し替え）を足し、推す見た目の案を recommended_look に書く。見た目の案はデザインのチーフが選ぶ"
    - "動くプロトタイプにするときは、つなぐのは out/ の中の HTML どうしの相対リンクだけ。スクリプトは HTML の中に書く小さなもの（開閉・タブの切り替え・入力の検証の見せ方）に限り、通信・ストレージ・外の資源は使わない（配り口が止める）"
    - "用語は specs/glossary.yaml の語を使う"
    - "人が判断できる材料にする: コードの PR の説明と同じく、概要・背景・変更点・推す理由・迷った点を書き、カンプ・項目定義・振る舞い・画面の流れを添える。画像 1 枚だけを出さない（ADR 0026）"

uxspec:
  required: [ticket, summary, prd, changes, user_flow, screens, states, design_system_constraints, design_system_gaps, variants, recommended, brand_impact, rationale]
  screen_required: [id, purpose, new, transitions, elements, behaviors]

# UI のレビュー依頼（ADR 0026 の決定 3）。コードの PR の説明と同じく、背景と意図を添えて「上から読めば判断できる」形にする。
# 2026-11-01 オーナーと見直し: 画面定義書（日本の受託の様式）にはこだわらず、カンプ（状態ごとの画像）＋項目定義＋プロトタイプ（画面の流れ）を
# 依頼の本文に添える。本文の見出しはレビューページの並びと同じ（概要 → 背景 → 変更点 → 判断してほしいこと → 画面の流れ → 項目定義と振る舞い → 迷った点・未決）
package:
  summary: 概要。何の画面を、どうするか（1〜2 文。PR のタイトルと 1 行目にあたる）
  prd:                               # 背景（PRD の要約）。PRD 本体があればそのパスか URL を source に
    goal: 誰がこの画面で何を達成したいか（利用者の言葉で 1〜2 文）
    success: 達成した状態（何ができれば成功か）
    scope: 範囲（入れるもの・入れないもの）
    source: 要求の出どころ（Issue、specs/ の PRD のパスなど）
  changes: 変更点。画面ごとに screen（画面 id）・kind（new＝新しい画面／changed＝今ある画面を変える）・before（今どうなっているか。new なら省く）・after（どう変わるか）
  user_flow: 画面の前後のつながり。手順ごとに from（どこから）・action（利用者の操作）・to（どこへ）
  rationale:                         # 判断してほしいことの根拠
    why: なぜこの案を推すか
    rejected: 検討してとらなかった案と理由（idea・reason）
    requirement_map: PRD の要求ごとに、画面のどこで満たすか（requirement・how）
  screen:                            # screens[] の項目。小さな改修では変わる行だけでよい
    id: "画面 id（英数字）。route・audience（誰が見るか）も書く"
    purpose: "目的: この画面で利用者が達成したいこと、フローの中の位置"
    transitions: "画面遷移: entries（どこから来るか・条件・渡すデータ）と exits（操作ごとの行き先、戻る・中断のとき）"
    elements: "項目定義: 表の行ごとに name（項目名）・component（デザインシステムの部品）・content（表示する中身）・source（データの出どころ）・required（必須か）・note（並び順・文字数・書式など）"
    behaviors: "振る舞い: 表の行ごとに target（どの項目）・action（操作）・condition（条件）・result（結果: 遷移・API・表示の変化。エラー文言も）。二重押し・取り消し・入力の検証を含める"
    more: "補足（任意。あるものだけ）: microinteractions（きっかけ・ルール・フィードバック・繰り返し）、copy（文言。用語は glossary）、accessibility、analytics（specs/analytics/events.yaml の id）、contract_needs（必要な API と項目）"
  prototype: "動くプロトタイプ: 推す体験の案の HTML とコマの HTML を、ボタン・リンクの相対リンク（例 href=\"a-confirm.html\"）でつなぎ、触って遷移をたどれるようにしたら true。入り口は <推す案>.html"
  frames: "画面の流れ（プロトタイプの画像版）: 推す体験の案に、案の画面に続く画面と、主な状態（空・エラー・送信中など）をコマとして足す。コマごとに id・caption（何をした後の画面か）・screen・state"
  open_questions: "迷った点と未決: 決めきれなかった点と仮の値。レビューで特に見てほしいこと"

inspector:
  max_turns: 20
  max_revisions: 1                   # 直しは 1 回まで（ADR 0025）。2 回目の「直し」は人へ
  human_below_confidence: 0.7        # 検査役の確信度がこれ未満なら人へ
  look_reasons: [brand_impact]       # この理由で人へ回したものは、見た目の案があればデザインのチーフが選ぶ。ほかの理由は体験の判断としてプロダクトオーナーへ（ADR 0026 の決定 4・6）
  human_when:                        # 検査役の答えにかかわらず人へ回す（ADR 0025 の E1。決定論で決める）
    new_screen: "新しい画面（UXSpec の screens に new: true がある）"
    brand_impact: "ブランドと印象に効く画面（UXSpec の brand_impact: true。生徒が見る画面の見た目など）"
    low_confidence: "検査役の確信度が低い"
    revisions_exhausted: "直しを 1 回使った後も直しが要る"
  viewpoints:                        # デザイン検査役の観点（definitions/design_guideline.yaml の check: design_inspector の受け皿）
    acceptance: {ja: 受け入れ条件, question: "Issue の受け入れ条件を、画面の要素と振る舞いで満たしているか"}
    package: {ja: 判断の材料, question: "概要・背景（PRD の要約）・変更点・項目定義・振る舞い・画面の流れ（コマ）・推す理由が揃い、人が好み以上の判断をできるか。推す理由が PRD の要求と対応しているか（ADR 0026）"}
    states: {ja: 状態, question: "読み込み中・空・失敗・送信中・確認など、その画面に起きる状態が揃っているか"}
    design_system: {ja: デザインシステム, question: "デザインシステムの部品と画面の型だけで組まれているか。足りない部品を gaps に出しているか"}
    content: {ja: 文言, question: "文言と表記の決まり（動詞のボタン、誤りの知らせ方、用語集の語）に沿っているか"}
    accessibility: {ja: アクセシビリティ, question: "文字と背景のコントラスト（WCAG 2.2 AA）、押せる大きさ（44pt・48dp）、色だけに頼らないか"}
    variants: {ja: 案の違い, question: "案どうしの違いが選ぶ価値のある違いか。推奨の案とその理由が妥当か"}
  severities: [must, should, nits]   # must が残る案は承認しない
