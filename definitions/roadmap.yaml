# ロードマップの進捗（建設状況の日次レポートが読む）
# 正本: 憲章 07 節のロードマップ（P0〜P6 と Exit 条件）。このファイルはそれを「測れる項目」に分けたもの。
# 割合は見積もりではなく、この表から機械的に出す（health/daily/status_report.py）。
#
# 計算:
#   項目の進捗  = done なら 1 / todo なら 0 / 数値なら min(実測 / 目標, 1)
#   フェーズ    = 項目の進捗の平均
#   全体        = フェーズの進捗を weight_weeks（憲章の期間の目安。幅があるものは中央）で重み付けした平均
#
# measure の種類（自動で測れるものは自動に寄せる。manual は PR で書き換える）:
#   manual: done | todo | 0.0〜1.0
#   github_merged_prs: { repo, target, closing? }        マージ済みの PR の数。closing: true で本文に Closes #N などがあるものだけ
#   github_files:  { repo, path, target, where? }        ディレクトリ内の YAML の数。where: { key: value } で絞る
#   build_work_files: { glob, target }                   建設作業フォルダ（50_build-work/）のファイル数
#   pairwise: { glob, target_n, threshold }              ペア比較の最新の結果（health/evals/pairwise_judge.py の出力）
#   db: { sql, target }                                  制御プレーンの Postgres（1 行 1 列の数値を返す読み取りの SQL）
#
# 測れなかった項目（取得元に届かない、Mac のフォルダが渡されていない、など）は「不明」とし、進捗は前回の値を使わず 0 で数え、
# レポートに不明として出す。欠損を隠さない（ADR 0002）。

schema_version: "0.1"

phases:
  - id: P0a
    ja: 基盤の成立
    weight_weeks: 4
    items:
      - { id: declarative_policy, ja: "宣言的ポリシー初版", measure: { manual: done } }
      - { id: headless_pr, ja: "イベント → ワーカー → PR の成功", measure: { manual: done } }
      - { id: telemetry_sources, ja: "計測の取得元と欠損率", measure: { manual: done } }
      - { id: cost_measured, ja: "コスト計測", measure: { manual: done } }
      - { id: stop_rerun, ja: "手動停止と再実行", measure: { manual: done } }

  - id: P0b
    ja: 観測の成立
    weight_weeks: 4
    items:
      - id: linked_prs
        ja: "結果が紐付いた PR（直近 20 件）"
        measure: { github_merged_prs: { repo: guccyon/rally, closing: true, target: 20 } }
      - id: health_reports
        ja: "健康レポート 4 週分"
        measure: { build_work_files: { glob: "health-reports/*.html", target: 4 } }
      - id: golden_set
        ja: "Golden Set 30 件"
        measure: { github_files: { repo: guccyon/rally, path: .factory-config/evals/golden, target: 30 } }

  - id: P1
    ja: Verify 深化
    weight_weeks: 6
    items:
      - { id: walking_skeleton, ja: "Walking Skeleton（T01〜T20）と一周シナリオ", measure: { manual: done } }
      - { id: l2_mutation_ci, ja: "L2 差分ミューテーションが全 PR で走る", measure: { manual: done } }
      - { id: l4_shadow_all, ja: "L4 の shadow 検査が全 PR で走る", measure: { manual: done } }
      - { id: sendback_judge, ja: "再試行予算・差し戻し制御（judge）", measure: { manual: done } }
      - id: l4_pairwise
        ja: "L4 のペア比較一致率 ≥ 80%"
        measure: { pairwise: { glob: "tmp/evals/pairwise-????-??-??.json", target_n: 30, threshold: 0.8 } }
      - { id: false_positive_rate, ja: "偽陽性率が計測されている", measure: { manual: done } }   # factoryctl report judgments の「検査の偽陽性率」（judge の推定と人の確認）
      - { id: l1_compat_checker, ja: "L1 の互換性チェッカー", measure: { manual: done } }   # core-gates/compat_check.py。製品の CI で shadow

  - id: P2
    ja: Ship ＋ L3
    weight_weeks: 6
    items:
      - { id: expand_contract, ja: "expand/contract のマイグレーション工程", measure: { manual: done } }   # 製品の規約の検査（rally ADR 0004）＋出荷の Rollback の下限（ADR 0012 の 6、#63）
      - { id: synthetic_seed, ja: "合成シード", measure: { manual: done } }   # 出荷が staging に 1 回だけ書く（#64、rally #240）。0.2.0 で書いた（13 秒、2026-10-30）
      - { id: release_provenance, ja: "Release と来歴", measure: { manual: done } }   # Release の来歴＋出荷の来歴（built / deployed / approved / rolled_back、report provenance の出荷の表）
      - { id: one_click_release, ja: "人間の操作が承認ボタンだけでリリースが完了した実績", measure: { manual: done } }   # rally 0.1.0・0.2.0（2026-10-30）。人の操作は操業コンソールの「本番に出す」だけ。押してから本番で確かめ終わるまで 7 秒・6 秒
      - { id: rollback_1min, ja: "Rollback が 1 分以内に完了した実績", measure: { manual: done } }   # rally 0.2.0 → 0.1.0（2026-10-30）。コンソールの「本番を前の版に戻す」から確かめ終わるまで 6.4 秒
      - { id: l3_reproducible, ja: "L3 が同じ PR に同じ判定を返す", measure: { manual: done } }   # core-gates/l3_impact.py（#56）。変更シナリオの PR 13 本に手元で 2 回ずつ、うち 4 本を製品の CI（rally の l3-impact）でも測り、digest が全件一致（2026-10-30）

  - id: P3
    ja: Learn ループ
    weight_weeks: 6
    items:
      # 2026-10-31 オーナー: 完了条件を学習の体系（ADR 0023、definitions/learning_taxonomy.yaml）に合わせて書き直す。
      # 完了は「最初に選んだテーマ（4 言葉と伝達・6 工程）で、入力から作用先まで 1 周回り、効き目を測れた」。外向きのテーマ（1・2）は P5 へ
      - { id: taxonomy, ja: "学習の体系（8 テーマ・4 型・承認の線）を定義した", measure: { manual: done } }   # ADR 0023
      - { id: case_analyst, ja: "事例型の分析役が差し戻しと停止をなぜなぜで分析し、記録に残す", measure: { manual: todo } }
      - { id: knowledge_store, ja: "知見の蓄積（形式・鮮度・矛盾の解消・形骸化の防止）と committee（決定論で担保するかの判断）", measure: { manual: todo } }   # 設計中
      - { id: theme4_loop, ja: "テーマ 4（言葉と伝達）で入力から作用先まで 1 周回り、効き目を測れた", measure: { manual: todo } }
      - { id: theme6_loop, ja: "テーマ 6（工程の進め方）で入力から作用先まで 1 周回り、効き目を測れた", measure: { manual: todo } }
      - { id: rule_adopted, ja: "テーマ 5: 自動生成ルールが shadow を経て採用され、教師信号が減った", measure: { manual: todo } }   # ADR 0013。採用とカナリアの起票は #96

  - id: P4
    ja: 上流自動化
    weight_weeks: 10
    items:
      - { id: intake_clarify, ja: "intake / clarify の窓口と要求者ペルソナ", measure: { manual: done } }   # 窓口と 10 人のペルソナ。収束は clarify_3_rounds で測る
      - { id: design_system, ja: "製品にデザインシステム（トークン・状態つきの部品の一覧・画面の型）があり、新しいプロダクトでは開始時の段として工場が作る", measure: { manual: todo } }   # ADR 0025 の完了条件 0（2026-10-31 オーナー決定）
      - { id: typed_upstream, ja: "Requirements / UXSpec / ADR / ContractDiff と Ticket の生産", measure: { manual: todo } }
      - { id: opportunity_to_ticket, ja: "テーマ 1 つから人が触らずに Requirements と段の束（依存つき）が出る", measure: { manual: todo } }   # ADR 0025 の完了条件 1
      - { id: design_variants, ja: "画面を含む段は要素と振る舞いが決まった UXSpec を持って実装に流れ、案はデザイン検査役が承認する（新しい画面・ブランド・低確信だけ人）", measure: { manual: todo } }   # ADR 0025 の 2・3
      - { id: screen_capture_taste, ja: "実装後の画面のキャプチャが PR に付き、人の違和感の印が教師信号として Learn に入る", measure: { manual: todo } }   # ADR 0025 の 4
      # 要求者ペルソナ 10 人それぞれの最新の結果のうち、確定・往復 3 回以内・意図と一致（採点役）の人数。8 人で満点（仮置き）
      # 一巡させるのは orchestrator/scripts/clarify-bench.sh
      - id: clarify_3_rounds
        ja: "clarify が往復 3 回以内で収束"
        measure:
          db:
            target: 8
            sql: >-
              select count(*) from (select distinct on (payload->>'requester') payload from events
                where name in ('request.clarified', 'request.unresolved') and payload ? 'converged'
                order by payload->>'requester', id desc) last
              where (payload->>'converged')::boolean

  - id: P5
    ja: Operate
    weight_weeks: 6
    items:
      - { id: answer_line, ja: "Answer ライン（曖昧な問いに精緻化を経て回答）", measure: { manual: todo } }
      - { id: report_line, ja: "Report ライン（週次 KPI の Routine と異常の Opportunity 化）", measure: { manual: todo } }
      - { id: kpi_error_signal, ja: "KPI 予測誤差が教師信号として流れる", measure: { manual: todo } }
      - { id: synthetic_users_loop, ja: "合成の利用者で、テーマ 1・2（利用者の体験・信頼性と性能）が入力から改善の提案まで 1 周回る", measure: { manual: todo } }   # ADR 0023。回路は P3 の間に先に作ってよい（決めどころ 3）

  - id: P6
    ja: メタ化
    weight_weeks: 8
    items:
      - { id: second_factory, ja: "Blueprint から 2 号機が生成される", measure: { manual: todo } }
      - { id: reconcile, ja: "Engine の改善が Reconcile で両工場に配布される", measure: { manual: todo } }
