# ロードマップの進捗（建設状況の日次レポートが読む）
# 正本: 憲章 07 節のロードマップ（P0〜P6 と Exit 条件）。このファイルはそれを「測れる項目」に分けたもの。
# 割合は見積もりではなく、この表から機械的に出す（health/daily/status_report.py）。
#
# 計算:
#   項目の進捗  = done なら 1 / todo なら 0 / 数値なら min(実測 / 目標, 1)
#   フェーズ    = 項目の進捗の平均
#   全体        = フェーズの進捗を weight_weeks（憲章の期間の目安。幅があるものは中央）で重み付けした平均
#
# measure の種類（自動で測れるものは自動に寄せる。manual は PR で書き換える）:
#   manual: done | todo | 0.0〜1.0
#   github_merged_prs: { repo, target, closing? }        マージ済みの PR の数。closing: true で本文に Closes #N などがあるものだけ
#   github_files:  { repo, path, target, where? }        ディレクトリ内の YAML の数。where: { key: value } で絞る
#   build_work_files: { glob, target }                   建設作業フォルダ（50_build-work/）のファイル数
#   pairwise: { glob, target_n, threshold }              ペア比較の最新の結果（health/evals/pairwise_judge.py の出力）
#   db: { sql, target }                                  制御プレーンの Postgres（1 行 1 列の数値を返す読み取りの SQL）
#
# 測れなかった項目（取得元に届かない、Mac のフォルダが渡されていない、など）は「不明」とし、進捗は前回の値を使わず 0 で数え、
# レポートに不明として出す。欠損を隠さない（ADR 0002）。

schema_version: "0.1"

phases:
  - id: P0a
    ja: 基盤の成立
    weight_weeks: 4
    items:
      - { id: declarative_policy, ja: "宣言的ポリシー初版", measure: { manual: done } }
      - { id: headless_pr, ja: "イベント → ワーカー → PR の成功", measure: { manual: done } }
      - { id: telemetry_sources, ja: "計測の取得元と欠損率", measure: { manual: done } }
      - { id: cost_measured, ja: "コスト計測", measure: { manual: done } }
      - { id: stop_rerun, ja: "手動停止と再実行", measure: { manual: done } }

  - id: P0b
    ja: 観測の成立
    weight_weeks: 4
    items:
      - id: linked_prs
        ja: "結果が紐付いた PR（直近 20 件）"
        measure: { github_merged_prs: { repo: guccyon/rally, closing: true, target: 20 } }
      - id: health_reports
        ja: "健康レポート 4 週分"
        measure: { build_work_files: { glob: "health-reports/*.html", target: 4 } }
      - id: golden_set
        ja: "Golden Set 30 件"
        measure: { github_files: { repo: guccyon/rally, path: .factory-config/evals/golden, target: 30 } }

  - id: P1
    ja: Verify 深化
    weight_weeks: 6
    items:
      - { id: walking_skeleton, ja: "Walking Skeleton（T01〜T20）と一周シナリオ", measure: { manual: done } }
      - { id: l2_mutation_ci, ja: "L2 差分ミューテーションが全 PR で走る", measure: { manual: done } }
      - { id: l4_shadow_all, ja: "L4 の shadow 検査が全 PR で走る", measure: { manual: done } }
      - { id: sendback_judge, ja: "再試行予算・差し戻し制御（judge）", measure: { manual: done } }
      - id: l4_pairwise
        ja: "L4 のペア比較一致率 ≥ 80%"
        measure: { pairwise: { glob: "tmp/evals/pairwise-????-??-??.json", target_n: 30, threshold: 0.8 } }
      - { id: false_positive_rate, ja: "偽陽性率が計測されている", measure: { manual: done } }   # factoryctl report judgments の「検査の偽陽性率」（judge の推定と人の確認）
      - { id: l1_compat_checker, ja: "L1 の互換性チェッカー", measure: { manual: done } }   # core-gates/compat_check.py。製品の CI で shadow

  - id: P2
    ja: Ship ＋ L3
    weight_weeks: 6
    items:
      - { id: expand_contract, ja: "expand/contract のマイグレーション工程", measure: { manual: done } }   # 製品の規約の検査（rally ADR 0004）＋出荷の Rollback の下限（ADR 0012 の 6、#63）
      - { id: synthetic_seed, ja: "合成シード", measure: { manual: done } }   # 出荷が staging に 1 回だけ書く（#64、rally #240）。0.2.0 で書いた（13 秒、2026-10-30）
      - { id: release_provenance, ja: "Release と来歴", measure: { manual: done } }   # Release の来歴＋出荷の来歴（built / deployed / approved / rolled_back、report provenance の出荷の表）
      - { id: one_click_release, ja: "人間の操作が承認ボタンだけでリリースが完了した実績", measure: { manual: done } }   # rally 0.1.0・0.2.0（2026-10-30）。人の操作は操業コンソールの「本番に出す」だけ。押してから本番で確かめ終わるまで 7 秒・6 秒
      - { id: rollback_1min, ja: "Rollback が 1 分以内に完了した実績", measure: { manual: done } }   # rally 0.2.0 → 0.1.0（2026-10-30）。コンソールの「本番を前の版に戻す」から確かめ終わるまで 6.4 秒
      - { id: l3_reproducible, ja: "L3 が同じ PR に同じ判定を返す", measure: { manual: done } }   # core-gates/l3_impact.py（#56）。変更シナリオの PR 13 本に手元で 2 回ずつ、うち 4 本を製品の CI（rally の l3-impact）でも測り、digest が全件一致（2026-10-30）

  - id: P3
    ja: Learn ループ
    weight_weeks: 6
    items:
      # 2026-10-31 オーナー: 完了条件を学習の体系（ADR 0023、definitions/learning_taxonomy.yaml）に合わせて書き直す。
      # 完了は「最初に選んだテーマ（4 言葉と伝達・6 工程）で、入力から作用先まで 1 周回り、効き目を測れた」。外向きのテーマ（1・2）は P5 へ
      - { id: taxonomy, ja: "学習の体系（8 テーマ・4 型・承認の線）を定義した", measure: { manual: done } }   # ADR 0023
      - { id: case_analyst, ja: "事例型の分析役が差し戻しと停止をなぜなぜで分析し、記録に残す", measure: { manual: done } }   # 2026-11-04: case.py の case_review が毎日回り、case.analyzed・CaseAnalysis に残っている（工程の束も同じ道で分析）
      - { id: knowledge_store, ja: "知見の蓄積（形式・鮮度・矛盾の解消・形骸化の防止）", measure: { manual: todo } }   # ADR 0024。形と検査 #99、rally の置き場 rally #397、変更セットの起票 #100
      - { id: committee, ja: "知見の委員会（4 役の審査と議決、週 1 の定例、置き場の構造のオーナー）。決定論で担保するかを決め、担保は Issue にしてラインで作る", measure: { manual: done } }   # 2026-11-04: 委員会の 4 役の審査（committee_review）と週 1 の定例（rally #459）が回り、決定論の担保を Issue にしてラインで作った（rally #827→#828）。ADR 0024 の 4。建設は P3 スレッド、委員会の役割・基準の変更はオーナーの承認
      - { id: theme4_loop, ja: "テーマ 4（言葉と伝達）で入力から作用先まで 1 周回り、効き目を測れた", measure: { manual: todo } }
      - { id: theme6_loop, ja: "テーマ 6（工程の進め方）で入力から作用先まで 1 周回り、効き目を測れた", measure: { manual: done } }   # 2026-11-04: CHANGELOG の衝突（工程の信号）→ 分析役の改善案 → ADR 0027 の 1・2 → 衝突の解消 403 件/日から 0 件（ADR 0027 の実施の記録）
      - { id: rule_adopted, ja: "テーマ 5: 自動生成ルールが shadow を経て採用され、教師信号が減った", measure: { manual: todo } }   # ADR 0013。採用とカナリアの起票は #96

  - id: P4
    ja: 上流自動化
    weight_weeks: 10
    items:
      - { id: intake_clarify, ja: "intake / clarify の窓口と要求者ペルソナ", measure: { manual: done } }   # 窓口と 10 人のペルソナ。収束は clarify_3_rounds で測る
      - { id: design_system, ja: "製品にデザインシステム（トークン・状態つきの部品の一覧・画面の型）があり、新しいプロダクトでは開始時の段として工場が作る", measure: { manual: todo } }   # ADR 0025 の完了条件 0（2026-10-31 オーナー決定）
      - { id: typed_upstream, ja: "Requirements / UXSpec / ADR / ContractDiff / UserStory と Ticket の生産", measure: { manual: todo } }   # UserStory の型と最初の 3 本は P5a の user_story で先に入れた（2026-11-05 オーナー）。ここではプランナーの出力にストーリー（増やす・変える・守る）を加える
      - { id: opportunity_to_ticket, ja: "テーマ 1 つから人が触らずに Requirements と段の束（依存つき）が出る", measure: { manual: todo } }   # ADR 0025 の完了条件 1
      - { id: design_variants, ja: "画面を含む段は要素と振る舞いが決まった UXSpec を持って実装に流れ、案はデザイン検査役が承認する（新しい画面・ブランド・低確信だけ人）", measure: { manual: todo } }   # ADR 0025 の 2・3
      - { id: consult_desk, ja: "外（顧客の Claude Desktop など）から窓口の API・MCP でプランナーに曖昧な依頼を壁打ちし、確定した依頼がタスクのまとまりになって指定の優先度でラインに入った", measure: { manual: todo } }   # ADR 0030 の順番 1〜3。何を流すかは外が決める。順番 1（API・会話の記録・トークン・明確な指示）と順番 2（相談役の往復・タスクのまとまりの下書き・確認 1 回で起票）・順番 3（stdio の MCP、desk-mcp/）は済み。実際の依頼で 1 本通したら done
      - { id: screen_capture_taste, ja: "実装後の画面のキャプチャが PR に付き、人の違和感の印が教師信号として Learn に入る", measure: { manual: todo } }   # ADR 0025 の 4。経路は exit_capture.py（CI の成果物 → PR の本文・受信トレイ「実装後の画面」→ taste.flagged → learn の taste_flag）。実際の PR で 1 件通したら done
      # 要求者ペルソナ 10 人それぞれの最新の結果のうち、確定・往復 3 回以内・意図と一致（採点役）の人数。8 人で満点（仮置き）
      # 一巡させるのは orchestrator/scripts/clarify-bench.sh
      - id: clarify_3_rounds
        ja: "clarify が往復 3 回以内で収束"
        measure:
          db:
            target: 8
            sql: >-
              select count(*) from (select distinct on (payload->>'requester') payload from events
                where name in ('request.clarified', 'request.unresolved') and payload ? 'converged'
                order by payload->>'requester', id desc) last
              where (payload->>'converged')::boolean

  - id: P5a
    ja: 触れる環境と QA の 1 本
    weight_weeks: 6
    # 2026-11-04 オーナー: P5 を 2 段に分ける（ADR 0028）。P5a は P4 に依存しないものから着手し、P4 の残りと並行でよい。
    # 完了は「rally で、触れる環境と Mac ランナーの上で、ユーザーストーリーから QA 役の Verdict まで 1 本通り、夜間の探索が回った」。
    # 着手はラインの再開の指示の後。アーキテクチャに触れる点（QA 役と Verdict の型、Mac ランナー、Blueprint の欄、Defect/Incident の型）は ADR 0028
    items:
      - { id: mac_runner, ja: "Mac ランナーが工場から呼べる（iOS シミュレーターの起動・インストール・画面の取得・操作・ログの回収をジョブから）", measure: { manual: todo } }   # Mac 上の MCP サーバー＋常駐。対話は要らないので Remote Control ではない。Gen1 は dispatcher から直接でもよい
      - { id: one_orchestrator, ja: "QA 役の 1 セッションがサーバ側（環境・API・DB）と Mac 側（シミュレーター）の両方に指示して 1 本のシナリオを通した", measure: { manual: todo } }   # mac_runner を QA ワーカーのツールとして渡す。2026-11-06 dispatcher/runner_relay.py（ジョブごとの中継）。QA の判定で iOS のストーリーを 1 本通したら done
      - { id: touchable_env, ja: "Release 候補ごとに触れる環境（backend ＋ Web ＋ モバイルのビルド）が 1 コマンドで立ち、シードが入り、人が URL と QR で触れる", measure: { db: { target: 1, sql: "select count(distinct payload->>'release_id') from events where name = 'release.touchable' and (payload->>'reachable_from_phone')::boolean" } } }   # Gen1 は staging を QA 環境として兼用でよい。使い捨ては P5b の ephemeral_env。factoryctl env up（orchestrator/README の「触れる環境」）。スマートフォンから届く入口を出した Release を数える
      - id: user_story
        ja: "ユーザーストーリー（誰が・何のため・入口と出口・してはいけないこと・読み手）の型があり、既存機能に 3 本以上遡って書かれた"
        measure: { github_files: { repo: guccyon/rally, path: specs/stories, where: { type: UserStory }, target: 3 } }   # 型は definitions/user_story.yaml。2026-11-05 オーナー: typed_upstream を待たずに型と 3 本を先に入れる（プランナーの出力への組み込みは P4 の typed_upstream）。最初の 3 本: コーチが新しい相談に返事する（rally #895）、生徒が月額契約して翌日も残っている、CS が「予約が消えた」の経緯を追う
      - id: qa_verdict
        ja: "QA 役が Release 候補にシナリオを流し Verdict（judge と同じ型）を出し、hold なら Defect を起票して差し戻した実績"
        measure: { db: { target: 5, sql: "select count(*) from events where name = 'qa.verdict'" } }   # 2026-11-06 QA 役（definitions/qa.yaml、factoryctl qa run）。Web の触れる環境で流す。Mac ランナーの中継は one_orchestrator
      - { id: scenario_time, ja: "時間をまたぐシナリオ（契約 → 再起動 → 翌日の再ログイン → 契約が残っている）が 1 本回る", measure: { manual: todo } }   # 環境の再起動と時計の進めを QA が起こせること
      - id: nightly_explore
        ja: "夜間に無人で探索テストが回り、朝の報告に Defect と印が出た夜"
        measure: { db: { target: 3, sql: "select count(distinct date(created_at)) from events where name = 'qa.explore'" } }   # unattended。夜間の予算の枠に入れる。印は人が採点して Golden Set へ
      - { id: defect_metrics, ja: "Defect が「どの Release・どの変更・どこで見つけた・原因の工程・観点」つきで events に残り、日報に流出防止率と発見工程の分布が出る", measure: { manual: todo } }
      - { id: quality_policy, ja: "Blueprint に品質方針の欄（アクセシビリティのレベル、扱うデータ、サポート対象の表、言葉の指針、S1 の条件）があり、rally の値が入っている", measure: { manual: todo } }   # 値は建設者が代理で仮置き。欄の型は definitions/quality_policy.yaml、rally は .factory-config/quality_policy.yaml
      - { id: product_stage, ja: "製品の段階（development / launch / operating）を Blueprint に持ち、段階で出荷先と承認が決まる（#160 の SHIP_PROD_HOLD を置き換えた）", measure: { manual: todo } }   # ADR 0012 の拡張。段階の切り替えは人。表は definitions/product_stages.yaml、記録は events の product.stage_observed
      - { id: ci_diagnose, ja: "PR ごとの依存・静的解析・秘密情報の診断が CI テンプレートで rally と factory-engine の両方に入り、shadow で結果が出ている", measure: { manual: todo } }

  - id: P5b
    ja: Operate
    weight_weeks: 6
    items:
      - { id: answer_line, ja: "Answer ライン（曖昧な問いに精緻化を経て回答）", measure: { manual: todo } }   # ADR 0030 の 4。窓口の問い合わせを 1 つの回答役がファンクションの立場を選んで根拠つきで答える
      - { id: report_line, ja: "Report ライン（週次 KPI の Routine と異常の Opportunity 化）", measure: { manual: todo } }
      - { id: kpi_error_signal, ja: "KPI 予測誤差が教師信号として流れる", measure: { manual: todo } }
      - { id: synthetic_users_loop, ja: "合成の利用者で、テーマ 1・2（利用者の体験・信頼性と性能）が入力から改善の提案まで 1 周回る", measure: { manual: todo } }   # ADR 0023。回路は P3 の間に先に作ってよい（決めどころ 3）
      - { id: severity_budget, ja: "障害の重要度（S1〜S4）の判定基準とエラーバジェットが Blueprint にあり、Incident が重要度つきで記録され、S1 がラインに割り込んで差し止めた（演習でよい）", measure: { manual: todo } }   # ADR 0028
      - id: release_train
        ja: "定期便（人の承認は便ごと 1 回）で Release が出て、S1 だけ緊急便"
        measure: { db: { target: 3, sql: "select count(*) from events where name = 'release.train'" } }
      - { id: ephemeral_env, ja: "PR ごとの使い捨て環境が立って壊れる", measure: { manual: todo } }
      - { id: preview_distribution, ja: "日中に人が並走し、TestFlight に 1 本配った（署名は人の Mac）", measure: { manual: todo } }
      - { id: quality_learn, ja: "品質の Learn（Defect と Incident を入力に、重点とシナリオの追加が自動で、基準の変更案が委員会に出た）が 1 周回った", measure: { manual: todo } }

  - id: P6
    ja: メタ化
    weight_weeks: 8
    items:
      - { id: second_factory, ja: "Blueprint から 2 号機が生成される", measure: { manual: todo } }
      - { id: reconcile, ja: "Engine の改善が Reconcile で両工場に配布される", measure: { manual: todo } }

# 商品化の条件（2026-11-01 オーナー）: P0a〜P6 を終えても Gen1 の完了にすぎず、工場の商品化はその先。
# 完全に自律で運用できることが前提。測り方（measure）が決まるまで、日報は条件を並べるだけで日付の見込みは出さない。
# 測り方は「商品化の条件を壁打ちする」の検討で決め、決まったら phases の items と同じ measure を書く
commercial:
  - { id: guardrails, ja: "完全に自律で運用できるだけのガードレール", note: "止める・戻す・人に回すの線が揃い、人が常駐しなくても事故にならない" }
  - { id: judgment_engine, ja: "自律判断のエンジン", note: "judge・検査役・プランナーが、人の判断を委任できる精度で決める（人と一致した率で測る候補）" }
  - { id: signal_improvement, ja: "運用中のシグナルからの自律改善提案（Gen2 以降）", note: "Issue だけでなく、行動ログ・利用統計・SLI・障害から改善を起こす" }
  - { id: ui_quality, ja: "プロダクトの UI の品質（言葉の選び方など）", note: "画面の文言・見た目が商品として出せる水準" }
  - { id: outside_contact, ja: "外界との接点", note: "外形監視、GitHub App、OAuth・通知の設定、報告のダッシュボード" }
