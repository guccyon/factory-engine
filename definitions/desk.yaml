# 事業部の窓口の相談役（ADR 0030 の 3。依頼の壁打ちと、タスクのまとまりの下書き）
#
# 依頼者（とその代理の Claude）が窓口で依頼を開くと、工場の中のプランナー（相談役）が clarify と同じ問いの型で往復し、
# 確定した Request と、タスクのまとまりの下書き（依存つき、要件 → 画面 → 契約 → 実装の順）を返す。
# 依頼者が下書きを 1 回確認すると、dispatcher が製品の Issue として起票し、依存のないタスクから 1 件ずつプランナーの着手判定（ADR 0026）に回す。
# 相談役は読むだけで、製品のリポジトリも Issue も書き換えない。起票・ラベル・優先度は dispatcher が結果を見て行う。
# 数値は仮置き（2026-11-05。運用しながら直す）。

schema_version: "0.1"
status: draft

consult:
  max_rounds: 3          # 依頼者への問いは 3 回まで（T20 の clarify と同じ）。使い切ったら、決まったところまでを下書きにし、残りを未確定と書いて返す（止めない）
  max_tasks: 8           # 1 つの依頼から切るタスクの上限。超えるなら依頼を分けてもらう（下書きの未確定の欄に書く）
  max_turns: 16          # 相談役のエージェントのターン（材料を読む）
  max_options: 4

# タスクの種類（下書きの並べ方の目安。起票した Issue の本文に書き、プランナーが経路を決める材料にする。経路は縛らない）
task_kinds:
  requirements: { ja: 要件, does: "製品の specs/ に要件・ユーザーストーリー・用語を書く（文書の PR）" }
  design:       { ja: 画面, does: "画面の要素・振る舞い・状態を決める（プロダクトデザイナー。デザインシステムが足りなければその仕事も）" }
  contract:     { ja: 契約, does: "API・イベント・DB の契約（specs/contracts/）を足す・変える" }
  implement:    { ja: 実装, does: "コードとテストを書く" }
  answer:       { ja: 成果物, does: "データの書き出しなど、成果物を返す仕事（Gen1 は実装のタスクとして流し、スクリプトと結果を PR に添える。P5b の Answer ライン）" }

efforts:                 # planner.yaml の efforts と同じ段
  light: 既存のものの組み合わせで済む
  standard: ふつう
  deep: ゼロから考える部分が大きい

labels:
  waiting: factory:desk-waiting   # 窓口から起票したタスクで、依存のタスクが閉じるのを待っている。閉じたら factory:plan に替わる
  trigger: factory:plan           # 依存のないタスクは、起票と同時にプランナーの着手判定へ
