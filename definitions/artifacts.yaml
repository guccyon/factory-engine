# 成果物の型定義
# 用語の正本: 30_kickoff-definition.html 第 1 節。工程間は型付き成果物で疎結合にする。
# required は型検証（Integrity: artifact_schema_failures）の対象。P0 は項目名の合意までで、JSON Schema 化は P0a 中に行う。
# 共通属性はすべての型が持つ。

schema_version: "0.1"
status: draft

common_fields:
  id: "成果物 ID（ULID）"
  type: "型名（このファイルのキー）"
  correlation_id: "起点の Signal / Request / Routine から引き継ぐ相関 ID（イベント辞書と共通）"
  produced_by: "ステージ ID（stages.yaml）"
  created_at: "ISO 8601"
  confidentiality: "product | client | public"
  parents: "入力になった成果物 ID の配列"

# 主要 15 型（開始定義で固定）
types:
  Signal:
    stage: observe
    required: [source, kind, observed_at, evidence]
    note: "行動ログ・障害・KPI・Routine の異常から"
  Request:
    stage: [intake, clarify]
    required: [requester, raw_text, status]          # status: raw | clarified
    clarified_fields: [what, why, by_when, precision]
  TaskSetDraft:
    stage: triage
    required: [status, request, tasks, unresolved, overlaps, estimate]
    note: "ADR 0030 の 3。窓口の相談役が確定した依頼から切ったタスクのまとまりの下書き（依存つき、要件 → 画面 → 契約 → 実装の順）。依頼者の確認 1 回で Issue になる。correlation_id は desk:<会話の id>"
  Opportunity:
    stage: triage
    required: [title, problem, expected_effect]      # expected_effect は必須（指標・方向・幅）
    expected_effect_fields: [metric, direction, range]
  Requirements:
    stage: define
    required: [acceptance_criteria, non_goals, success_definition]
    optional: [stories]
    note: "P4 の typed_upstream。プランナーが着手できると決めたときに出し、dispatcher が artifacts（produced_by plan）に残して Issue の本文の節に書く。stories は このタスクが増やす（add）・変える（change）・守る（keep）ユーザーストーリーの宣言（id は製品の specs/stories/。形は definitions/planner.yaml の upstream）"
  Ticket:
    stage: design
    required: [title, scope, acceptance_criteria, bounded_context]
    source_systems: ["github_issue", "jira"]
  PR:
    stage: implement
    required: [repo, number, ticket_ids, change_types]   # change_types は manifest.yaml autonomy の変更種別
  InspectionReport:
    stage: verify
    required: [pr, gate_results, defects]            # スコアではなく構造化欠陥リスト
  Release:
    stage: ship
    required: [version, environment, prs, rollback_target]
    note: "ロット（ADR 0007）。release_id は <repo>@<app_version>。Gen1 は factoryctl release create で後付けし、前の Release 以降にマージされた工場の PR をまとめて含める。environment と rollback_target は出荷の経路ができてから"
  Incident:
    stage: operate
    required: [severity, detected_at, impact, related_releases]
  KPIReport:
    stage: [operate, routine]
    required: [period, metrics, diff_from_previous, explanations]   # 前回差分の説明責任
  Retrospective:
    stage: learn
    required: [day, window_days, signals, clusters]
    note: "ADR 0013。教師信号を signature で束ねたもの（決定的）。clusters の 1 つが learn ジョブの入力になり、Lesson を 1 つ書く"
  ProcessRetrospective:
    stage: learn
    required: [day, window_days, signals, cost, clusters]
    note: "ADR 0027 の 3。工程の信号を process:<信号>:<鍵> で束ねたもの（決定的）。閾値を超えた束（route）は事例型の分析役に回る"
  HumanChoice:
    stage: [design, govern]
    required: [kind, status, question, options, recommended, subject]
    note: "ADR 0025 の P4-7。人に選んでもらう依頼（画面の案・抜き取り）。status: open | chosen | returned。options は 1〜4 件で、画像はオブジェクトストアの choices/ の下（image_key）"
  DesignConcept:
    stage: design
    required: [repo, issue, round, concepts, files]
    note: "ADR 0025・0026。デザインシステムのデザイナー役のコンセプトとトーン＆マナーの案（2〜3）。見本の画面はオブジェクトストアの design/<job>/。人が選ぶ（HumanChoice の concept_tone）"
  DesignSystemSpec:
    stage: design
    required: [repo, issue, delta, files, concept_id]
    note: "ADR 0025・0026。デザインシステムの正本（specs/design/ のファイル）。delta はいまのデザインシステムへの追加・変更。実装役が製品に置く"
  Plan:
    stage: [triage, define]
    required: [repo, issue, round, decision, steps, step_details, alternatives, design_scale, guards, advisories, summary, questions, evidence, interpretation, confidence, versions]
    note: "ADR 0025・0026。プランナーの着手判定 1 回分。decision: ready | ask | escalate。steps はタスクに合わせて組んだ役の並び（型から選ばない）、step_details は役ごとの focus・why・effort、alternatives はとらなかった並びと理由。根拠は 3 層と入力の版で残し、factoryctl plan show で見返す"
  DesignReview:
    stage: [operate, routine]
    required: [repo, week, sha, summary, strengths, findings, checked]
    note: "ADR 0022。週 1 回の設計の診断の所見（エージェントがコードを読んで書く）。人が読むためのもので、ワーカーのプロンプトにも learn の入力にも入れない"
  CaseAnalysis:
    stage: learn
    required: [incident, kind, ticket, summary, viewpoints, root_causes, learnings, had_session]
    note: "ADR 0023。事例型の分析役が 1 件の出来事（差し戻し・停止）を観点ごとになぜなぜで掘った結果。知見の置き場と committee が決まるまで記録だけ"
  CommitteeDecision:
    stage: learn
    required: [pr_url, outcome, decision, votes, enforce, added, pushed_sha]
    note: "ADR 0024。知見の委員会の議決。git の committee/D-NNNN.yaml と同じ票を、差し戻し（git に残らない）も含めて制御プレーンに残す"
  CommitteeWeekly:
    stage: learn
    required: [repo, week, facts, report]
    note: "ADR 0024。知見の委員会の週 1 の定例のまとめ"
  Lesson:
    stage: learn
    required: [teacher_signal, summary, eval_cases, knowledge_stage]   # eval ケース同梱必須。P3 からは signature・confidentiality・source_refs も（definitions/learning.yaml の lesson）
    knowledge_stage_values: [episodic, rubric, crystallized]
  Question:
    stage: [clarify, triage, design]
    required: [to, question, options, recommendation, blocking]
    to_values: [requester, operator, builder]        # 要求の精緻化は requester、業務判断は operator、憲法・安全は builder
  Approval:
    stage: [ship, govern]
    required: [kind, subject, requested_by, decision, decided_by]
    kind_values: [store_submit, infra_cost, destructive_schema, payment_logic, merge]
  Routine:
    stage: routine
    required: [id, schedule, line, output_type, audience]
  Judgment:
    stage: [implement, verify, govern]
    required: [stage, category, taxonomy_version, question, decision, evidence, interpretation, score, decided_by]
    optional: [alternatives, impact, mode, pr_url, human_grade, judged_by, verdict, recommend, recommended_replacement]
    stage_values: [provisional, judged, graded]
    note: "判断の記録（ADR 0006）。根拠・解釈・スコアの 3 層。類型と版は definitions/judgments.yaml。Question（人に問い返して止まる）の代わりに、ワーカーは仮決めして続ける。judge が人に回した（verdict=escalate）ものは recommend（judge の推奨）と recommended_replacement を持ち、受信トレイで答えると human_grade に decision・note・by・via が入る（ADR 0034）"
  Stoppage:
    stage: govern
    required: [key, category, what, started_at, detected_by]
    optional: [ended_at, waiting_for, cause, remedy, prevention, correlation_id, job_id]
    category_values: [env, perm, human, factory-bug, ticket, external, budget]   # budget は契約の使用量上限・予算・時間・ターンの超過
    detected_by_values: [watcher, supervisor, builder]
    note: "工場が止まった・遅れた事例（ADR 0005）。表は持たず events の stoppage.opened / closed を key で対にする（view stoppages）。stoppages.md は週次レポートの生成物"
  FactoryHealthReport:
    stage: govern
    required: [period, viewpoints, patterns_detected, self_report]
    note: "govern が learn と別の経路で計算する"

# 補助の型（ステージ表に出てくるもの）
auxiliary_types:
  Rejection:        { stage: triage, required: [request, reason] }
  UserStory:        { stage: define, required: [type, id, title, actor, goal, reader, entry, exit, steps, must_not] }   # ADR 0028。利用者の流れ。形は definitions/user_story.yaml、値は製品の specs/stories/。QA 役がシナリオに落として流す。タスクが増やす・変える・守るストーリーはプランナーが Requirements の stories で宣言する（P4 の typed_upstream）
  UXSpec:           { stage: design, required: [screens, states, design_system_constraints, design_system_gaps, uxspec, files, round] }   # ADR 0025。デザイナー役の案 1 回分。uxspec は definitions/ui_design.yaml の形、files は案のファイルのオブジェクトストアのキー
  DesignVerdict:    { stage: design, required: [design_artifact_id, round, decision, inspector_decision, chosen_variant, findings, evidence, interpretation, score, decided_by] }   # ADR 0025。デザイン検査役の判断（approve・revise・human）を judge と同じ 3 層で
  QAExplore:        { stage: verify, required: [repo, night, charter, env, release_id, tried, findings, interpretation, confidence] }   # ADR 0028 の nightly_explore。QA 役の夜間の探索 1 回分（試したこと・見つけたもの・印）。形は definitions/qa.yaml の explore.result
  QASynthetic:      { stage: verify, required: [repo, release_id, env, walks, timings, planted, interpretation, confidence] }   # ADR 0043 の O4。合成の利用者が歩いた 1 回分（行動ログと、中継が測った API の応答時間）。形は definitions/qa.yaml の synthetic.result
  QAVerdict:        { stage: verify, required: [repo, release_id, env, story_id, decision, confidence, steps, evidence, interpretation, defects, flags] }   # ADR 0028 の決定 2。QA 役がストーリー 1 本を流した判断（pass・hold・blocked）を judge と同じ 3 層で。形は definitions/qa.yaml
  ADR:              { stage: design, required: [title, status, context, decision, alternatives, consequences] }   # P4 の typed_upstream。プランナーが着手できると決めたときに、このタスクで新しく残す判断を出す（status は proposed）。dispatcher が artifacts（produced_by plan）に残して Issue の本文の節に書き、実装役が同じ PR で製品の docs/adr/ に書く。従う既存の ADR は Requirements の adrs_follow
  ContractDiff:     { stage: design, required: [contract, kind, compat_impact] }   # P4 の typed_upstream。プランナーが出す契約の差分（contract は specs/contracts/ のパス、kind は add・change・remove、compat_impact は none・additive・breaking、operations と summary）。置き場は製品と決定論で突き合わせる。形は definitions/planner.yaml の upstream.contracts
  SchemaDiff:       { stage: design, required: [tables, kind, destructive] }
  StoreSubmission:  { stage: ship, required: [app, version, draft_url] }
  DataRequestResult: { stage: operate, required: [request, interpretation, sample, answer] }
  Digest:           { stage: govern, required: [period, results, metric_changes, escalations, pending_decisions] }
  Defect:           { stage: verify, required: [gate, rubric_id, location, evidence, remediation_hint] }
  EvalSpec:         { stage: govern, required: [target, cases, label_def, judge, metric, confidence, threshold, grants, on_fail] }

# 保存先（実行基盤の約束: ローカル FS に置かない）
storage:
  metadata: "postgres（P0 は Postgres 単体）"
  blobs: "object store（MinIO）"
  in_repo: [Requirements, ADR, ContractDiff, SchemaDiff, Lesson, UserStory]   # 製品リポジトリにファイルとしても残す型
