# 知見の蓄積と委員会（ADR 0024）。全工場で共通の形・状態・期限・委員会の手順。
# 製品ごとの知見は製品のリポジトリの .factory-config/knowledge/ に 1 件 1 ファイル。使用の記録は制御プレーンの events。
# 決定は 2026-10-31 オーナー（知見の蓄積と委員会への回答）。数値は仮置き。

schema_version: "0.1"
status: adopted

layout:
  root: .factory-config/knowledge
  knowledge: "K-NNNN.yaml"          # 知見 1 件 1 主張・1 ファイル。最初はフラット（テーマは中の theme で引く）
  cases: "cases/C-NNNN.md"          # 事例記録（なぜなぜの過程）
  committee: "committee/D-NNNN.yaml" # 委員会の議決
  index: "INDEX.md"                 # 自動生成（core-gates/knowledge_check.py --index）。手で編集しない
  numbering: "既定ブランチの空いている次の番号。知見は製品ごとに 1 件ずつ直列に流す（supervisor・committee.turn）。ぶつかった PR は衝突の解消の前に core-gates/knowledge_renumber.py が付け直す（ADR 0024 の 2026-11-04 の追記）"
  owner: committee                  # 置き場の構造（ディレクトリの分け方）は委員会がオーナー。週 1 の定例で見直し、変えるときは Issue にしてラインで

knowledge:
  required: [id, theme, kind, statement, scope, confidence, evidence, status, verified_at, confidentiality]
  required_unless_draft: [decided_by]
  id: "^K-\\d{4,}$"
  themes: [1, 2, 3, 4, 5, 6, 7, 8]   # definitions/learning_taxonomy.yaml の themes の id
  kinds:
    fact: "この製品・業務について確かめた事実"
    term_usage: "言葉の使い分け、同じ意味の言い換えの禁止"
    practice: "こうするとうまくいく・失敗するというやり方"
    causal: "A が起きると B が起きやすいという因果（なぜなぜの結論）"
    preference: "人の好み・判断の傾向"
    hypothesis_test: "改善の仮説と予測、試した結果"
  scope_keys: [work, artifacts, roles, purpose, product_stage, request_form, code_origin, contexts, change_types, files, paths]   # 軸は下の axes（ADR 0040）。paths は files の古い名前で、移し替えまで受け付ける
  scope_required_one_of: [work, artifacts]   # 業務か成果物のどちらかは必ず書く（ADR 0040 の決定 3）。今ある知見（roles・contexts・paths だけのもの）は移し替えの変更セットで足す
  acts_on:                                   # 作用の仕方（ADR 0040 の決定 5）。書かなければ context
    context: "作業の文脈に渡す（エージェントに読ませる）"
    engine:  "文脈に渡さない。Engine のコードや工場の設定を直すべき知見。週 1 の定例が、担保のないものを Engine の改善 Issue の候補に出す（起票まで。直すのは建設者）"
    process: "文脈に渡さない。役割への指示・ラインの設定の変更の提案として人に回す（ADR 0023 の承認の線）"
  confidence:
    hypothesis: { ja: 仮説, review_days: 30, note: "事例 1 件から出た。エージェントには渡さない" }
    confirmed:  { ja: 確認済み, review_days: 90, note: "独立した事例 2 件以上で再現した、または人が承認した" }
    settled:    { ja: 確定, review_days: null, note: "決定論で担保されたか、規範（specs/）に取り込まれた。担保が外れたら confirmed に戻す" }
  status: [draft, active, stale, superseded, retired]   # ファイルは消さず状態だけ変える。id は再利用しない
  evidence_kinds: [case, pr, issue, session, event, spec, restricted]   # restricted は制限付きの保管先の不透明な id（R-NNNN）。中身は書かない
  enforcement:
    levels: [context, checklist, deterministic]
    solution_kinds: [lint, test, type, schema, ci_check, config, overlay_rule]
    note: "決定論で担保しても知見は消さず、どの解決策で担保したかを solutions に残す（Issue・PR・時期・議決）"
  confidentiality: [product, client, public]

# エージェントに渡す知見（2026-10-31 オーナー）
context_for_agents:
  include: "status=active かつ confidence が confirmed か settled（settled で deterministic の担保が効いているものは渡さない）"
  attach: [confidence, verified_at]
  usage_event: knowledge.used   # 渡した記録。数えるのは測る側
  selector: core-gates/knowledge_context.py   # 決定論で選ぶ。review_by を過ぎたもの・client の区分は渡さない。役割は scope.roles（空ならすべて）
  roles_wired: [implement, body_fix, plan, desk.consult, desk.answer, ui_design, design_system, ui_design_review, inspect, judge, qa]   # 今つないでいる役（ADR 0040 の決定 7 の 1〜5、2026-11-09）。業務は work.yaml の from_agent_steps
  limits: { items: 12, chars: 12000 }         # 仮置き。確認日の新しい順

# 知見の作用先の軸（ADR 0040 の決定 2・3）。業務が主軸で、ほかの軸は知見にタグのように付ける。軸は後から足せる（足しても、今ある知見はその軸では「書いていない」扱い）
# 値は仮置き（2026-11-07）。重み・食い違いの扱い・下限を変えるのは定義の PR（学ぶ側が自分で動かさない。ADR 0013 の 8）。
# vocabulary は値の出どころ。製品の CI が使う core-gates/knowledge_check.py は Engine の定義を読めないので、閉じた語彙はそのファイルにも写して持つ（食い違いはテストで見る）
axes:
  work:          { ja: 業務, main: true, hierarchical: true, vocabulary: "definitions/work.yaml の nodes", from: "入口（work.yaml の from_*）" }
  artifacts:     { ja: 成果物, hierarchical: true, vocabulary: "definitions/artifacts.yaml の types と work.yaml の artifact_parts", from: "業務のノードの artifacts", weight: 2, on_mismatch: penalize }
  roles:         { ja: ロール, vocabulary: "agents.yaml・workflow.yaml の役", from: "ジョブ", weight: 1, on_mismatch: penalize, note: "今の roles。語彙の検査は移し替えのあと（今は supervisor・implementer なども入っている）" }
  purpose:       { ja: 作業の目的, vocabulary: [new_feature, change, bugfix, refactor, adopt, migrate], from: "プランナーの宣言", weight: 2, on_mismatch: exclude,
                   values_ja: { new_feature: 新機能を足す, change: 既存を直す, bugfix: 不具合を直す, refactor: リファクタ, adopt: 既存のアプリを工場に載せる, migrate: 移行 } }
  product_stage: { ja: 製品の段階, vocabulary: "definitions/product_stages.yaml の stages", from: "製品の manifest の product_stage", weight: 2, on_mismatch: exclude }
  request_form:  { ja: 依頼の形, vocabulary: [ticket, one_off], from: "入口（ADR 0037 の道。ticket・direct_line はチケット、operate・quick・analysis は単発）", weight: 2, on_mismatch: exclude }
  code_origin:   { ja: コードの出どころ, vocabulary: [factory, adopted], from: "Blueprint", weight: 1, on_mismatch: exclude }
  contexts:      { ja: コンテキスト, vocabulary: "製品の specs/context-map.yaml の id（Engine の検査では見ない）", from: "プランナーの見込み", weight: 1, on_mismatch: penalize }
  change_types:  { ja: 変更種別, vocabulary: "definitions/change_type_rules.yaml（Engine の検査では見ない）", from: "差分", weight: 1, on_mismatch: penalize }
  files:         { ja: ファイル, vocabulary: "glob", from: "プランナーの見込みのファイルと差分", weight: 1, on_mismatch: penalize }
  # 依頼者（requester）は git の知見には書かない。依頼者ごとの好みは制御プレーンの DB（ADR 0040 の決定 6）

# 適応度（ADR 0040 の決定 3）。選び手が決定論で計算する。2026-11-07 仮置き
fit:
  candidates: "業務のノード自身か祖先に付いた知見と、成果物の型（親の型を含む）が合う知見"
  match: "+weight"                     # 一致（階層のある軸は、作業の値が知見の値の子でもよい）
  absent: 0                            # 知見にその軸の値がない
  unknown: -0.25                       # 作業の側の値が分からない（重みに掛ける）
  mismatch: { exclude: drop, penalize: "-weight" }
  depth: 0.5                           # 当たった業務のノードの深さ 1 段ごと
  confidence: { settled: 1, confirmed: 0 }
  freshness_days: 90                   # 確認日がこれより新しければ +0.5
  min_score: 0                         # これより低いものは渡さない
  record: "渡した知見ごとに適応度と内訳を knowledge.used に残す"


invalidation:
  - "review_by を過ぎた（日次の棚卸し）"
  - "scope のコードや specs/ が変わった、invalidate_when に当たった"
  - "根拠の PR が revert された、根拠の判断が覆った"
  - "知見に従った作業が差し戻された（反証。測る側）"
  - "60 日使われていない（測る側）"

# 変更セット: 新しい知見には、影響を受ける既存の知見の扱いを必ず添える（1 本の PR）
change_set:
  treatments: [keep, amend, supersede, retire, recheck]
  pr_body: "追加・置き換え・廃止・そのまま（理由つき）を並べる"

# 委員会（2026-10-31 オーナー: 観点別の 4 役、割れたら人。出来事ごとの持ち込み＋週 1 の定例）
committee:
  roles:
    consistency: { ja: 整合, question: "過去の知見・規範（specs/）と矛盾や重複がないか。変更セットの扱いは妥当か" }
    evidence:    { ja: 根拠, question: "一次記録に辿れるか。確かさの段は妥当か。個人情報が抽象化で切れているか" }
    enforcement: { ja: 担保, question: "決定論で担保できないか（繰り返し・確かさ・線の引きやすさ・外したときの痛さ・作る費用）" }
    dissent:     { ja: 反対, question: "採らない理由を探す。範囲が広すぎないか、反例はないか" }
  author_excluded: true          # 知見を書いた分析役は委員会に入らない
  outcomes: [adopt, enforce, human, sendback]
  split_goes_to: human
  # 議決の集め方（決定論。core-gates/committee_review.py の aggregate）。2026-10-31 仮置き
  aggregation:
    - "個人情報を見つけた役がいる → sendback"
    - "4 役とも adopt か enforce → adopt（enforce の票があれば enforce: 採用して担保の Issue を起票）"
    - "3 役以上が sendback → sendback（PR を閉じる。票は制御プレーンに残す）"
    - "それ以外（割れた・人に回す票がある・欠けた役がある）→ human（人のマージが採用、閉じれば不採用）"
  on_record: "sendback 以外は committee/D-NNNN.yaml を書き、この PR で足した下書きの知見を active にして decided_by: committee:D-NNNN を付ける。確かさは変えない（confirmed に上げるのは再現か人の承認）"
  meetings:
    per_event: "変更セットの PR の決定論の検査が緑になったら持ち込む"
    weekly: "その週の議決、決定論化の候補、期限切れ・矛盾の候補、置き場の構造をまとめて見直す"
  weekly:                        # 週 1 の定例（core-gates/committee_weekly.py）。2026-10-31 仮置き
    weekday: sunday              # JST。設計の診断（土曜）と重ならないように
    hour: 3                      # この時（JST）を過ぎたら、その週（ISO 週）に 1 回
    issue_label: "factory:knowledge-committee"   # 製品ごとの固定 Issue。週ごとのまとめをコメントで足す
    structure_review_over: 150   # 置き場の直下の知見のファイルがこれを超えたら、構造の見直しを議題に出す
    max_issues: 4                # 1 回の定例で起票する Issue の上限（見直しの変更セット 1 本＋担保＋構造）
  implements: false              # 委員会は実装しない。担保や改善は Issue にして工場のラインで作る

# 個人情報（2026-10-31 オーナー: git に一切置かない。抽象化で切る）
personal_data:
  git: forbidden
  guards: ["変更セットの CI の決定論の検出（core-gates/knowledge_check.py）", "委員会の根拠の担当"]
  restricted_store: "利用者の情報をどうしても含む知見は、制御プレーンの制限付きの保管先（専用スキーマ restricted、専用の利用者 factory_restricted だけ、読んだ記録を残す。factoryctl restricted）に置き、git からは restricted:R-NNNN で指すだけ"
