# イベント辞書（P0 Week 2 初版）
# 正本: 開始定義 第 2 節「イベント辞書と指標式が固定されている」。
# テレメトリは成果物（PR・Issue・コミット・セッション）に起きた出来事をイベントとして記録し、指標は metrics.yaml の式で計算する。
# P0 ではイベントを別サービスに流す経路がまだないので、health/telemetry/pr_metrics.py が取得元から毎回再構成する。
# P0a で成果物ストア（Postgres）ができたら、ここに定義したイベントを同じ名前で永続化する。

schema_version: "0.1"
status: draft

# 製造の来歴（ADR 0007）。job.started と PR の成果物の payload.provenance に入る。すべて optional で、取れなければ unknown（ラインは止めない）
provenance_fields: [engine_version, worker_image, worker_image_id, product_sha, mode, mode_basis, model_tier]

conventions:
  naming: "<対象>.<出来事>（小文字・スネークケース）"
  correlation_id:
    rule: "起点の Ticket（Issue）の ID。Ticket がないときは PR の ID を暫定の相関 ID にし、attribution.fallback=pr に印を付ける"
    format: "github:<owner>/<repo>#<number>"
  dedupe_key: "イベント名 ＋ 対象 ID ＋ 発生時刻（秒）。再取得しても同じイベントは 1 回しか数えない"
  retention:
    raw_events: "P0 は無期限（件数が小さい）。P1 で 24 ヶ月に見直す"
    derived_metrics: "再計算できるので保持しない。レポートの数値だけ残す"
  time: "すべて UTC の ISO 8601。表示時に Asia/Tokyo"

events:
  ticket.created:
    source: github_issue
    required: [ticket_id, created_at, author]
    note: "lead_time の起点"
  pr.opened:
    source: github_pr
    required: [pr_id, created_at, base_branch, head_branch, ticket_ids, change_types]
    note: "ticket_ids の付け方は metrics.yaml#attribution。change_types は manifest.yaml の変更種別"
  pr.commit_pushed:
    source: github_pr
    required: [pr_id, sha, committed_at]
  pr.review_submitted:
    source: pr_events
    required: [pr_id, submitted_at, state]            # state: approved | changes_requested | commented。ADR 0015 から PR の見張りが発行（pr_url, head_sha, review_id, author, source も入る）
    note: "P0 の現行運用では別エージェントのレビューは Issue コメント（本文に「レビュー」）として付くので、pr.review_comment も同じ扱いにする"
  pr.review_comment:
    source: github_pr
    required: [pr_id, created_at, is_review_round]     # is_review_round: 本文がレビューの印（REVIEW_MARKER）に一致
  # PR の見張り（ADR 0015）が発行する。source は poll | webhook。dedupe は PR と head（レビューは review_id）ごと
  pr.head_updated:
    source: pr_events
    required: [pr_url, pr_id, head_sha, source, draft]
  pr.ci_failed:
    source: pr_events
    required: [pr_url, pr_id, head_sha, source, failed]   # failed: 落ちたチェックの名前
  pr.ci_passed:
    source: pr_events
    required: [pr_url, pr_id, head_sha, source, checks]
  pr.conflicted:
    source: pr_events
    required: [pr_url, pr_id, head_sha, source]
  pr.merged:
    source: github_pr
    required: [pr_id, merged_at, merge_commit, files]  # files: {path, status, additions}
  pr.closed_unmerged:
    source: github_pr
    required: [pr_id, closed_at]
  commit.landed:
    source: git_log
    required: [sha, committed_at, subject, files]      # 既定ブランチ first-parent のみ
    note: "revert / hotfix / churn の判定材料"
  session.linked_pr:
    source: claude_code_session_log
    required: [session_id, pr_id, linked_at]
    note: "~/.claude/projects/*/*.jsonl の type=pr-link"
  session.cost_recorded:
    source: claude_code_session_log
    required: [session_id, model_usage, total_cost_usd]
    note: "type=cost-state の最後のレコード（累計）。モデル名は tier に写像する（tier_map）"
  decision.human_override:
    source: approval_log
    required: [subject_id, decided_at, automated_decision, human_decision, reason]
    note: "P0 は承認ログがないので pr-merge-criteria の判断の記録を手で写す"
  incident.opened:
    source: monitoring
    required: [incident_id, detected_at, severity, related_pr_ids]
    note: "P0 では発生源がない（Gen1 はモック環境のエラー監視を P2 で）"
  stoppage.opened:
    source: control_plane
    required: [key, category, what, detected_by]
    note: "ADR 0005。番人（dispatcher）か factoryctl が出す。dedupe_key は stoppage.opened:<key>。started_at が過去なら payload に入れる"
  stoppage.closed:
    source: control_plane
    required: [key, closed_by]
    note: "remedy（その場の手当て）、prevention（再発防止）、ended_at を任意で持つ"
  watcher.line_low:
    source: control_plane
    required: [planned, ready, low_below]
    note: "投入待ちの段（planned で保留でないチケット）が WATCH_LINE_LOW_BELOW を切った。停止ではない知らせ。line_ok が出るまで 1 度だけ。停止の Issue にコメントする"
  watcher.line_ok:
    source: control_plane
    required: [planned, ready]
    note: "line_low のあと段が積み足され、下限以上に戻った"
  supervisor.heartbeat:
    source: control_plane
    required: []
    note: "ADR 0004 の supervisor が 60 秒ごとに出す。番人は 1 度でも来てから途絶えを見る。engine_version（ADR 0031）は更新役が新しい版で回ったかを見るのに使う"
  dispatcher.started:
    source: control_plane
    required: [engine_version]
    note: "ADR 0031。dispatcher が上がった（つなぎ直しの片付けの後）。更新役が新しい版で上がったかを見る。reattaching はつなぎ直すジョブの数"
  supervisor.merge_decided:
    source: control_plane
    required: [pr_url, head_sha, change_types, table, factory_grant, execute]
    note: "ADR 0004。table は manifest の matrix と always_human_approve を引いた値、factory_grant は phase_grants の merge。両方 auto のときだけ実行する（実行は検査役の承認の後。ADR 0014）。dedupe は PR・head・結論ごと（2026-10-31）"
  supervisor.inspector_approved:
    source: control_plane
    required: [pr_url, head_sha, basis]
    note: "ADR 0014。検査役（検査＋judge）がその head を承認した。表が auto の PR はこの後にマージする。dedupe は PR と head ごと"
  supervisor.merged:
    source: control_plane
    required: [pr_url, head_sha]
    note: "ADR 0014 以降は inspector_approved の後にだけ出る"
  supervisor.inspect_enqueued:
    source: control_plane
    required: [pr_url, head_sha]
    note: "検証の起動（ADR 0004）。head ごとに 1 回。結果は gate.evaluated（mode=shadow）"
  continue.enqueued:
    source: control_plane
    required: [pr_url, head_sha, reason, attempt, continue, by]
    note: "ADR 0016・0017。工場の PR の続きのジョブ（同じチケットの implement、同じブランチに push）を積んだ。reason は conflict（衝突。head ごとに 1 回）・ci_failed（PR の見張りの pr.ci_failed）・review_fix（検査役がマージ前に採用した指摘）。ci_failed と review_fix は PR ごとに CONTINUE_MAX 回まで。dedupe は continue:{pr_url}@{head_sha}:{reason}"
  continue.limit_reached:
    source: control_plane
    required: [pr_url, reason, max]
    note: "ADR 0017。合図の続きが上限に達したので、続きのジョブを積まずに人へ回した（ci_failed は停止 ci:、review_fix は差し戻しの Issue）"
  handoff.saved:
    source: control_plane
    required: [volume, state, agent_session]
    note: "ADR 0017。実装役が作業の文脈（ticket.json・jobs/<job>/）をチケットのボリュームに残した（保留）。agent_session はエージェントの会話の記録（再開の近道）もあったか"
  handoff.removed:
    source: control_plane
    required: [volume, keep_days]
    note: "ADR 0017・0021。チケットのボリュームを消した。why が tidy なら後片付けで記録をオブジェクトストアに置いたあと、why がなければ PR がマージか閉じられてから keep_days 日たった"
  handoff.archived:
    source: control_plane
    required: [volume, blob_key, bytes, pr_url, outcome]
    note: "ADR 0021。後片付け。PR がマージか閉じられたチケットのボリュームを、選り分けずにそのまま tar.gz でオブジェクトストアに置いた（dispatcher の糸。ラインとは非同期）。outcome は merged か closed_unmerged"
  supervisor.enqueued:
    source: control_plane
    required: [repo, issue, deps]
    note: "factory:planned の Issue を、依存（本文の「依存: #N」）がすべて閉じたので factory:implement に替えた"
  ticket.received:
    source: control_plane
    required: [ticket_id, source, source_ref, priority]
    note: "ADR 0009。入口のサービス（github など）のチケットを工場の tickets に初めて写した。correlation_id は <source>:<source_ref>"
  ticket.priority_set:
    source: control_plane
    required: [ticket_id, from, to, by]
    note: "優先度を変えた。by は source（入口のラベル）| console:<名前> | factoryctl。人が変えた値は入口のラベルで上書きしない"
  ticket.held:
    source: control_plane
    required: [ticket_id, by]
    note: "保留（順番待ちから一時的に外す）。reason は任意。介入件数に数える"
  ticket.resumed:
    source: control_plane
    required: [ticket_id, by]
  job.preempted:
    source: control_plane
    required: [preempted_for, discarded_sec, requeued_as]
    note: "緊急（p0）のジョブを先に流すため、作業中のジョブを止めて順番待ちに戻した。discarded_cost_usd は取れたときだけ。割り込みが本当に要る頻度と捨てた費用を測る"
  judgment.provisional:
    source: control_plane
    required: [artifact_id, category, taxonomy_version, confidence, pr_url]
    note: "ADR 0006。ワーカーの「## 仮決め」の 1 件ごと。dedupe は job と順番。中身は artifacts の Judgment"
  product.stage_observed:
    source: control_plane
    required: [repo, stage, declared, known, by]
    note: "ADR 0028 の決定 4・ADR 0012 の追記（2026-11-05）。supervisor が製品の manifest の product_stage を読み、変わったときだけ書く。stage は効いている段階（知らない値・未宣言は development）、declared は manifest に書かれていた値。最新の 1 件が今の段階"
  release.created:
    source: control_plane
    required: [release_id, repo, app_version, prs]
    note: "ADR 0007。factoryctl release create。dedupe は release_id"
  release.included:
    source: control_plane
    required: [release_id, app_version, pr_url]
    note: "1 つの PR が入る Release は最初の 1 つ。利用者の報告や不具合を版から PR・製造の来歴へたどる鍵"
  supervisor.judge_enqueued:
    source: control_plane
    required: [pr_url, head_sha, mode, mode_basis, skipped, n_provisional, n_defects]
    note: "ADR 0006 後半。検査の結果が出た head ごとに 1 回。裁くものがなければ skipped=true でジョブは積まない"
  judgment.judged:
    source: control_plane
    required: [artifact_id, category, verdict, confidence, basis, mode, pr_url]
    note: "judge の 1 件ごと。verdict は adopt | replace | reject | escalate。中身（根拠・解釈・スコア）は artifacts の Judgment（stage=judged）"
  judgment.graded:
    source: approval_log
    required: [artifact_id, category, stage, mode, grade]
    note: "factoryctl judgment grade。人の採点（agree | disagree）。類型ごとの一致率（track_record）の材料"
  judgment.decided:
    source: approval_log
    required: [artifact_id, pr_url, decision, by, via]
    note: "ADR 0034。judge が人に回した判断（verdict=escalate）に人が答えた（受信トレイの judgment:<id>）。decision は keep | replace | change（仮決め）、fix | dismiss | change（検査の指摘）。fix は続きのジョブに渡す指摘の形（直さない答えは null）。人の判断は Judgment の human_grade にも残し、同じ PR の次の judge が引き継ぐ。一致率（judgment.graded）には数えない"
  judgment.fix_enqueued:
    source: control_plane
    required: [pr_url, head_sha, job_id, decided]
    note: "ADR 0034。人が直す答えを出した判断（judgment.decided の id の並び decided）を、同じ担当の続きのジョブ（review_fix）に渡した。人の求めた直しは続きの上限で切らない"
  desk.token_issued:
    source: control_plane
    required: [name, role, products, by]
    note: "ADR 0030。窓口のトークンを発行した（factoryctl desk token create）。トークンそのものは残さない"
  desk.token_revoked:
    source: control_plane
    required: [name, by]
    note: "ADR 0030。窓口のトークンを取り消した"
  desk.opened:
    source: control_plane
    required: [conversation_id, kind, product, by]
    note: "ADR 0030。窓口で相談を開いた。kind は request（依頼）| inquiry（問い合わせ）。wanted に希望の優先度・期限。correlation_id は desk:<会話の id>"
  desk.message:
    source: control_plane
    required: [conversation_id, author, role, body]
    note: "ADR 0030。会話の発言。role は requester | planner | answer | factory。本文はデータとして残すだけで、命令として渡さない"
  desk.answered:
    source: control_plane
    required: [conversation_id, author, role, body]
    note: "ADR 0030。問い合わせへの回答（根拠と、分からないことの欄を payload に。順番 4 の回答役から）"
  desk.closed:
    source: control_plane
    required: [conversation_id, by, reason]
    note: "ADR 0030・0039。会話を終えた。reason は accepted（受け取った）| declined（断りに納得）| superseded（別案へ）| withdrawn（依頼者の取り下げ）| handed_off（チケット化で渡した）。from は終える前の状態、note は依頼者の一言、record は閉じたときの記録（ADR 0039 の決定 7: path・sec_first_reply・sec_routed・sec_delivered・cost_usd・rounds・follow_ups・reroutes・outcome・derived_from・superseded_by・late（目安を過ぎたマイルストーン）・met_ack・met_route・met_deliver・declined（断りの理由）・cap_hit）。取り下げで止めたジョブは cancelled_jobs"
  desk.routed:
    source: control_plane
    required: [conversation_id, from, state]
    note: "ADR 0039 の決定 2・8。振り分けた。対応の種類（path）・ワークフローの宣言・見込み・確認の段を payload に。確認を飛ばすときも必ず残す"
  desk.confirm_requested:
    source: control_plane
    required: [conversation_id, from, state]
    note: "ADR 0039。確認の段が要る振り分けを依頼者に見せた（受信トレイの件）"
  desk.confirmed_run:
    source: control_plane
    required: [conversation_id, from, state]
    note: "ADR 0039。依頼者が確認したので実行に進めた（read の段は確認なしで進む）"
  desk.progress:
    source: control_plane
    required: [conversation_id]
    note: "ADR 0039 の決定 3。応答時間の目安の progress_at（仮置き 8 割）を過ぎても次の返事がないので、超える前に途中の様子（今どこまで・あとどれくらい）を会話に書いた。milestone は route | deliver、key はマイルストーンの鍵、deadline は目安の時刻。1 つのマイルストーンに 1 回（dedupe_key は desk.progress:<会話>:<鍵>）"
  desk.late:
    source: control_plane
    required: [conversation_id, milestone, key, target_sec]
    note: "ADR 0039 の決定 3・7。応答時間の目安を過ぎた（Learn の desk_late の材料）。milestone は route | deliver、path は対応の種類。1 つのマイルストーンに 1 回（dedupe_key は desk.late:<会話>:<鍵>）"
  desk.reminded:
    source: control_plane
    required: [conversation_id, round, nth, after_days, step]
    note: "ADR 0039 の決定 4・5。依頼者の答え（確認・受取確認・断り）がないので知らせ直した（definitions/desk.yaml の loop.remind_after_days。仮置き 3 日・7 日）。会話は閉じない"
  desk.escalated:
    source: control_plane
    required: [conversation_id, round, after_days, reason]
    note: "ADR 0039 の決定 4。知らせ直しても答えがないので、運用主の受信トレイに「依頼者の返事待ち」（task:desk_waiting:<会話>:<回>）を出した。会話は閉じない。依頼者が答えたら件は消える"
  desk.notice_requested:
    source: control_plane
    required: [conversation_id, what, round, text]
    note: "ADR 0039 の決定 5a。提出・断り・知らせ直しの知らせを積んだ（what は delivered | declined | reminder1 | reminder2）。to は依頼者が選んだ宛先（会話の wanted.notify。なければ done.task の既定、desk なら窓口の会話だけ）。送るのは dispatcher の周回"
  desk.notified:
    source: control_plane
    required: [conversation_id, notice_id, sent, failed, try, done]
    note: "ADR 0039 の決定 5a。知らせを送った結果（宛先ごと）。送れなかった宛先は間を空けてやり直す。desk_only は窓口の会話だけで知らせた"
  desk.notice_gave_up:
    source: control_plane
    required: [conversation_id, notice_id, failed]
    note: "ADR 0039 の決定 5a。決まった回数やり直しても送れなかったので、運用主の受信トレイ（task:desk_notice_failed）に回した"
  desk.cap_hit:
    source: control_plane
    required: [conversation_id, round, cap]
    note: "ADR 0039 の決定 4・7。実行が上限に当たったので、決まったところまでを提出した（残り remaining と次の選択肢を添える）。Learn の desk_cap_hit の材料"
  desk.delivered:
    source: control_plane
    required: [conversation_id, from, state]
    note: "ADR 0039 の決定 5。提出した（成果物の参照・所見の要約）。受取確認を待つ。断りの提出も含む"
  desk.received:
    source: control_plane
    required: [conversation_id, answer, by]
    note: "ADR 0039 の決定 4・5。依頼者の受取確認。answer は accept（受け取った）| more（続き）| return（差し戻す。一言が要る）。断りの提出（declined: true）では accept は納得した、more は別案で進める（別の依頼として開く）、return は断りを差し戻す"
  desk.declined:
    source: control_plane
    required: [conversation_id, reason]
    note: "ADR 0039 の決定 4。どの対応の種類にも当てはまらないので断った。reason は決まった語（definitions/desk.yaml の loop.decline_reasons）、alternatives は代わりの案（kind は loop.alternatives、必ず 1 つ以上）。断りも提出して受取確認を取る"
  desk.rerouted:
    source: control_plane
    required: [conversation_id, from, state, answer]
    note: "ADR 0039 の決定 5。提出への答えが続き（more）か差し戻し（return）だったので、同じ会話で振り分け（相談役）からやり直す。依頼者の一言は desk.message（kind は follow_up | returned）"
  op.started:
    source: control_plane
    required: [conversation_id, op, params, round]
    note: "ADR 0037 の決定 3・ADR 0039 の順番 2。dispatcher が決まった操作を動かし始めた（同じ回を 2 度動かさない印。dedupe_key は op.started:<会話>:<回>）"
  op.executed:
    source: control_plane
    required: [conversation_id, op, round, ok, summary]
    note: "ADR 0037 の決定 3。決まった操作を 1 回動かした結果。失敗も結果として提出する"
  op.rejected:
    source: control_plane
    required: [conversation_id, round, by]
    note: "ADR 0037 の決定 4。確認の段で依頼者（か運用主）がやめた。会話は取り下げ（withdrawn）で閉じる"
  desk.handed_off:
    source: control_plane
    required: [conversation_id, tickets]
    note: "ADR 0039 の決定 1。チケット化で起票し、製品のライン（Issue → PR）に渡した。会話は handed_off で終わる"
  desk.drafted:
    source: control_plane
    required: [conversation_id, draft_id, status, tasks]
    note: "ADR 0030 の 3。相談役がタスクのまとまりの下書きを出した（artifacts の TaskSetDraft）。status は clarified | unresolved（問いを使い切って未確定が残る）。questions_asked・overlaps・cost_usd も"
  desk.consult_skipped:
    source: control_plane
    required: [conversation_id, reason]
    note: "ADR 0030 の 6。相談役を動かさなかった。reason は cost_limit（相談 1 件の上限 DESK_CONSULT_MAX_USD）| not_a_factory_repo"
  desk.request_confirmed:
    source: control_plane
    required: [conversation_id, by, draft_id, level]
    note: "ADR 0030。依頼者が下書きを確認した（確認 1 回で投入）。level はチケットに付ける優先度。起票は dispatcher が次の周回で行う"
  desk.ticket_filed:
    source: control_plane
    required: [conversation_id, draft_id, key, number]
    note: "ADR 0030 の 3。下書きのタスク 1 つを製品の Issue に起票した（途中で止まっても、次の周回で残りから続けるための印）。label は factory:plan | factory:desk-waiting"
  desk.file_failed:
    source: control_plane
    required: [conversation_id, draft_id]
    note: "ADR 0030 の 3。起票に失敗した（次の周回で続ける）。会話に知らせる"
  desk.tickets_created:
    source: control_plane
    required: [conversation_id, draft_id, tickets]
    note: "ADR 0030。確定した依頼からチケットを作った。入口は今のラインと同じ GitHub の Issue（tickets.source は github）で、desk_conversation_id と依頼者の優先度（priority_set_by は desk:<名前>）を持つ"
  desk.task_released:
    source: control_plane
    required: [repo, issue, after]
    note: "ADR 0030 の 3。窓口から起票したタスクの依存がすべて閉じたので、factory:desk-waiting から factory:plan（プランナーの着手判定）に替えた"
  desk.imported:
    source: control_plane
    required: [conversation_id, repo, issue, by]
    note: "ADR 0030 の 3。GitHub の Issue の依頼（clarify で確定したものなど）を窓口の依頼として開き直した（factoryctl desk from-issue）"
  desk.priority_changed:
    source: control_plane
    required: [ticket_id, from, to, by]
    note: "ADR 0030。窓口からの明確な指示で優先度を変えた（壁打ちを通さない）。ticket.priority_set も同時に残る（by は desk:<名前>）。相談の中なら conversation_id"
  line.scaled:
    source: control_plane
    required: [workers, tickets, governance, by]
    note: "ADR 0029。ラインの流量の宣言（factoryctl line scale・操業コンソール）。最後のものが正本。dispatcher と supervisor が周回ごとに読む。reason は任意。desk（窓口の枠。ADR 0030 の 6）は足した後の宣言から入る（ないときは DESK_PARALLEL）"
  factory.drain_allowed:
    source: control_plane
    required: [corrs, by]
    note: "ADR 0020 の 2026-11-04 の追記。一時停止の間も流すジョブの correlation_id（factoryctl drain allow）。今の一時停止の間だけ効く"
  factory.drain_requested:
    source: control_plane
    required: [by]
    note: "ADR 0020。ラインの一時停止（factoryctl drain・操業コンソール）。dispatcher は順番待ちを取り出さず、割り込まない。reason は任意"
  factory.drain_released:
    source: control_plane
    required: [by]
    note: "ADR 0020。ラインの再開（factoryctl resume・操業コンソール）。最後の drain_requested / drain_released が今の状態"
  swap.requested:
    source: control_plane
    required: [target, kind, urgency, by]
    note: "ADR 0031。工場の更新の依頼。この event の id が swap_id、correlation_id は swap:<id>。同時に 1 件。順番 2 は factoryctl swap run（時刻の合意なしで swap.confirmed も出す）"
  swap.confirmed:
    source: control_plane
    required: [swap_id, at, by]
    note: "ADR 0031。更新の時刻を受けた（basis: manual は手での実行。プランナーの提案は順番 4）。at を過ぎたら dispatcher が更新役を起動する"
  swap.cancelled:
    source: control_plane
    required: [swap_id, by]
    note: "ADR 0031。更新役を起動する前の取り消し（factoryctl swap cancel）"
  swap.launched:
    source: control_plane
    required: [swap_id, container]
    note: "ADR 0031。dispatcher が使い捨ての更新役（コンテナ factory-swap-<id>、--rm）を起動した"
  swap.started:
    source: control_plane
    required: [swap_id]
    note: "ADR 0031。更新役が事前の確かめを始めた（ラインは止めない）"
  swap.preflight_failed:
    source: control_plane
    required: [swap_id, error]
    note: "ADR 0031。事前の確かめで止めた。何も変えていない（作ったイメージの名前は前の版に戻した）"
  swap.drained:
    source: control_plane
    required: [swap_id, by_me]
    note: "ADR 0031。一時停止を伴う更新（control_plane）でラインを一時停止した。by_me は更新役が一時停止にしたか（前から一時停止なら再開しない）"
  swap.applied:
    source: control_plane
    required: [swap_id, target_sha, prev, kind]
    note: "ADR 0031。作業ツリーを早送りし、docker compose up -d ですべてのサービスを上げた"
  swap.verified:
    source: control_plane
    required: [swap_id, checks]
    note: "ADR 0031。確かめ（版・ヘルスチェック・dispatcher と supervisor の印・コンソールと窓口・つなぎ直し）がそろった"
  swap.completed:
    source: control_plane
    required: [swap_id, target_sha, prev, kind]
    note: "ADR 0031。更新した。kind は判定（申告の重い方）、kind_declared は申告。stopped_sec は一時停止していた秒数"
  swap.rolled_back:
    source: control_plane
    required: [swap_id, target_sha, prev, reason]
    note: "ADR 0031 の決定 6。確かめに通らず前の版に戻し、戻した版は通った。同じ target_sha では自動で更新しない。受信トレイに建設者への依頼を出す"
  swap.escalated:
    source: control_plane
    required: [swap_id, reason, category]
    note: "ADR 0031 の決定 7。人に回した。category db は受信トレイ（DB の変更の承認。ボタンは順番 5）、human は停止 swap:<id>。戻しも通らないときは一時停止のまま"
  swap.failed:
    source: control_plane
    required: [swap_id, error]
    note: "ADR 0031。更新役を起動できなかったか、結果を書かずに消えた（dispatcher が見つけて停止 swap:<id> を開く）"
  job.reattached:
    source: control_plane
    required: [container]
    note: "ADR 0020。上げ直した dispatcher が、動いている（終わっている）ジョブのコンテナにつなぎ直した。job.started は出し直さない"
  factory.mode_set:
    source: control_plane
    required: [mode, by]
    note: "factoryctl mode set。until まで時間帯と既定より優先"
  sendback.filed:
    source: control_plane
    required: [origin_pr, fix_issue, fix_corr, mode, defects, replaced]
    note: "D5。judge が採用した指摘と差し替えた仮決めを 1 本の修正 Issue に起票した"
  sendback.skipped:
    source: control_plane
    required: [origin_pr, reason, items]
    note: "上限（1 PR の回数、1 日の件数）で流さなかった。人へ回す（停止として開く）"
  sendback.residual:
    source: control_plane
    required: [origin_pr, reason, items]
    note: "差し戻しの修正 PR を再検査しても指摘が残った。2 回目は流さず人へ。見直しの判断材料（20 件で上限を見直す）"
  report.daily:
    source: control_plane
    required: [date, overall, phases, cost_usd]
    note: "ADR 0008。建設状況の日次レポートのスナップショット。dedupe は report.daily:<JST の日付>。推移の折れ線はこれを読む"
  pr.body_amended:
    source: control_plane
    required: [pr_url, defects, chars]
    note: "PR 本文だけの指摘を本文の追記で直した（body_fix のジョブ）。差し戻しの回数に数えない"
  learn.retrospected:
    source: control_plane
    required: [day, signals, clusters, rubric_candidates]
    note: "ADR 0013。supervisor が 1 日 1 回、直近 30 日の教師信号を signature で束ねた。dedupe は learn.retrospected:<JST の日付>。束の中身は artifacts の Retrospective"
  learn.process_retrospected:
    source: control_plane
    required: [day, signals, cost, clusters, routed]
    note: "ADR 0027 の 3。supervisor が 1 日 1 回、直近 7 日の工程の信号を process:<信号>:<鍵> で束ねた。routed は分析役に回す閾値を超えた束。dedupe は learn.process_retrospected:<JST の日付>。束の中身は artifacts の ProcessRetrospective"
  conflict.files:
    source: control_plane
    required: [files, source]
    note: "ADR 0027 の 3。衝突の解消のジョブで衝突したファイル（機械的に解く前）。dispatcher がジョブのログの seen=[...] から残す。source は worker_log か backfill（factoryctl learn backfill-conflicts）。dedupe は conflict.files:<job_id>"
  learn.rule_filed:
    source: control_plane
    required: [signature, issue, signals, day]
    note: "ADR 0013 の 3。Stage 2 の候補で負例の元がある束から、ルール化の Issue（factory:planned）を 1 日 1 本まで起票した。工場の implement ジョブがルール変更 PR を書く。dedupe は signature ごと"
  learn.rule_transition_filed:
    source: control_plane
    required: [rule, from, to, why, issue, stats]
    note: "ADR 0013 の 6。supervisor が judge の裁きから overlay のルールの次の状態（shadow → adopted、カナリアで adopted → shadow）を判定し、state を書き換える Issue（factory:planned）を起票した。dedupe はルール・行き先・状態に入った時刻ごと"
  case.enqueued:
    source: control_plane
    required: [incident, kind, ticket, job_id, day]
    note: "ADR 0023。supervisor が事例型の分析のジョブ（kind=case_review）を積んだ。incident は sendback:<PR の URL> か stoppage:<停止の key>。1 日に learning_taxonomy.yaml の per_day 件まで。dedupe は出来事ごと"
  case.analyzed:
    source: control_plane
    required: [incident, kind, ticket, summary, viewpoints, root_causes, learnings, had_session]
    note: "ADR 0023。事例型の分析の結果（観点ごとのなぜなぜ・真因・テーマごとの学びの候補）。記録だけで、作用先にもワーカーのプロンプトにも入れない。同じ中身を artifacts の CaseAnalysis に残す。dedupe は出来事ごと"
  knowledge.case_filed:
    source: control_plane
    required: [incident, analysis_event, themes, learnings, issue, day]
    note: "ADR 0024 の 3。supervisor が事例の分析（case.analyzed）のうち最初に回すテーマ（learning_taxonomy.yaml の status: first）の学びがあるものを、知見の変更セットの Issue（factory:planned・factory:learn）にした。工場の implement ジョブが事例記録と知見の下書きを 1 本の PR に書く。1 日に KNOWLEDGE_ISSUES_PER_DAY 件まで。dedupe は出来事ごと"
  restricted.added:
    source: approval_log
    required: [id, product, knowledge_ids, by]
    note: "ADR 0024 の 5。管理者が知見の制限付きの保管先に記録を置いた（factoryctl restricted add）。id は R-NNNN。中身は専用スキーマの restricted.records に置き、ここには書かない"
  restricted.read:
    source: approval_log
    required: [id, by, purpose]
    note: "ADR 0024 の 5。制限付きの保管先の中身を読んだ（factoryctl restricted show）。誰が・何のために。restricted.reads にも同じ記録。中身は書かない"
  restricted.retired:
    source: approval_log
    required: [id, by, reason]
    note: "ADR 0024 の 5。制限付きの記録を retired にし、中身を消した。id は再利用しない"
  knowledge.used:
    source: control_plane
    required: [repo, issue, role, ids]
    note: "ADR 0024 の 6。implement のワーカー（ADR 0040 の決定 7 の 2 から body_fix、3 から plan・desk.consult も。role に役を入れる）が、委員会が採用した active で確認済み以上の知見（core-gates/knowledge_context.py が選ぶ）を文脈に渡した。ids は K-NNNN。pr_url と continue_reason を添える（プランナー・窓口では pr_url がない）。ADR 0040 で entry（ticket / continue / 実装以外は役の名前）、work（この回の業務のノード）、values（突き合わせた軸の値）、fit（知見ごとの適応度の内訳）も添える。知見に従った作業の差し戻しや、60 日使われない知見を数えるのは測る側。dedupe はジョブごと"
  committee.revise:
    source: control_plane
    required: [pr_url, head_sha, votes]
    note: "ADR 0024 の 4（2026-11-04 オーナー: 知見の PR は委員会の可決でマージし、割れたときだけ人へ）。1〜2 役が直し方を示して差し戻したので、理由を指摘として続きのジョブ（review_fix）に渡した。直して head が変われば委員会にかけ直す。同じ PR の 2 度目の revise は human の議決にする。dedupe は PR ごと"
  committee.reopened:
    source: control_plane
    required: [pr_url]
    note: "factoryctl committee reopen。人に回した知見の PR を委員会にかけ直す（それより前の committee.decided は数えない）。supervisor が積み直し、承認待ちのラベルを外す"
  process.proposal_filed:
    source: control_plane
    required: [incident, signature, day]
    note: "ADR 0027 の 3。supervisor が工程の信号の束の分析（case.analyzed の kind=process）を、工場のリポジトリ（ENGINE_REPO）への改善案の Issue（factory:process-proposal）にした（issue・analysis_event・proposals）。同じ signature の改善案が開いていれば起票せず duplicate_of だけ残す。1 日に PROCESS_ISSUES_PER_DAY 件まで。実装とマージは人の承認。dedupe は出来事ごと"
  ui_design.drafted:
    source: control_plane
    required: [repo, issue, artifact_id, round, variants, recommended, gaps]
    note: "ADR 0025。デザイナー役（kind=ui_design）が UXSpec と案のファイルを返した。ファイルは design/<job_id>/ に置き、UXSpec は artifacts に残し、デザイン検査役のジョブを積む"
  ui_design.reviewed:
    source: control_plane
    required: [repo, issue, verdict_id, design_artifact_id, round, decision, inspector_decision, human_reasons, chosen_variant, confidence, must]
    note: "ADR 0025。デザイン検査役（kind=ui_design_review）の判断。decision は委任の範囲（新しい画面・ブランド・低確信・直しの回数）を当てた後の最後の判断、inspector_decision は検査役の答え"
  ui_design.awaiting_choice:
    source: control_plane
    required: [repo, issue, design_artifact_id, verdict_id, recommended, reasons]
    note: "ADR 0025。人の選択に回した（factory:design-choice）。dedupe は案ごと"
  ui_design.chosen:
    source: human
    required: [repo, issue, design_artifact_id, variant, recommended, agree, by]
    note: "ADR 0025。人が案を選んだ（factoryctl design pick、選択の画面）。agree は検査役の推す案と一致したか（委任を広げる判断の材料）。dedupe は案ごと"
  ui_design.handed_off:
    source: control_plane
    required: [repo, issue, design_artifact_id, variant, decided_by, gaps_issue]
    note: "ADR 0025。決まった案の UXSpec を Issue の本文に足し、factory:planned に戻した。足りない部品があれば別のタスクを起票して依存にした（gaps_issue）。dedupe は案ごと"
  supervisor.committee_enqueued:
    source: control_plane
    required: [pr_url, head_sha, job_id]
    note: "ADR 0024 の 4。supervisor が変更種別 knowledge の工場の PR を、CI を通った後に知見の委員会のジョブ（kind=committee_review）へ持ち込んだ。同じ PR の検査・judge が動いている間は次の周回で積む。dedupe は PR ごと"
  committee.decided:
    source: control_plane
    required: [pr_url, outcome, decision, votes, enforce, added, pushed_sha]
    note: "ADR 0024 の 4。知見の委員会の 4 役（整合・根拠・担保・反対）の票と議決（adopt・enforce・human・sendback）。sendback 以外は議決 committee/D-NNNN.yaml と active にした知見を PR のブランチに積んだ（pushed_sha）。dispatcher が PR にまとめを書き、sendback は閉じ、human は人の承認へ、enforce は担保の Issue を起票する。同じ中身を artifacts の CommitteeDecision に残す。dedupe は PR ごと"
  committee.enforce_filed:
    source: control_plane
    required: [decision, knowledge, solution_kind, issue]
    note: "ADR 0024 の 4・6。委員会が決定論で担保すると決めた知見の担保を、委員会が実装せずに Issue（factory:planned・factory:learn）にした。工場のラインが担保を作り、知見の enforcement.solutions に記録する"
  supervisor.committee_weekly_enqueued:
    source: control_plane
    required: [repo, week, issue, job_id]
    note: "ADR 0024。supervisor が週 1 回、製品ごとに知見の委員会の定例のジョブ（kind=committee_weekly）を固定 Issue（factory:knowledge-committee）に積んだ。dedupe は repo と ISO 週"
  committee.weekly_reviewed:
    source: control_plane
    required: [repo, week, facts, report]
    note: "ADR 0024。委員会の定例のまとめ（決定論の数・期限切れと、議長役の矛盾・確かさを上げる・廃止・担保・構造の候補）。固定 Issue にコメントし、artifacts の CommitteeWeekly にも残す"
  committee.weekly_filed:
    source: control_plane
    required: [repo, week, key, issue]
    note: "ADR 0024。定例で決めた見直し（1 本の変更セット）・担保・構造の変更を、委員会が実装せずに Issue（factory:planned・factory:learn）にした。1 回に knowledge.yaml の committee.weekly.max_issues 件まで"
  supervisor.design_review_enqueued:
    source: control_plane
    required: [repo, week, issue, job_id]
    note: "ADR 0022。supervisor が週 1 回、製品ごとに設計の診断のジョブ（kind=design_review）を固定 Issue（factory:design-review）に積んだ。dedupe は supervisor.design_review:<repo>:<ISO 週>"
  design.reviewed:
    source: control_plane
    required: [repo, week, sha, summary, strengths, findings, checked]
    note: "ADR 0022。設計の診断の所見。dispatcher が記録し、固定 Issue の本文（ページのスナップショット付き）を書き換える。人が読むためのもので、ワーカーのプロンプトには入れない。dedupe は design.reviewed:<repo>:<ISO 週>。同じ中身を artifacts の DesignReview に残す"
  qa.enqueued:
    source: control_plane
    required: [repo, issue, release_id, env, stories, job_id, by]
    note: "ADR 0028 の決定 2。QA 役のジョブ（kind=qa）を固定 Issue（factory:qa）に積んだ（factoryctl qa run）。release_id はそのときの環境の版（なければ null）"
  qa.verdict:
    source: control_plane
    required: [repo, release_id, env, story_id, decision, confidence, defects, flags, verdict_id, model]
    note: "ADR 0028 の決定 2。QA 役がストーリー 1 本を流した判断（pass / hold / blocked）。同じ中身を artifacts の QAVerdict に残す。roadmap の qa_verdict はこの件数を数える。dedupe は qa.verdict:<job_id>:<story_id>"
  qa.defect_seen:
    source: control_plane
    required: [repo, release_id, story_id, verdict_id, key, issue]
    note: "ADR 0028 の決定 2。hold の Defect が、同じストーリーの同じ歩で開いている QA の Defect の Issue（key は <story_id>#<歩>）に当たったので、起票せずにその Issue に再現したことを書いた"
  runner.relayed:
    source: control_plane
    required: [tool, ok, runner, ms, args_len, n]
    note: "ADR 0028 の one_orchestrator。ジョブ（job_id）のワーカーが、dispatcher の中継（runner_relay.py）越しに Mac ランナーの道具を 1 回呼んだ。引数は長さだけ残す（打った文字は残さない）。通す道具は definitions/qa.yaml の runner_tools"
  qa.defect_filed:
    source: control_plane
    required: [repo, release_id, story_id, verdict_id, title, severity, issue]
    note: "ADR 0028 の決定 2。hold の Defect を製品の Issue（factory:qa-defect・factory:fix-proposed）にした。known_gaps に当たったものと 1 回の上限を超えたものは起票せず、固定 Issue のまとめに載せる"
  plan.decided:
    source: control_plane
    required: [plan_id, repo, issue, round, decision, steps, efforts, design_scale, guards, advisories, alternatives, confidence, versions, model, cost_usd]
    note: "ADR 0025・0026・0036・0038。workflow はワークフローの宣言の要約（skip・deep・caps・start・after・handoff）、workflow_marks は決まりで直した印（mandatory_skip・cap_clamped・no_workflow など）。decision は ready / ask / escalate / split。size は実装役に回す仕事の見積もり（触る層・ターンの帯・根拠）、oversize は当たった切る基準、tasks は切ったタスクの数、phase は実装の手前の判定なら implement。プランナーが 1 件のチケットを判定した（ready は最初の役のラベルを付けた）。steps は役の並び、guards は当てた決まり、advisories はよくある例との食い違いの印、versions は入力の版。経路ごとの結果・費用・時間と突き合わせて見返す起点"
  plan.serialized:
    source: control_plane
    required: [file, behind, hot, why]
    note: "ADR 0027 の 2。supervisor が投入の直前に、よく衝突するファイル（工程の信号 conflict_fix の束で、7 日に 3 回以上・解消の費用 $5 以上。CHANGELOG.md は除く）に触る見込みのタスクを、同じファイルに触る流れているチケット（behind）が終わるまで投入しなかった。見込みは Plan の expected_files とチケットの本文のパス。人の判断を待つ PR では並べない。dedupe は plan.serialized:<チケット>:<ファイル>:<behind>。factoryctl plan show に出る"
  workflow.shadow:
    source: control_plane
    required: [kind, repo, issue, plan_id]
    note: "ADR 0038 の順番 1（記録だけ。ラインの動きは変えない）。プランナーの宣言（Plan の workflow）と実績の差。kind=cap_hit は実績が宣言の上限を超えた（cap・declared・actual・action＝守らせていたら取った動き・declared_by_planner）、would_skip は飛ばす宣言のステップ（inspect・qa）のジョブが動いた（step・job_id）、would_wait は start: after の前のチケット（after）が開いているうちに投入した（files・why）。supervisor の workflow_shadow_step と enqueue_step が残す。dedupe は workflow.shadow:<cap|skip|wait>:<チケット>:<plan_id>[:<種類>]。factoryctl plan show と建設状況の日報に出る。上限に当たった事例はプランナーの入力（caps.md）に戻る"
  plan.asked:
    source: control_plane
    required: [plan_id, repo, issue, round, questions]
    note: "ADR 0026 の 0。着手できないので起票者に問いを返した（factory:needs-info）"
  plan.answered:
    source: control_plane
    required: [repo, issue, round]
    note: "ADR 0026 の 0。問いに返事が付いたので判定し直しを積んだ"
  plan.split:
    source: control_plane
    required: [plan_id, repo, issue, child, steps]
    note: "ADR 0026。経路の最初の役がデザインシステムで、後ろにほかの役が続くので、デザインシステムの仕事を別のチケット（child）に切った。元のチケットは factory:waiting-steps で待つ。ADR 0036 の 2: kind=tasks のときは、大きすぎるのでタスクのまとまりに切った（children に子の番号、oversize に当たった基準。child は null）。子がすべて閉じたら元のチケットを閉じる（plan.advanced の role=done）"
  plan.pre_implement:
    source: control_plane
    required: [repo, issue, why]
    note: "ADR 0036 の 3・6。実装の手前のプランナーの判定（input の phase=implement）を積んだ。why は design_handed_off（大きいが画面が先だったチケットの画面が決まった。最後の判定に印 split_after_design）か incomplete_repeated（途中終了の続きも途中終了した。factoryctl plan resplit。continuing_pr にドラフト PR）"
  plan.task_filed:
    source: control_plane
    required: [plan_id, repo, issue, key, number, label]
    note: "ADR 0036 の 2。切ったタスク 1 件を子のチケットとして起票した（依存のないものは factory:plan、あるものは factory:desk-waiting。起票は窓口と同じ desk_line.file_task）。途中で止まっても、同じ Plan の同じ key は 2 度起票しない。dedupe は plan.task_filed:<plan_id>:<key>"
  plan.outcome:
    source: control_plane
    required: [repo, issue, pr_url, merged, plan_id, planned, judgment, jobs, turns, turns_max, cost_usd, incomplete, continues, files, layers, expected_recall, expected_precision, route_changed, needs_judgment]
    note: "ADR 0036 の 4a。工場の PR がマージされた・閉じたときに、最新の Plan と実績（実装のジョブの数・ターン・費用・途中終了・続きの理由・変わったファイルと層・見込みのファイルの再現率と適合率・経路の覆り・judge が人に回したか）を突き合わせた。judgment は ok / undersized（切る基準を実績が超えた・途中終了した）/ oversized（切った子が min_turns 未満）/ misrouted（経路が覆った）。プランナーを通らなかったチケットは planned=false で同じように残す（切るべきだったかの出発点）。dedupe は plan.outcome:<pr_url>。実績の表（factoryctl plan sizes）と合格線（factoryctl plan pass）の材料"
  plan.advanced:
    source: control_plane
    required: [plan_id, repo, issue, after, role]
    note: "ADR 0026。前の役のチケット（after）が閉じたので、経路の次の役（role）のラベルを付けた"
  design_system.concepts_drafted:
    source: control_plane
    required: [repo, issue, concept_artifact_id, concepts, recommended, round, cost_usd]
    note: "ADR 0025・0026。デザインシステムのデザイナー役がコンセプトとトーン＆マナーの案を作った（artifacts の DesignConcept、見本は design/<job>/）"
  design_system.awaiting_choice:
    source: control_plane
    required: [repo, issue, concept_artifact_id, choice_id, recommended]
    note: "ADR 0025 の E2。コンセプトの案を人の選択（HumanChoice の concept_tone）に回した。ブランドに効くので必ず人"
  design_system.choice_applied:
    source: control_plane
    required: [repo, issue, choice_id, status, chosen, agreed]
    note: "人の選択を受けて次の段を積んだ（chosen は spec、returned は人の一言つきで concept の作り直し）。agreed は推す案と一致したか"
  design_system.handed_off:
    source: control_plane
    required: [repo, issue, spec_artifact_id, files, delta]
    note: "デザインシステムの正本（DesignSystemSpec）を Issue の本文に足して factory:planned にした（実装役が specs/design/ に置き、テーマを合わせる）"
  choice.requested:
    source: control_plane
    required: [artifact_id, kind, options, recommended]
    note: "ADR 0025 の P4-7。人の選択の依頼を作った（kind: design_variants＝デザイン検査役が人に回した画面の案、concept_tone＝デザインシステムのデザイナー役のコンセプトの案、taste_sample＝内部品質の抜き取り）。中身は artifacts の HumanChoice。操業コンソールの「人の選択」に出る"
  choice.made:
    source: control_plane
    required: [artifact_id, kind, option, recommended, agreed, by, reason]
    note: "人が案を選んだ。agreed は推奨と一致したか（推奨がなければ null）。デザイン検査役の委任を広げる根拠の一致率に使う。次の工程を起こすのは supervisor"
  choice.returned:
    source: control_plane
    required: [artifact_id, kind, by, reason]
    note: "人がどの案も選ばず作り手に戻した。reason は作り直しの入力"
  taste.flagged:
    source: control_plane
    required: [artifact_id, kind, option, note, signature, subject, by]
    note: "違和感の印。教師信号 taste_flag（learning.yaml）の発生源。signature は taste:<一言を詰めて 40 字>（仮。言語化の候補への寄せは learn が後で行う）。option_label・option_note は印を付けた画面（案）の名前と説明"
  choice.seen:
    source: control_plane
    required: [artifact_id, kind, by, flagged, unflagged, subject, note]
    note: "ADR 0025 の 4。人が実装後の画面（exit_capture）を見て閉じた。unflagged は印を付けなかった画面（違和感のなかった画面。taste_flag の負例の材料）"
  choice.closed:
    source: control_plane
    required: [artifact_id, kind, status, by, reason]
    note: "人を待たずに工場が依頼を閉じた（status: superseded＝新しい head のキャプチャで置き換わった、expired＝期限）。人の判断ではないので一致率に数えない"
  capture.collected:
    source: control_plane
    required: [pr_url, head_sha, app]
    note: "ADR 0025 の 4。工場の PR の head の「画面のキャプチャ / <アプリ>」の状態から CI の成果物（manifest.json と画像）を読んだ（exit_capture.py）。screens は変わった・新しい・消えた画面、choice_id は受信トレイに出した実装後の画面の依頼（変わった画面がなければ null）。成果物が読めなければ error。PR・head・アプリごとに 1 回（dedupe_key）"
  inbox.requested:
    source: control_plane
    required: [key, kind, who, title, url, action, by]
    note: "ADR 0026 の決定 7。他の工程（レビューページの承認待ち、着手判定で起票者に返した問いなど）が受信トレイに積んだ依頼（inbox.request）。who は owner / po / design_chief / builder / requester。停止・人の選択・本番待ちは積まなくても受信トレイが拾う"
  inbox.resolved:
    source: control_plane
    required: [key, by, outcome]
    note: "受信トレイの依頼が済んだ（inbox.resolve）。key は inbox.requested の key"
  inbox.notified:
    source: control_plane
    required: [key, kind, who, reason, count, channels]
    note: "受信トレイの 1 件を通知した（notify_inbox）。reason は new / renotify / escalate。key は受信トレイの key（stoppage:… / choice:… / release:… / task:…）。channels は届いた通知先（log / github-issue / slack）"
  inbox.escalated:
    source: control_plane
    required: [key, kind, who, to, age_sec]
    note: "INBOX_ESCALATE_MIN を過ぎても残っているので代理（INBOX_PROXY。Gen1 は建設者）にも知らせた"
  inbox.cleared:
    source: control_plane
    required: [key, kind, who, notified, escalated, waited_sec]
    note: "通知した件が受信トレイから消えた。waited_sec は最初の通知から消えるまで（判断待ちの滞留の SLI。ADR 0026 の決定 7）"
  gate.evaluated:
    source: inspector
    required: [pr_id, gate, result, defects]
    note: "P1 から。supervisor が積む検査ジョブ（kind=inspect）が mode=shadow で出す。InspectionReport が同じ中身を持つ"

tier_map:                        # モデル名 → tier（budgets.model_tiers）。末尾の [1m] などの文脈長の印は外して照合する
  claude-opus-5-5: tier-large
  claude-sonnet-5-5: tier-small
  claude-haiku-5-5: tier-small
  default: tier-large

sources:
  github_issue: { how: "gh api repos/{repo}/issues/{n}", auth: "gh（builder の個人トークン）" }
  github_pr:    { how: "gh api repos/{repo}/pulls（state=closed, base=既定ブランチ）＋ /commits /files /reviews、issues/{n}/comments" }
  git_log:      { how: "git log origin/<default> --first-parent --numstat", note: "手元の作業ツリーから。ヘッドレス化後はワーカーの浅いクローンから" }
  claude_code_session_log: { how: "~/.claude/projects/*/*.jsonl", note: "手元の Mac のセッションだけ。クラウドのセッションは含まれない（欠損の主因）" }
  approval_log: { how: "未実装。P0 は手入力", gap: true }
  monitoring:   { how: "未実装", gap: true }
  inspector:    { how: "検査ジョブ（worker の inspect.sh → core-gates/shadow_review.py）の結果を dispatcher が記録" }
  control_plane: { how: "制御プレーンの Postgres の events（dispatcher と factoryctl が書く）" }
