# 工程ごとのエージェント（ADR 0010）
#
# 工程（step）は「何をするか」だけを知り、どのエージェント（runner）とモデルで動かすかはここで決める。
# 呼び出しは core-gates/agent_runner.py の 1 か所に集める。工程のコードに claude などの CLI 名やモデル名を書かない。
# 2026-10-28 オーナー「差し替えられるように分離設計しつつ、今は Claude だけで良い」。実装済みの runner は claude-code だけ。
#
# 解決の順: 工程の runner / model（直接書いたとき）→ 工程の tier（呼び出し側が --tier や MODEL_TIER で上書きできる）→ tiers の表
version: 1

runners:
  claude-code:
    status: implemented       # Claude Code CLI（claude -p）。ワーカーは CLAUDE_CODE_OAUTH_TOKEN、Mac はキーチェーンの認証
  codex:
    status: not_implemented   # 例: コードレビューだけ Codex に任せる。アダプターを agent_runner.py に足してから使う
  anthropic-api:
    status: not_implemented   # API 直（ツールなしの判定を安く回すとき）

tiers:
  tier-large: {runner: claude-code, model: claude-opus-5-5}
  tier-judge: {runner: claude-code, model: claude-opus-5-5}
  tier-small: {runner: claude-code, model: claude-sonnet-5-5}
  tier-light: {runner: claude-code, model: claude-haiku-5-5}   # 型の決まった短い書き物（本文の直しなど）。2026-11-08 オーナー「確信度の高い工程から安いモデルを試す」

steps:
  implement:                  # 実装（ツールあり、リポジトリを書き換える）。dispatcher の MODEL_TIER が tier を上書きする
    tier: tier-large
    mode: agentic
  clarify.asker:              # 窓口の問い手（4 項目が埋まったかの判定と次の問い）
    tier: tier-judge
  clarify.persona:            # 要求者ペルソナ（架空）
    tier: tier-small
  clarify.grader:             # 収束の採点役（確定した要求と架空の要求者の隠れた意図を比べる。問い手より弱くしない）
    tier: tier-judge
    tools: none
  inspect:                    # L4 の shadow 判定（core-gates/shadow_review.py）
    tier: tier-judge
  judge:                      # 出口の裁き（core-gates/judge.py）
    tier: tier-judge
    tools: none
  body_fix:                   # PR 本文の説明の作り直し（core-gates/body_fix.py。2026-11-10 に追記から作り直しへ）。2026-11-08 に Sonnet から Haiku へ（確信度の高い工程から試す）
    tier: tier-light
    tools: none
  design_review:              # 週 1 回の設計の診断（core-gates/design_review.py。製品を読むだけ。ADR 0022）
    tier: tier-judge
  case_review:                # 事例型の分析役（core-gates/case_review.py。出来事の記録を読むだけ。ADR 0023）
    tier: tier-judge
  ui_design:                  # デザイナー役（core-gates/ui_design.py。UXSpec と案のモックを書く。ADR 0025）
    tier: tier-large
    mode: agentic
  design_system:              # デザインシステムのデザイナー役（core-gates/design_system.py。コンセプトの案とデザインシステムの正本を書く。ADR 0025・0026）
    tier: tier-large
    mode: agentic
  ui_design_review:           # デザイン検査役（core-gates/ui_design_review.py。案と規範の写しを読むだけ。ADR 0025）
    tier: tier-judge
  plan:                       # プランナー（core-gates/plan.py。チケットと規範の写しを読むだけ。着手判定と経路。ADR 0025・0026）
    tier: tier-small
  desk.consult:               # 窓口の相談役（core-gates/desk_consult.py。会話と規範の写しを読むだけ。問いか、Request とタスクのまとまりの下書き。ADR 0030 の 3）
    tier: tier-judge
  desk.answer:                # 窓口の回答役（core-gates/desk_answer.py。会話と工場の記録・規範の写しを読むだけ。立場を選んで根拠つきで答える。ADR 0030 の 4）
    tier: tier-small          # 読むだけで工場を変えない答えなので Sonnet から（確信度の高い工程から安いモデルを試す。日報の工程ごとの ROI で見直す）
  committee_review:           # 知見の委員会の 4 役（core-gates/committee_review.py。材料の写しを読むだけ。ADR 0024）
    tier: tier-judge
  committee_weekly:           # 知見の委員会の週 1 の定例の議長（core-gates/committee_weekly.py。材料の写しを読むだけ。ADR 0024）
    tier: tier-judge
  incident.patrol:            # 事故の調査委員会の見回り＋調査（core-gates/incident_review.py。その週の費用の記録と既存の FIR の写しを読むだけ。ADR 0046）
    tier: tier-judge
  incident.record:            # 事故の調査委員会の記録役（同上。所見から製品の情報を抜いた FIR の下書きと Engine の改善 Issue の文を書く）
    tier: tier-judge
  incident.review:            # 事故の調査委員会の査読役（同上。書いた役とは別の呼び出し。割り出せないか・一般か・重複かを見る）
    tier: tier-judge
  qa:                         # QA 役（core-gates/qa.py。触れる環境にユーザーストーリーを流し、ストーリーごとに Verdict を返す。製品は読むだけ。ADR 0028 の決定 2）
    tier: tier-judge
    mode: agentic
  pairwise:                   # 判定器のペア比較の評価（health/evals/pairwise_judge.py）
    tier: tier-judge

# 工程のモデルを比べる試し（2026-11-08 オーナー「確信度の高い工程から安いモデルを試す」）。
# 既定の tier はそのまま、条件に当たるチケットの一部だけ別の tier で流し、工程ごとの記録（費用・作業と待ちの時間・一発で通ったか・混入した Defect）を
# 建設日報の「工程ごとの ROI」で比べる。検査・judge・QA は対象にしない（Opus のまま）。
# dispatcher の model_route.py が同じ値を写して持つ（dispatcher のイメージには definitions/ を入れない。食い違いはテストで見る）
experiments:
  implement_small_sonnet:
    step: implement
    tier: tier-small            # 試す側（Sonnet）。外れた側と条件に当たらないチケットは既定の tier（MODEL_TIER）
    share: 0.2                  # 条件に当たるチケットのうち試す側に回す割合。チケットの id から決定論で決める（やり直しでも同じ側）。運用の値（環境変数 MODEL_ROUTE_SHARE で上書き、0 で止める）
    eligible:                   # プランナーの見積もり（ADR 0036 の size）がこれに当たる小さいチケット
      turns_band: [S]
      max_layers: 1             # 数える層（docs・other を除く）が 1 つまで。試験と文書だけの変更（数える層 0）も入る
      exclude_layers: [db, contract]   # マイグレーションと契約は外す（壊れたときの影響が大きい）
    back_to_default_on: [incomplete]   # 試す側で途中終了したら、続きは既定の tier に戻す（戻した回数も比べる材料）
