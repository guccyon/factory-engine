# プランナー（ADR 0025 のプランナーの節、ADR 0026 の着手判定）
#
# チケットの入口。Issue に factory:plan → プランナー（plan）が着手判定と経路を決める:
#   ready     → 経路（どの役をどの順で通すか）をタスクに合わせて組み、最初の役のラベルを付ける。指示役はラベルどおりに配る
#   ask       → 理由と選択肢つきの問いを Issue のコメントで起票者に返し、factory:needs-info。返事が付いたら判定し直す
#   escalate  → 問いの往復を使い切っても決まらない・確信が低い。factory:plan-human を付けて人に回す
# 経路は型から選ばない（2026-11-01 オーナー: パターンを固定せず、タスクに合わせて柔軟に）。examples はよくある並びの例で、縛りではない。
# 決定論で当てるのは安全のための最小限（下の guards）だけ。判断の根拠は 3 層（根拠・解釈・確信度）と、とらなかった経路と理由、
# 入力の版を Plan と plan.decided に残し、経路ごとの結果と突き合わせて後で見返す（ADR 0026）。
# プランナーは製品のリポジトリも Issue も書き換えない（読むだけ）。作用は dispatcher が結果を見て行う。
# Gen1 は、問いへの回答とチケットへの要求・要件の記載を、オーナーの代理で建設者が行う（2026-11-01 戦略会議）。
# 数値は仮置き（2026-11-01。運用しながら直す）。

schema_version: "0.1"
status: draft

labels:
  trigger: factory:plan              # チケットの入口。人か P3 のタスクの補充が付ける
  needs_info: factory:needs-info     # 起票者への問いの返事待ち
  escalate: factory:plan-human       # 人の判断待ち（往復を使い切った・確信が低い）
  waiting: factory:waiting-steps     # 経路の前の役（デザインシステムの仕事を切った別のチケット）が閉じるのを待っている

roles:                               # 経路に入れられる役。label は最初の役に回すときに付けるラベル（指示役はこれで配る）
  design_system:
    ja: デザインシステムのデザイナー
    label: factory:design-system
    does: "コンセプト・原則・ガイドラインから、トークン・部品・画面の型まで考える。デザインシステムを作る、部品や基準を足す、作り直す"
  ui_design:
    ja: プロダクトデザイナー
    label: factory:design
    does: "既存のデザインシステムから、ページや機能に固有の画面（要素・振る舞い・状態と見た目の案）に落とす"
  implement:
    ja: 実装役
    label: factory:planned
    does: "コードと契約とテストを書いて PR にする（依存が閉じてから supervisor が投入する）"

examples:                            # よくある並び（縛りではない。タスクに合わせて組み替える・役を飛ばす・並びを足す）
  - {steps: [implement], when: "画面がない、既存の画面の小さな改修で今の部品のままで足りる"}
  - {steps: [ui_design, implement], when: "新しい画面、既存の画面の作り直し、複数の画面にまたがる機能"}
  - {steps: [design_system, ui_design, implement], when: "デザインシステムがない・足りない部品や基準がある画面のタスク"}
  - {steps: [design_system], when: "デザインシステムそのものの仕事（オンボーディング、基準の追加）"}

efforts:                             # 役ごとの手間の見込み（費用と時間の計測の材料。今は記録だけで、モデルの選び分けには使わない）
  light: 既存のものの組み合わせで済む
  standard: ふつう
  deep: ゼロから考える部分が大きい

design_scales:                       # デザインの依頼の大きさ（ADR 0026 の 1）。経路を決める材料と、後で見返すための記録（経路を縛らない）
  none: 画面がない
  small: 既存の画面の小さな改修
  screen: 新しい画面 1 枚、既存の画面の作り直し
  feature: 複数の画面にまたがる新機能
  system: デザインシステムそのもの（オンボーディング、部品・基準の追加）

guards:                              # 決定論で当てる最小限（安全と、着手判定のゲート）
  no_design_system: "デザインシステムがなく、デザインの進め方の指定もない製品で、プロダクトデザイナーを通すのにデザインシステムのデザイナーを通さない経路は、問いに替える"
  low_confidence: "ready でも確信度が低ければ人へ"
  rounds_exhausted: "問いを使い切っても着手できなければ人へ"
  no_questions: "着手できないのに問いがなければ人へ"
  empty_steps: "経路が空、または知らない役だけなら人へ"

advisories:                          # 経路は変えず、見返すための印だけ付ける（よくある例との食い違い）
  small_change_with_designer: "小さな改修なのにデザイナーを通す"
  screen_without_designer: "新しい画面・作り直しなのにデザイナーを通さない"
  design_after_implement: "実装の後にデザインの役がある"

asking:
  max_rounds: 2                      # 起票者への問いは 2 回まで。3 回目の判定でも決まらなければ人へ
  max_questions: 3                   # 1 回の問いは 3 つまで（選択肢つき）
  human_below_confidence: 0.6        # ready でも確信度がこれ未満なら人へ
  answer_marker: "<!-- factory:plan-questions -->"   # 問いのコメントの印。これより後の、印のないコメントを返事とみなす

planner:
  max_turns: 12
  rules:
    - "チケットの本文と、これまでの問いと返事（comments.md）を読む。返事に書かれたことは、起票者の決定として扱う"
    - "経路は、このタスクに要る役を要る順に並べる。examples は参考で、合わなければ組み替える・飛ばす。手間（effort）の見込みも役ごとに書く"
    - "役ごとに、このタスクで何をさせるか（focus）と、なぜ要るか（why）を書く。とらなかった並びと、とらなかった理由も alternatives に書く"
    - "製品の specs/design/ があればデザインシステムがある（tokens と部品の一覧を見る）。なければ、まだない"
    - "デザインシステムがない製品で画面を含むチケットは、デザインの進め方の指定（既存の画面に倣って任せる／先にデザイン案を出す／デザインシステムを作るところから）がなければ ask にする"
    - "製品の知見（.factory-config/knowledge/）に同じ問いへの答え（プロダクトの既定）があれば、それに従い、同じ問いを繰り返さない"
    - "問いは起票者が選ぶだけで答えられる形にする（選択肢 2〜4 つと、推す選択肢）。何を決めると着手できるかを 1 文で書く"
    - "受け入れ条件がない・何を作るかが読めないチケットは ask にする（中身を推測で埋めない）"
    - "作業の量とトークンの量が小さい経路を選ぶ。上位の役が要らない仕事に上位の役を当てない"
