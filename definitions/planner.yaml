# プランナー（ADR 0025 のプランナーの節、ADR 0026 の着手判定）
#
# チケットの入口。Issue に factory:plan → プランナー（plan）が着手判定と経路を決める:
#   ready     → 経路（どの役をどの順で通すか）をタスクに合わせて組み、最初の役のラベルを付ける。指示役はラベルどおりに配る
#   ask       → 理由と選択肢つきの問いを Issue のコメントで起票者に返し、factory:needs-info。返事が付いたら判定し直す
#   escalate  → 問いの往復を使い切っても決まらない・確信が低い。factory:plan-human を付けて人に回す
#   split     → 大きすぎる（ADR 0036）。タスクのまとまりに切って子のチケットを起票し、このチケットは子がすべて閉じるのを待って閉じる
# 経路は型から選ばない（2026-11-01 オーナー: パターンを固定せず、タスクに合わせて柔軟に）。examples はよくある並びの例で、縛りではない。
# 決定論で当てるのは安全のための最小限（下の guards）だけ。判断の根拠は 3 層（根拠・解釈・確信度）と、とらなかった経路と理由、
# 入力の版を Plan と plan.decided に残し、経路ごとの結果と突き合わせて後で見返す（ADR 0026）。
# プランナーは製品のリポジトリも Issue も書き換えない（読むだけ）。作用は dispatcher が結果を見て行う。
# Gen1 は、問いへの回答とチケットへの要求・要件の記載を、オーナーの代理で建設者が行う（2026-11-01 戦略会議）。
# 数値は仮置き（2026-11-01。運用しながら直す）。

schema_version: "0.1"
status: draft

labels:
  trigger: factory:plan              # チケットの入口。人か P3 のタスクの補充が付ける
  needs_info: factory:needs-info     # 起票者への問いの返事待ち
  escalate: factory:plan-human       # 人の判断待ち（往復を使い切った・確信が低い）
  waiting: factory:waiting-steps     # 経路の前の役（デザインシステムの仕事を切った別のチケット）が閉じるのを待っている

roles:                               # 経路に入れられる役。label は最初の役に回すときに付けるラベル（指示役はこれで配る）
  design_system:
    ja: デザインシステムのデザイナー
    label: factory:design-system
    does: "コンセプト・原則・ガイドラインから、トークン・部品・画面の型まで考える。デザインシステムを作る、部品や基準を足す、作り直す。正本を書いたあと、同じチケットの中で実装役が正本のファイルを置き、両アプリのテーマと基本の部品をトークンに合わせる（経路に implement を足さなくてよい）"
  ui_design:
    ja: プロダクトデザイナー
    label: factory:design
    does: "既存のデザインシステムから、ページや機能に固有の画面（要素・振る舞い・状態と見た目の案）に落とす"
  implement:
    ja: 実装役
    label: factory:planned
    does: "コードと契約とテストを書いて PR にする（依存が閉じてから supervisor が投入する）"

examples:                            # よくある並び（縛りではない。タスクに合わせて組み替える・役を飛ばす・並びを足す）
  - {steps: [implement], when: "画面がない、既存の画面の小さな改修で今の部品のままで足りる"}
  - {steps: [ui_design, implement], when: "新しい画面、既存の画面の作り直し、複数の画面にまたがる機能"}
  - {steps: [design_system, ui_design, implement], when: "デザインシステムがない・足りない部品や基準がある画面のタスク"}
  - {steps: [design_system], when: "デザインシステムそのものの仕事（オンボーディング、基準の追加）"}

efforts:                             # 役ごとの手間の見込み（費用と時間の計測の材料。今は記録だけで、モデルの選び分けには使わない）
  light: 既存のものの組み合わせで済む
  standard: ふつう
  deep: ゼロから考える部分が大きい

design_scales:                       # デザインの依頼の大きさ（ADR 0026 の 1）。経路を決める材料と、後で見返すための記録（経路を縛らない）
  none: 画面がない
  small: 既存の画面の小さな改修
  screen: 新しい画面 1 枚、既存の画面の作り直し
  feature: 複数の画面にまたがる新機能
  system: デザインシステムそのもの（オンボーディング、部品・基準の追加）

guards:                              # 決定論で当てる最小限（安全と、着手判定のゲート）
  no_design_system: "デザインシステムがなく、デザインの進め方の指定もない製品で、プロダクトデザイナーを通すのにデザインシステムのデザイナーを通さない経路は、問いに替える"
  low_confidence: "ready でも確信度が低ければ人へ"
  rounds_exhausted: "問いを使い切っても着手できなければ人へ"
  no_questions: "着手できないのに問いがなければ人へ"
  empty_steps: "経路が空、または知らない役だけなら人へ"
  oversized: "実装役に回す仕事の見積もりが切る基準（sizing.split）に当たるなら、タスクのまとまりに切る（split）。切ったタスクがない・形が誤っていれば人へ（ADR 0036 の 2）"

advisories:                          # 経路は変えず、見返すための印だけ付ける（よくある例との食い違い）
  small_change_with_designer: "小さな改修なのにデザイナーを通す"
  screen_without_designer: "新しい画面・作り直しなのにデザイナーを通さない"
  design_after_implement: "実装の後にデザインの役がある"
  no_size: "実装役を通すのに大きさの見積もり（size）がない"
  split_after_design: "大きいが、実装役の前にデザインの役があるので、画面が決まってから実装の手前で切る（ADR 0036 の 3）"
  no_requirements: "着手できるのに要件（受け入れ条件）がない"
  no_stories: "画面を含む変更なのに、増やす・変える・守るユーザーストーリーがない"
  unknown_story: "変える・守るとしたストーリーの id が製品の specs/stories/ にない（その宣言は落とす）"
  story_exists: "増やすとしたストーリーの id がもうある（変えるとして扱う）"
  unknown_kpi: "KPI の見込みの id が製品の .factory-config/ship.yaml の kpi.metrics にない、または変化が数でない（その見込みは落とす）"
  unknown_adr: "従うとした ADR の番号が製品の docs/adr/ にない（その宣言は落とす）"
  unknown_contract: "契約の差分の置き場が製品の specs/contracts/ にない（その差分は落とす）"
  breaking_contract: "互換を壊す契約の差分がある（expand → 移行 → contract で分け、contract は人の承認。製品の ADR 0004）"
  no_contract_diff: "契約の層を触る見積もりなのに、契約の差分がない"

asking:
  max_rounds: 2                      # 起票者への問いは 2 回まで。3 回目の判定でも決まらなければ人へ
  max_questions: 3                   # 1 回の問いは 3 つまで（選択肢つき）
  human_below_confidence: 0.6        # ready でも確信度がこれ未満なら人へ
  answer_marker: "<!-- factory:plan-questions -->"   # 問いのコメントの印。これより後の、印のないコメントを返事とみなす

planner:
  max_turns: 12
  rules:
    - "チケットの本文と、これまでの問いと返事（comments.md）を読む。返事に書かれたことは、起票者の決定として扱う"
    - "経路は、このタスクに要る役を要る順に並べる。examples は参考で、合わなければ組み替える・飛ばす。手間（effort）の見込みも役ごとに書く"
    - "役ごとに、このタスクで何をさせるか（focus）と、なぜ要るか（why）を書く。とらなかった並びと、とらなかった理由も alternatives に書く"
    - "製品の specs/design/ があればデザインシステムがある（tokens と部品の一覧を見る）。なければ、まだない"
    - "デザインシステムがない製品で画面を含むチケットは、デザインの進め方の指定（既存の画面に倣って任せる／先にデザイン案を出す／デザインシステムを作るところから）がなければ ask にする"
    - "製品の知見（knowledge/knowledge.md。工場が計画の業務で選んだもの）に同じ問いへの答え（プロダクトの既定）があれば、それに従い、同じ問いを繰り返さない"
    - "問いは起票者が選ぶだけで答えられる形にする（選択肢 2〜4 つと、推す選択肢）。何を決めると着手できるかを 1 文で書く"
    - "受け入れ条件がない・何を作るかが読めないチケットは ask にする（中身を推測で埋めない）"
    - "作業の量とトークンの量が小さい経路を選ぶ。上位の役が要らない仕事に上位の役を当てない"
    - "design_system の後の implement は、正本のファイルを置くこととテーマ・基本の部品を合わせること以外の実装があるときだけ入れる（それは design_system の仕事の中で実装役が行う）"
    - "経路に implement があれば、実装役に回す仕事の大きさ（size）を見積もる。sizes.md の実績の表で、似た層の組の過去のチケットのファイル数とターンを見て帯を選ぶ（勘で選ばない）"
    - "大きさが切る基準に当たるなら、タスクのまとまりに切る（tasks）。1 回の実装でターン上限に当たる大きさのまま回さない（ADR 0036）"
    - "着手できるなら、要件（requirements）を書く。受け入れ条件はチケットに書いてあることを、利用者から見て確かめられる文に整える（中身を足さない）"
    - "着手できるなら、このタスクがどのユーザーストーリーを増やす・変える・守るか（stories）を書く。製品の specs/stories/ を読み、既存の id はそのまま使う"
    - "着手できるなら、このタスクが従う製品の ADR（adrs.follow）と、新しく残すべき判断（adrs.new）を書く。新しい判断は、後から理由を知りたくなる・取り消しにくい・ほかのタスクにも効くものだけにし、チケットと既存の ADR から読めることだけで書く"
    - "着手できるなら、契約（specs/contracts/）の差分（contract_changes）を書く。どの契約のどの操作・スキーマを足す・変える・消すか、互換への影響（none・additive・breaking）まで。契約に触らないなら空にする"
    - "ワークフロー（workflow）を宣言する。各ステップを動かすか飛ばすかと理由、どこを厚くするか、上限、出荷と Learn への渡し方、着手のしかた（start）まで（ADR 0038）"
    - "計画の前に、製品の知見（knowledge/）、実績の表（sizes.md）、上限に当たった過去の事例（caps.md）、流れているタスク（inflight.md）を読む。同じファイルで同じ上限に当たった事例があれば、上限か着手のしかたを変えて繰り返さない"
    - "流れているタスク（inflight.md）に、このチケットと同じ目的のもの（題・知見の id・解決する Issue の目的が同じ、または同じ新規ファイルを足す見込み）があれば、同時に着手しない。後に並べる（start: after）か、重複として ask で起票者に返す。どちらにしたかと根拠を書く。進んでいる PR の続きや作り直しなら、新しい PR を作らず、その PR の続きにする（ADR 0044 の決定 8。rally #1116 と #1192 が同じ担保を同時に作った）"

# 型つきの上流の成果物（P4 の typed_upstream。ADR 0025 の E5、ADR 0028 のユーザーストーリー）
# プランナーは着手できると決めたとき（ready・split）に、要件（artifacts.yaml の Requirements）と、
# このタスクが触るユーザーストーリーの宣言を出す。dispatcher が Requirements として残し、Issue の本文の節（markers の間）に書く。
# 後の役（プロダクトデザイナー・実装役）は Issue の本文を読むので、この節が受け入れ条件とストーリーを渡す。
# 増やす・変えるストーリーのファイル（specs/stories/<id>.yaml）は実装役が同じ PR で書く（プランナーは製品を書き換えない）。
# 守るストーリーは QA 役が回帰で流す候補（ADR 0028）。実装の手前の判定（phase=implement）では出し直さない（最初の判定のものを使う）
upstream:
  requirements:
    required: [acceptance_criteria, non_goals, success_definition]   # artifacts.yaml の Requirements と同じ
    max_acceptance: 10
    # 任意の KPI の見込み（ADR 0043 の O3）。{kpi, change, why}。kpi は製品の .factory-config/ship.yaml の kpi.metrics の id（ないものは落として印 unknown_kpi）。
    # change は出荷の後の週次の値の変化（KPI の単位）。週次の Report（orchestrator/dispatcher/report_kpi.py）が実測の差と突き合わせて kpi.forecast_scored に残す
    optional: [kpi_forecast]
  story_actions:                     # ストーリーへの作用（ADR 0028「タスクは どのストーリーを増やす・変える・守るか を宣言する」）
    add: "新しい利用者の流れができる。ストーリーを specs/stories/ に足す（実装役が同じ PR で書く）"
    change: "既存のストーリーの流れ（steps・exit・must_not）が変わる。実装役が同じ PR で直す"
    keep: "流れは変えないが、この変更で壊してはいけない（QA 役が回帰で流す）"
  max_stories: 6
  stories_dir: specs/stories/        # definitions/user_story.yaml の location.dir
  markers: ["<!-- factory-requirements:v1 -->", "<!-- /factory-requirements -->"]
  adr:                               # artifacts.yaml の ADR。プランナーは宣言だけ、ファイル（docs/adr/<次の番号>-<名前>.md）は実装役が同じ PR で書く
    dir: docs/adr/
    max_new: 2
    max_follow: 6
    required: [title, context, decision, alternatives, consequences]   # artifacts.yaml の ADR と同じ（status は proposed で始める）
  contracts:                         # artifacts.yaml の ContractDiff。契約の差分の宣言。契約のファイルは実装役が実装より先に直す
    dir: specs/contracts/
    max_changes: 6
    kinds:
      add: "契約のファイルを新しく足す（置き場の枝はもうある）"
      change: "既存の契約に操作・スキーマ・項目を足す・変える"
      remove: "操作・スキーマ・項目を消す（互換を壊す）"
    compat:
      none: "利用者から見て変わらない（説明・例の直し）"
      additive: "足すだけで、今の利用者は壊れない"
      breaking: "今の利用者が壊れる（消す・名前や型を変える・必須にする）"

# 大きさの見積もりと、結果との突き合わせ（ADR 0036）。数値は仮置き（2026-11-05 オーナー承認。値は運用パラメータとして工場が調整してよい）
# layers・split（実績の判定と、プランナーの見積もりに当てる基準）・bands・pass_lines。切ったタスクの型は definitions/desk.yaml の task_kinds（窓口と同じ）。
# dispatcher の plan_outcome.py が同じ値を写して持つ（食い違いはテストで見る）
sizing:
  layers:                            # 変わったファイルから層を決める（上から順に当て、最初に当たった層。どれにも当たらなければ other）。製品ごとの上書きは順番 2 で manifest から
    - {layer: db,       globs: ["**/migrations/**"]}
    - {layer: contract, globs: ["specs/contracts/**", "**/src/api/schema.ts"]}   # 契約から生成した型も契約（2026-11-05 オーナー決定）
    - {layer: docs,     globs: ["specs/**", "docs/**", "changelog.d/**", "**/*.md"]}
    - {layer: backend,  globs: ["apps/backend/**", "backend/**", "server/**"]}
    - {layer: web,      globs: ["apps/*-web/**", "web/**"]}
    - {layer: mobile,   globs: ["apps/*-app/**", "mobile/**"]}
  uncounted_layers: [docs, other]    # 切る基準の層の数に数えない
  follow_globs:                      # 追従のファイル（試験・画面の撮影の値）。層の変更がこれと生成した型だけなら、その層は数えない（other に寄せる。2026-11-05 オーナー決定）
    - "**/tests/**"
    - "**/test/**"
    - "**/screenshots/**"
    - "**/*.test.*"
    - "**/*_test.*"
  split:                             # 実装役に回す仕事 1 件が、どれか 1 つに当たれば切る（ADR 0036 の 2）。実績にも同じ基準を当てて undersized を判定する
    min_layers: 3
    max_files: 30
    max_turns: 60                    # 実装のターンの合計（衝突の解消の続きを除く）。ターン上限 120 の半分
  min_turns: 10                      # 切った子がこれ未満で終わったら切りすぎ（oversized）
  bands: {S: 30, M: 60, L: 90}       # 見込みのターンの帯の上限。L を超えると XL
  pass_lines:                        # 合格線（ADR 0036 の 4c）。実績の 4 つ。直近 window_days にチケットが min_tickets 以上あるときに測る
    window_days: 14
    min_tickets: 10
    incomplete_rate_max: 0.10
    turns_median_max: 60
    turns_p90_max: 120
    recall_median_min: 0.6
    misrouted_rate_max: 0.10
  bench:                             # 固定の評価セットのベンチの合格線（ADR 0036 の 4b・4c。12 件で 10 件以上。パイロット導入の前に満たす）
    split_ok_min: 0.83               # 切る／切らないの一致
    band_ok_min: 0.83                # 大きさの帯が ±1 帯の内（正解に帯のある件のうち）
