# レビュー観点（ルーブリック）草案 v0
# 現行のレビューは Claude の都度判断で、観点を外部化したファイルがない（棚卸し 1 節・3 節の欠落）。
# ここでは現行のルール群に散文で書かれている観点を ID 付きで外出しする。出典は 2026-10-25 時点の
#   - guccyon/cornix-layout: .claude/CLAUDE.md、docs/architecture.md、.github/pull_request_template.md、spec/
#   - アカウントスキル pr-merge-criteria
#   - Claude Code の自動メモリ（cornix-layout: merge-policy / pr-review-workflow / worktree-upstream-trap）
#
# 項目の属性
#   id               安定 ID。廃止しても再利用しない
#   gate             L0〜L4（gates.yaml）。process はゲートではなく工程の約束
#   scope            generic（Engine の core-gates に置く）| product-example（cornix-layout 固有。製品側 overlay の例）
#   knowledge_stage  episodic | rubric | crystallized（AST・spec で機械判定できる）
#   state            candidate → shadow → adopted → retired。P0 は全件 candidate（自己進化を動かさない）
#   confidentiality  product | client | public（必須）
#   check            判定のしかた。crystallized は既存の検査を指す
#   severity         must | should | nits（現行のレビュー運用の区分）

schema_version: "0.1"
status: draft
severity_policy:                     # 出典: 自動メモリ pr-review-workflow（2026-10-18）
  must: "必ず修正する"
  should: "判断して直す。直さないものは理由を返す"
  nits: "基本的に全部直す"
  oversized_fix: "指摘の修正が PR の範囲に比べて大きすぎるときは escalate"

rules:
  # ---- PR の中身・工程 ----
  - id: PR-001
    title: "コード・テスト・文書は同じ PR に入れる（三位一体）"
    gate: L1
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "コードの変更がある PR で、対応する README / docs / CHANGELOG の差分があるか。文書を検証する spec があれば CI で落ちる"
    severity: must
    source: "pr-merge-criteria「PR の中身」（2026-10-21）、自動メモリ merge-policy"

  - id: PR-002
    title: "PR の説明は背景から結論まで追える構造にする"
    gate: process
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "テンプレートの見出し（概要・背景・問題・対応内容・影響範囲・動作確認・補足）のうち変更に必要なものが埋まり、該当しないものは削除されている"
    severity: should
    source: "cornix-layout .claude/CLAUDE.md「Pull Request の説明」、.github/pull_request_template.md"

  - id: PR-003
    title: "コミットの時点でテストが全部通っている"
    gate: L1
    scope: generic
    knowledge_stage: crystallized
    state: candidate
    confidentiality: public
    check: "必須チェック（CI）が通る"
    severity: must
    source: "cornix-layout .claude/CLAUDE.md「重要な原則」、main の ruleset「Protect main」"

  - id: PR-004
    title: "必須チェックは無関係な PR でも成功で終える"
    gate: L1
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "パスで絞ったワークフローが skip で終わって必須チェックが保留にならない"
    severity: must
    source: "棚卸し 1 節（rspec.yml / vscode.yml）、cornix-layout .claude/memories/vscode_extension.md"

  - id: PROC-001
    title: "並列の PR は約束と型を先にマージしてから分ける（契約ファースト）"
    gate: process
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "同じ境界を触る PR が並ぶとき、protocol・型の PR が先行してマージ済みか"
    severity: should
    source: "cornix-layout .claude/memories/vscode_extension_v02.md「並列の PR をぶつけない」"

  - id: PROC-002
    title: "作業の知見を記録する"
    gate: process
    scope: generic
    knowledge_stage: episodic
    state: candidate
    confidentiality: public
    check: "作業完了時に Lesson（現行は .claude/memories/）が追加・更新されている"
    severity: should
    source: "cornix-layout .claude/CLAUDE.md「重要な原則」"
    note: "P3 で Lesson（eval 同梱）に置き換える"

  - id: PROC-003
    title: "push 先のブランチを明示する（upstream の取り違えで main に向かわない）"
    gate: process
    scope: generic
    knowledge_stage: episodic
    state: candidate
    confidentiality: public
    check: "push は origin <branch>:<branch> の明示、または upstream 未設定で行う"
    severity: must
    source: "自動メモリ worktree-upstream-trap（2026-10-18）"
    note: "人間の手元の worktree 規約に由来。ヘッドレスワーカーは浅いクローンで単一ブランチを扱うので、ワーカー側では手順として組み込む"

  # ---- 設計（L1 構造・L4 モデリング）----
  - id: ARCH-001
    title: "レイヤーの依存の向きを守る"
    gate: L1
    scope: generic
    knowledge_stage: crystallized
    state: candidate
    confidentiality: public
    check: "依存方向テスト（例: cornix-layout spec/architecture_spec.rb。言語非依存にするなら ast-grep）"
    severity: must
    source: "cornix-layout docs/architecture.md「レイヤーと依存の向き」"

  - id: ARCH-002
    title: "ドメインモデルを中心に置き、外側の表現（ファイル形式・バイト列）を内側に持ち込まない"
    gate: L4
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "ドメイン層の型がファイル形式・プロトコルの文字列やバイトを直接扱っていないか"
    severity: must
    source: "cornix-layout docs/architecture.md 方針 1"

  - id: ARCH-003
    title: "値は境界で一度だけ解析し、内側で再解析しない"
    gate: L4
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "同じ文字列表現をドメイン内の複数箇所でパースしていないか"
    severity: should
    source: "cornix-layout docs/architecture.md 方針 2"

  - id: ARCH-004
    title: "表現の変換は決められた口だけが行う"
    gate: L4
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "変換の責務を持つモジュール以外に、同種の変換ロジックが新設されていないか"
    severity: should
    source: "cornix-layout docs/architecture.md 方針 3"
    note: "L4 の「不変条件の所在集中度」と同じ考え方"

  - id: ARCH-005
    title: "I/O は境界の層に押し出す（ライブラリの中で入出力・プロセス終了をしない）"
    gate: L1
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "内側の層で標準入出力・ファイル・終了処理を呼んでいないか（ast-grep で結晶化できる）"
    severity: must
    source: "cornix-layout docs/architecture.md 方針 5・コード規約"

  - id: ARCH-006
    title: "知らない値を落とさない（往復で情報を失わない）"
    gate: L4
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "解釈できない入力を捨てずに保持し、書き戻しで再現するか。往復テストがあるか"
    severity: must
    source: "cornix-layout docs/architecture.md 方針 6、spec/end_to_end_spec.rb"

  - id: ARCH-007
    title: "エラーは専用の例外階層で送出し、表示は境界で行う"
    gate: L4
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "汎用例外や文字列で失敗を返していないか。利用者向けの表示を内側で組み立てていないか"
    severity: should
    source: "cornix-layout .claude/CLAUDE.md「Architecture」、lib/cornix/errors.rb"

  - id: CODE-001
    title: "値オブジェクトは生成時に検証し、不変にする"
    gate: L4
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "生成後に不正な状態を取り得ないか。配列・Hash が凍結されているか"
    severity: should
    source: "cornix-layout docs/architecture.md コード規約"

  - id: CODE-002
    title: "ファイル名と定数名を 1 対 1 にする"
    gate: L1
    scope: generic
    knowledge_stage: crystallized
    state: candidate
    confidentiality: public
    check: "パスと名前空間の対応を機械判定（Zeitwerk 規約相当）"
    severity: nits
    source: "cornix-layout docs/architecture.md コード規約"

  - id: CODE-003
    title: "テストは本体と同じ層の構成に置く"
    gate: L1
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "spec / test のディレクトリ構成が本体の層に対応しているか"
    severity: nits
    source: "cornix-layout docs/architecture.md コード規約"

  # ---- 文書 ----
  - id: DOC-001
    title: "二言語の README を同じ構造に保つ"
    gate: L1
    scope: product-example
    knowledge_stage: crystallized
    state: candidate
    confidentiality: product
    check: "cornix-layout spec/docs/readme_sync_spec.rb（見出しの並び・コードブロック・リンク）"
    severity: must
    source: "cornix-layout .claude/CLAUDE.md「README の同期」"
    note: "「文書の正しさを検査でとる」の実例。汎用化するなら『対になる文書の構造一致』"

  - id: DOC-002
    title: "利用者に見える変更は CHANGELOG の [Unreleased] に足す"
    gate: L1
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "利用者に見える変更を含む PR に CHANGELOG の差分があるか"
    severity: should
    source: "cornix-layout .claude/CLAUDE.md「バージョンとリリース」"

  # ---- 安全（autonomy と重なるもの。判定はここ、権限は manifest.yaml）----
  - id: SAFE-001
    title: "実機・本番など外部への破壊的な書き込みは利用者の同意なしに行わない"
    gate: process
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "外部への書き込みを含む手順に Approval が挟まっているか"
    severity: must
    source: "cornix-layout .claude/CLAUDE.md「重要な原則」、自動メモリ cornix-rawhid-direct"
    autonomy_ref: "manifest.yaml autonomy.always_human_approve"

  - id: SAFE-002
    title: "依存パッケージの更新は破壊的変更を読み、最新の main に重ねて検証してから入れる"
    gate: process
    scope: generic
    knowledge_stage: rubric
    state: candidate
    confidentiality: public
    check: "changelog の破壊的変更の確認、最新の main に重ねたローカル検証、CI 成功の 3 点"
    severity: must
    source: "自動メモリ merge-policy（2026-10-24、cornix-layout #51・#52）"
