# 工場の制御プレーン（P0 最小構成。ローカル Mac の Docker Compose）
# 状態は postgres / objectstore（S3 互換）に置き、ワーカーは dispatcher が docker run --rm で使い捨てる（ADR 0003）。
# 秘密情報は .env（.env.example を写す）。リポジトリに入れない。
name: factory

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 互換のオブジェクトストア（ワーカーのログなど）。MinIO のイメージが Docker Hub から取得できなくなっていたため versitygw を使う（ADR 0003）
  objectstore:
    image: versity/versitygw:v1.10.0   # 版を固定する（latest だと作り直すたびに中身が変わる）。上げるときはここを変える PR で
    command: ["--access", "${OBJECTSTORE_ACCESS_KEY:-factory}", "--secret", "${OBJECTSTORE_SECRET_KEY:-factory-objectstore}", "--port", ":7070", "posix", "/data"]
    volumes:
      - objectdata:/data
    ports:
      - "127.0.0.1:${OBJECTSTORE_PORT:-7070}:7070"

  dispatcher:
    build: ./dispatcher
    image: factory-dispatcher:p0
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      OBJECTSTORE_ENDPOINT: objectstore:7070
      OBJECTSTORE_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-factory}
      OBJECTSTORE_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-factory-objectstore}
      OBJECTSTORE_BUCKET: factory-artifacts
      # 対象リポジトリ（カンマ区切り）とラベル
      FACTORY_REPOS: ${FACTORY_REPOS:-guccyon/rally}
      TRIGGER_LABEL: ${TRIGGER_LABEL:-factory:implement}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
      # 同時実行・予算（Blueprint runtime / budgets から。実測で調整）
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      MAX_TURNS: ${MAX_TURNS:-40}
      TOKEN_BUDGET_PER_JOB: ${TOKEN_BUDGET_PER_JOB:-2000000}
      JOB_TIMEOUT_SEC: ${JOB_TIMEOUT_SEC:-2400}
      MODEL_TIER: ${MODEL_TIER:-tier-large}
      # ワーカーに渡す秘密情報（.env）
      GH_TOKEN: ${GH_TOKEN:?GitHub token for the worker (.env)}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token の値 (.env)}
      WORKER_IMAGE: factory-worker:p0
      WORKER_IMAGES: ${WORKER_IMAGES:-}      # リポジトリごとの上書き（例: guccyon/rally=factory-worker:rust）
      JOB_DB_ENABLED: ${JOB_DB_ENABLED:-1}     # ジョブごとに job_<id> の DB を作ってワーカーに DATABASE_URL で渡す
      JOB_DB_NETWORK: factory_default
      WORKER_DRY_RUN: ${WORKER_DRY_RUN:-}
      # 番人（ADR 0005）。閾値は仮置き。通知は 1 経路（github-issue: STATUS_REPO の工場状況 Issue / log: ログだけ）
      WATCH_ENABLED: ${WATCH_ENABLED:-1}
      WATCH_IDLE_MIN: ${WATCH_IDLE_MIN:-20}
      WATCH_HEARTBEAT_MIN: ${WATCH_HEARTBEAT_MIN:-30}
      NOTIFIER: ${NOTIFIER:-github-issue}
      STATUS_REPO: ${STATUS_REPO:-guccyon/factory-engine}
      # 来歴（ADR 0007）。上げ直すときに Engine の版（git rev-parse --short HEAD）を入れる。モードは judge（ADR 0006 後半）まで unknown
      ENGINE_VERSION: ${ENGINE_VERSION:-unknown}
      FACTORY_MODE: ${FACTORY_MODE:-}
      MODE_SCHEDULE: ${MODE_SCHEDULE:-}             # 例: unattended=22:00-08:00（Asia/Tokyo）。factoryctl mode set が優先
      # 差し戻し（ADR 0006 / D5）。上限は仮置き
      SENDBACK_PER_PR: ${SENDBACK_PER_PR:-1}
      SENDBACK_DAILY_MAX: ${SENDBACK_DAILY_MAX:-5}
      LOW_CONFIDENCE: ${LOW_CONFIDENCE:-0.6}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_PORT: 8787
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${WEBHOOK_HOST_PORT:-8787}:8787"
    restart: unless-stopped

  # 工場長の supervisor（ADR 0004）。判断は持たず、表を見て工程を起動するだけ。dispatcher と同じイメージで別プロセス
  supervisor:
    image: factory-dispatcher:p0
    command: ["python", "supervisor.py"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      FACTORY_REPOS: ${FACTORY_REPOS:-guccyon/rally}
      TRIGGER_LABEL: ${TRIGGER_LABEL:-factory:implement}
      GH_TOKEN: ${GH_TOKEN:?GitHub token (.env)}
      SUPERVISOR_GH_TOKEN: ${SUPERVISOR_GH_TOKEN:-}   # マージ権限を分けるときの別トークン。空ならワーカーと同じ
      SUPERVISOR_INTERVAL_SEC: ${SUPERVISOR_INTERVAL_SEC:-60}
      SUPERVISOR_MAX_INFLIGHT: ${SUPERVISOR_MAX_INFLIGHT:-1}
      SUPERVISOR_DRY_RUN: ${SUPERVISOR_DRY_RUN:-}
      SUPERVISOR_INSPECT: ${SUPERVISOR_INSPECT:-1}       # 工場の PR ごとに検査ジョブ（L4 の shadow 判定）を積む
      SUPERVISOR_JUDGE: ${SUPERVISOR_JUDGE:-1}           # 検査のあと、仮決めと指摘を裁く judge のジョブを積む（ADR 0006）
      FACTORY_MODE: ${FACTORY_MODE:-}                    # 既定のモード（attended）。製品の manifest に持たせるのは承認付き PR で
      MODE_SCHEDULE: ${MODE_SCHEDULE:-}
      CHANGE_TYPE_RULES: /definitions/change_type_rules.yaml
      # 建設状況の日次レポート（health/daily）。JST のこの時を過ぎたら 1 日 1 回（ページは 6 時に描く）。空の DAILY_REPORT_SCRIPT で止める
      DAILY_REPORT_SCRIPT: ${DAILY_REPORT_SCRIPT-/health/daily/status_report.py}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-5}
      ROADMAP: /definitions/roadmap.yaml
      STATUS_REPO: ${STATUS_REPO:-guccyon/factory-engine}
      BUILD_WORK_DIR: /build-work
    volumes:
      - ../definitions:/definitions:ro
      - ../health:/health:ro
      # 建設作業フォルダ（健康レポート・ペア比較の結果を数える）。.env の BUILD_WORK_DIR に Mac の 50_build-work/ を入れる
      - ${BUILD_WORK_DIR:-./.no-build-work}:/build-work:ro
    restart: unless-stopped

  # 操業コンソール（ADR 0009）。工場のいまを見て、順番・保留・停止を操作する。制御プレーンだけを読み書きし、GitHub にも外部の CDN にも触らない
  # 既定は Mac の中だけで開く（http://localhost:8790）。外から見るときは閉じた網（Tailscale など）を足し、CONSOLE_ALLOWED_HOSTS にそのホスト名を入れる
  console:
    image: factory-dispatcher:p0
    command: ["python", "console.py"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      CONSOLE_PORT: 8790
      CONSOLE_ALLOWED_HOSTS: ${CONSOLE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CONSOLE_OPERATOR: ${CONSOLE_OPERATOR:-builder}     # 操作の記録に残す名前（Gen1 はログインなし）
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      JOB_TIMEOUT_SEC: ${JOB_TIMEOUT_SEC:-2400}
      FACTORY_MODE: ${FACTORY_MODE:-}
      MODE_SCHEDULE: ${MODE_SCHEDULE:-}
    ports:
      - "127.0.0.1:${CONSOLE_HOST_PORT:-8790}:8790"
    restart: unless-stopped

  # ワーカーのイメージをビルドするためだけのサービス（常駐しない。docker compose build worker）
  worker:
    build: ./worker
    image: factory-worker:p0
    profiles: ["build-only"]
    command: ["true"]

volumes:
  pgdata:
  objectdata:
