# 工場の制御プレーン（P0 最小構成。ローカル Mac の Docker Compose）
# 状態は postgres / objectstore（S3 互換）に置き、ワーカーは dispatcher が docker run --rm で使い捨てる（ADR 0003）。
# 秘密情報は .env（.env.example を写す）。リポジトリに入れない。
name: factory

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped   # Mac の再起動のあと、制御プレーンも戻す（2026-10-31。これがないと dispatcher だけ上がって DB に届かない）

  # S3 互換のオブジェクトストア（ワーカーのログなど）。MinIO のイメージが Docker Hub から取得できなくなっていたため versitygw を使う（ADR 0003）
  objectstore:
    image: versity/versitygw:v1.10.0   # 版を固定する（latest だと作り直すたびに中身が変わる）。上げるときはここを変える PR で
    command: ["--access", "${OBJECTSTORE_ACCESS_KEY:-factory}", "--secret", "${OBJECTSTORE_SECRET_KEY:-factory-objectstore}", "--port", ":7070", "posix", "/data"]
    volumes:
      - objectdata:/data
    ports:
      - "127.0.0.1:${OBJECTSTORE_PORT:-7070}:7070"
    restart: unless-stopped

  dispatcher:
    build: ./dispatcher
    image: factory-dispatcher:p0
    depends_on:
      postgres: { condition: service_healthy }
      objectstore: { condition: service_started }
    # 通知の設定（製品の .factory-config/notifications.yaml、ADR 0032）の secret: env:NAME を引くため、.env の値をそのまま渡す。
    # 下の environment が先に効く（今までの値は変わらない）
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      OBJECTSTORE_ENDPOINT: objectstore:7070
      OBJECTSTORE_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-factory}
      OBJECTSTORE_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-factory-objectstore}
      OBJECTSTORE_BUCKET: factory-artifacts
      # 対象リポジトリ（カンマ区切り）とラベル
      FACTORY_REPOS: ${FACTORY_REPOS:-guccyon/rally}
      TRIGGER_LABEL: ${TRIGGER_LABEL:-factory:implement}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-30}
      # 同時実行・予算（Blueprint runtime / budgets から。実測で調整）
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      GOVERNANCE_PARALLEL: ${GOVERNANCE_PARALLEL:-1}   # 委員会と知見の流れの専用の枠。ラインの枠とは別で、ラインの一時停止でも止めない（ADR 0024）
      DESK_PARALLEL: ${DESK_PARALLEL:-1}   # 窓口の相談の専用の枠（ADR 0030 の 6）。ラインの一時停止でも相談には答える
      DESK_CONSULT_MAX_USD: ${DESK_CONSULT_MAX_USD:-2}   # 相談 1 件の費用の上限（仮置き）。超えたら相談役を動かさない
      SUPERVISOR_INSPECT: ${SUPERVISOR_INSPECT:-1}   # supervisor と同じ値。番人が検査の積み忘れ（inspect:）を見るかどうか
      SUPERVISOR_MAX_INFLIGHT: ${SUPERVISOR_MAX_INFLIGHT:-1}   # 流量の宣言（line.scaled）がないときの既定。3 つとも同じ値を各サービスに渡す（ADR 0028）
      MAX_TURNS: ${MAX_TURNS:-40}
      TOKEN_BUDGET_PER_JOB: ${TOKEN_BUDGET_PER_JOB:-2000000}
      JOB_TIMEOUT_SEC: ${JOB_TIMEOUT_SEC:-2400}
      MODEL_TIER: ${MODEL_TIER:-tier-large}
      # ワーカーに渡す秘密情報（.env）
      GH_TOKEN: ${GH_TOKEN:-}   # PAT（App が無いときの身元）。App か PAT のどちらかが要る（ghapp.check）
      GH_APP_ID: ${GH_APP_ID:-}                            # GitHub App（ADR 0041）。入っていれば GH_TOKEN より優先し、ジョブごとに絞ったトークンを発行する
      GH_APP_PRIVATE_KEY_B64: ${GH_APP_PRIVATE_KEY_B64:-}  # App の秘密鍵（PEM を base64 で 1 行に）
      GH_APP_INSTALLATION_ID: ${GH_APP_INSTALLATION_ID:-}  # 任意。空なら製品の owner から引く
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?claude setup-token の値 (.env)}
      WORKER_IMAGE: factory-worker:p0
      WORKER_IMAGES: ${WORKER_IMAGES:-}      # リポジトリごとの上書き（例: guccyon/rally=factory-worker:rust）
      # デザインの線（ADR 0025）。factory:design のタスクをデザイナー役（Chromium つきのイメージ）とデザイン検査役に通す
      DESIGN_LABEL: ${DESIGN_LABEL:-factory:design}
      UI_DESIGN_IMAGE: ${UI_DESIGN_IMAGE:-factory-worker:design}
      JOB_DB_ENABLED: ${JOB_DB_ENABLED:-1}     # ジョブごとに job_<id> の DB を作ってワーカーに DATABASE_URL で渡す
      JOB_DB_NETWORK: factory_default
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD:-factory-job}   # ジョブの DB の専用の利用者 factory_job の合言葉（管理者ではない。制御プレーンの DB には繋げない）
      WORKER_DRY_RUN: ${WORKER_DRY_RUN:-}
      KNOWLEDGE_CONTEXT: ${KNOWLEDGE_CONTEXT:-1}   # 委員会が採用した確認済み以上の知見を implement のワーカーに渡す（ADR 0024 の 6）。0 で止める
      WORKER_CARGO_BUILD_JOBS: ${WORKER_CARGO_BUILD_JOBS:-}   # ワーカーの cargo の並列度（空なら cargo の既定。同時 3 本なら コア数÷3 が目安）
      # 番人（ADR 0005）。閾値は仮置き。通知は 1 経路（github-issue: STATUS_REPO の工場状況 Issue / log: ログだけ）
      WATCH_ENABLED: ${WATCH_ENABLED:-1}
      WATCH_IDLE_MIN: ${WATCH_IDLE_MIN:-20}
      WATCH_HEARTBEAT_MIN: ${WATCH_HEARTBEAT_MIN:-30}
      WATCH_DRAIN_MIN: ${WATCH_DRAIN_MIN:-30}          # ラインの一時停止（ADR 0020）がこの分数続いたら停止 drain: を開く（再開の忘れ）
      WATCH_LINE_LOW_BELOW: ${WATCH_LINE_LOW_BELOW:-2}  # 投入待ちのタスクがこの数を切ったら知らせる（停止ではない。0 で無効）
      NOTIFIER: ${NOTIFIER:-github-issue}
      STATUS_REPO: ${STATUS_REPO:-guccyon/factory-engine}
      # 受信トレイの通知（ADR 0026 の決定 7）。通知先は建てるときに選ぶ: log / github-issue / slack をカンマで。受信トレイ自体はコンソールに常にある
      INBOX_NOTIFY: ${INBOX_NOTIFY:-log}
      INBOX_RENOTIFY_MIN: ${INBOX_RENOTIFY_MIN:-240}     # 前の通知からこれだけ残っていれば知らせ直す（仮置き）
      INBOX_ESCALATE_MIN: ${INBOX_ESCALATE_MIN:-1440}    # 出てからこれだけたてば代理（INBOX_PROXY）にも知らせる（仮置き）
      INBOX_PROXY: ${INBOX_PROXY:-builder}
      INBOX_QUIET: ${INBOX_QUIET:-}                      # 知らせない時間（例 22-7、REPORT_TZ の時）。明けた最初の周回でまとめて送る
      CONSOLE_URL: ${CONSOLE_URL:-http://localhost:8790} # 通知のリンクの前に付ける（コンソールの中の選択・出荷へのリンク）
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}          # slack を選ぶときだけ。値は .env に置き、リポジトリに書かない
      INBOX_SLACK_MENTIONS: ${INBOX_SLACK_MENTIONS:-}    # 誰の出番かごとのメンション（例 po=<@U…>,design_chief=<@U…>）。.env に置く
      # 通知の出し分け（ADR 0032）。製品の .factory-config/notifications.yaml があればそれに従い、なければ上の INBOX_* のまま
      NOTIFY_CONFIG_REPO: ${NOTIFY_CONFIG_REPO:-}        # 設定を読む製品のリポジトリ。空なら FACTORY_REPOS の先頭
      NOTIFY_CONFIG_POLL_SEC: ${NOTIFY_CONFIG_POLL_SEC:-300}
      # 来歴（ADR 0007）。Engine の版はイメージに焼き込む（scripts/build.sh が ENGINE_VERSION を渡す。ADR 0031）。.env には書かない
      FACTORY_MODE: ${FACTORY_MODE:-}
      MODE_SCHEDULE: ${MODE_SCHEDULE:-}             # 例: unattended=22:00-08:00（Asia/Tokyo）。factoryctl mode set が優先
      # 差し戻し（ADR 0006 / D5）。上限は仮置き
      SENDBACK_PER_PR: ${SENDBACK_PER_PR:-1}
      # 続きのジョブと引き継ぎのボリューム（ADR 0017）。マージ前の指摘は差し戻しでなく同じ担当の続きで直す。上限は仮置き
      REVIEW_FIX: ${REVIEW_FIX:-1}
      CONTINUE_MAX: ${CONTINUE_MAX:-2}
      HANDOFF_VOLUMES: ${HANDOFF_VOLUMES:-1}
      HANDOFF_KEEP_DAYS: ${HANDOFF_KEEP_DAYS:-7}
      SENDBACK_DAILY_MAX: ${SENDBACK_DAILY_MAX:-5}
      LOW_CONFIDENCE: ${LOW_CONFIDENCE:-0.6}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_PORT: 8787
      # 工場の入れ替え（ADR 0031）。受けた依頼の時刻に、使い捨ての入れ替え役のコンテナを起動する。0 で止める。
      # 作業ツリーの場所は compose のラベルから読む（SWAP_ROOT で上書き）。git worktree の置き場が読めないときは SWAP_EXTRA_MOUNTS（カンマ区切りの絶対パス）
      SWAP_ENABLED: ${SWAP_ENABLED:-1}
      SWAP_ROOT: ${SWAP_ROOT:-}
      SWAP_EXTRA_MOUNTS: ${SWAP_EXTRA_MOUNTS:-}
      # ランナーの窓口（ADR 0033）の工場の中向けの口。合言葉は窓口の置き場のファイル（下のボリュームを読み取り専用で）
      RUNNER_GATE_URL: http://runner-gate:8795
      RUNNER_GATE_TOKEN_FILE: /run/runner-gate/internal.token
      # ジョブごとの Mac ランナーへの中継（ADR 0028 の one_orchestrator）。QA のワーカーに compose の網の中（dispatcher:8796）で渡す。公開しない。0 で止める
      RUNNER_RELAY: ${RUNNER_RELAY:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runnergate:/run/runner-gate:ro   # ワーカーにはマウントしない（ジョブはランナーの窓口を直接呼べない）
    ports:
      - "127.0.0.1:${WEBHOOK_HOST_PORT:-8787}:8787"
    restart: unless-stopped

  # 工場長の supervisor（ADR 0004）。判断は持たず、表を見て工程を起動するだけ。dispatcher と同じイメージで別プロセス
  supervisor:
    image: factory-dispatcher:p0
    command: ["python", "supervisor.py"]
    depends_on:
      postgres: { condition: service_healthy }
    # 定期レポート（ADR 0032）の宛先の secret: env:NAME を引くため、.env の値をそのまま渡す。下の environment が先に効く
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      FACTORY_REPOS: ${FACTORY_REPOS:-guccyon/rally}
      TRIGGER_LABEL: ${TRIGGER_LABEL:-factory:implement}
      GH_TOKEN: ${GH_TOKEN:-}
      GH_APP_ID: ${GH_APP_ID:-}                            # GitHub App（ADR 0041）。入っていれば GH_TOKEN より優先し、ジョブごとに絞ったトークンを発行する
      GH_APP_PRIVATE_KEY_B64: ${GH_APP_PRIVATE_KEY_B64:-}  # App の秘密鍵（PEM を base64 で 1 行に）
      GH_APP_INSTALLATION_ID: ${GH_APP_INSTALLATION_ID:-}  # 任意。空なら製品の owner から引く
      SUPERVISOR_GH_TOKEN: ${SUPERVISOR_GH_TOKEN:-}   # マージ権限を分けるときの別トークン。空ならワーカーと同じ
      SUPERVISOR_INTERVAL_SEC: ${SUPERVISOR_INTERVAL_SEC:-60}
      SUPERVISOR_MAX_INFLIGHT: ${SUPERVISOR_MAX_INFLIGHT:-1}
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      GOVERNANCE_PARALLEL: ${GOVERNANCE_PARALLEL:-1}
      DESK_PARALLEL: ${DESK_PARALLEL:-1}
      SUPERVISOR_DRY_RUN: ${SUPERVISOR_DRY_RUN:-}
      SUPERVISOR_INSPECT: ${SUPERVISOR_INSPECT:-1}       # 工場の PR ごとに検査ジョブ（L4 の shadow 判定）を積む
      SUPERVISOR_JUDGE: ${SUPERVISOR_JUDGE:-1}           # 検査のあと、仮決めと指摘を裁く judge のジョブを積む（ADR 0006）
      SUPERVISOR_CONFLICT_FIX: ${SUPERVISOR_CONFLICT_FIX:-1}   # 衝突した工場の PR を、同じブランチで既定ブランチを取り込んで直す（ADR 0016）
      SUPERVISOR_CI_FIX: ${SUPERVISOR_CI_FIX:-1}               # CI が落ちた工場の PR を、同じ担当の続きのジョブで直す（ADR 0017）
      CONTINUE_MAX: ${CONTINUE_MAX:-2}
      FACTORY_MODE: ${FACTORY_MODE:-}                    # 既定のモード（attended）。製品の manifest に持たせるのは承認付き PR で
      MODE_SCHEDULE: ${MODE_SCHEDULE:-}
      CHANGE_TYPE_RULES: /definitions/change_type_rules.yaml
      # 建設状況の日次レポート（health/daily）。JST のこの時を過ぎたら 1 日 1 回（ページは 6 時に描く）。空の DAILY_REPORT_SCRIPT で止める
      DAILY_REPORT_SCRIPT: ${DAILY_REPORT_SCRIPT-/health/daily/status_report.py}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-5}
      # 定期レポートの通知（ADR 0032）。設定は製品の .factory-config/notifications.yaml（dispatcher と同じ）。提供元の宛先では文面の頭に FACTORY_NAME を付ける
      NOTIFY_CONFIG_REPO: ${NOTIFY_CONFIG_REPO:-}
      NOTIFY_CONFIG_POLL_SEC: ${NOTIFY_CONFIG_POLL_SEC:-300}
      FACTORY_NAME: ${FACTORY_NAME:-}
      # 出荷の列車（ADR 0012）。この製品の Release を 1 日 1 回、この時（JST）を過ぎたら切って staging に出す。空で止める
      RELEASE_TRAIN: ${RELEASE_TRAIN-guccyon/rally}
      RELEASE_TRAIN_HOUR: ${RELEASE_TRAIN_HOUR:-17}
      # PR ごとの使い捨て環境（ADR 0043 の O7）。PR が開いたままでも、この時間を過ぎたら壊す
      EPHEMERAL_TTL_HOURS: ${EPHEMERAL_TTL_HOURS:-48}
      # 夜間の探索（ADR 0028 の nightly_explore）。この製品に、definitions/qa.yaml の explore.hours（JST）の間に 1 晩 1 回 QA 役の探索を積む。既定は出荷の列車と同じ。空で止める
      NIGHTLY_EXPLORE: ${NIGHTLY_EXPLORE-${RELEASE_TRAIN-guccyon/rally}}
      # 週次の KPI の Report ライン（ADR 0043 の O2）。毎週月曜 7 時（JST）を過ぎたら、この製品の staging で ship.yaml の kpi を測る。既定は出荷の列車と同じ。空で止める
      KPI_WEEKLY: ${KPI_WEEKLY-${RELEASE_TRAIN-guccyon/rally}}
      # 週 1 回の設計の診断（ADR 0022）。definitions/design_review.yaml の曜日・時（JST）を過ぎたら製品ごとに 1 回。0 で止める
      DESIGN_REVIEW: ${DESIGN_REVIEW:-1}
      QUALITY_REPOS: ${QUALITY_REPOS:-}
      ROADMAP: /definitions/roadmap.yaml
      STATUS_REPO: ${STATUS_REPO:-guccyon/factory-engine}
      BUILD_WORK_DIR: /build-work
    volumes:
      - ../definitions:/definitions:ro
      - ../health:/health:ro
      # 建設作業フォルダ（健康レポート・ペア比較の結果を数える）。.env の BUILD_WORK_DIR に Mac の 50_build-work/ を入れる
      - ${BUILD_WORK_DIR:-./.no-build-work}:/build-work:ro
    restart: unless-stopped

  # 操業コンソール（ADR 0009）。工場のいまを見て、順番・保留・停止を操作する。制御プレーンだけを読み書きし、GitHub にも外部の CDN にも触らない
  # 既定は Mac の中だけで開く（http://localhost:8790）。外から見るときは閉じた網（Tailscale など）を足し、CONSOLE_ALLOWED_HOSTS にそのホスト名を入れる
  console:
    image: factory-shipper:p2          # 出荷のボタン（ADR 0012）に ship.py を使うので shipper と同じイメージ。docker のソケットは渡さない
    command: ["python", "console.py"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      CONSOLE_PORT: 8790
      CONSOLE_ALLOWED_HOSTS: ${CONSOLE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CONSOLE_OPERATOR: ${CONSOLE_OPERATOR:-builder}     # 操作の記録に残す名前（Gen1 はログインなし）
      MAX_PARALLEL: ${MAX_PARALLEL:-2}
      SUPERVISOR_MAX_INFLIGHT: ${SUPERVISOR_MAX_INFLIGHT:-1}
      GOVERNANCE_PARALLEL: ${GOVERNANCE_PARALLEL:-1}
      DESK_PARALLEL: ${DESK_PARALLEL:-1}
      WATCH_LINE_LOW_BELOW: ${WATCH_LINE_LOW_BELOW:-2}  # 投入待ちのタスクの残りを赤く出す下限（dispatcher と同じ値）
      PLAN_WEEK_RESET: ${PLAN_WEEK_RESET:-sun 11:00}     # 使用量のページの契約の週の区切り（JST）
      PLAN_WEEKLY_LIMIT_USD: ${PLAN_WEEKLY_LIMIT_USD:-}  # 契約の週の上限の目安（API 単価換算）。空なら割合と見込みを出さない
      JOB_TIMEOUT_SEC: ${JOB_TIMEOUT_SEC:-2400}
      FACTORY_MODE: ${FACTORY_MODE:-}
      MODE_SCHEDULE: ${MODE_SCHEDULE:-}
      PROTOTYPE_PORT: 8791                               # 動くプロトタイプの配り口（デザイナー役の HTML を別オリジン・sandbox で配る。prototype.py）。0 で止める
      PROTOTYPE_PUBLIC_URL: ${PROTOTYPE_PUBLIC_URL:-http://localhost:8791}
      OBJECTSTORE_ENDPOINT: objectstore:7070             # 人の選択の画面で案の画像を中継する（choices/ の下だけ読む。ADR 0025）
      OBJECTSTORE_ACCESS_KEY: ${OBJECTSTORE_ACCESS_KEY:-factory}
      OBJECTSTORE_SECRET_KEY: ${OBJECTSTORE_SECRET_KEY:-factory-objectstore}
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_HOST_PORT:-8790}:8790"   # 同じ LAN の端末から見るときは CONSOLE_BIND=0.0.0.0 と CONSOLE_ALLOWED_HOSTS にホスト名（例 host.example.local）
      - "${CONSOLE_BIND:-127.0.0.1}:${PROTOTYPE_HOST_PORT:-8791}:8791"  # 動くプロトタイプ（別オリジン）。ホストのポートを変えたら PROTOTYPE_PUBLIC_URL も合わせる
    restart: unless-stopped

  # ランナーの窓口（ADR 0033）。工場の外の機械のランナー（Mac ランナー）が TLS で仕事を取りに来る。工場からランナーへは繋ぎに行かない。
  # 証明書・ランナーごとの鍵・中向けの合言葉は runnergate のボリュームにだけ置く（events にも DB にも書かない）。
  # 既定は Mac の中だけで開く。同じ LAN の別の Mac のランナーを足すときは RUNNER_GATE_BIND=0.0.0.0
  runner-gate:
    image: factory-dispatcher:p0
    command: ["python", "runner_gate.py"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      RUNNER_GATE_HOME: /var/lib/runner-gate
    volumes:
      - runnergate:/var/lib/runner-gate
    ports:
      - "${RUNNER_GATE_BIND:-127.0.0.1}:${RUNNER_GATE_HOST_PORT:-8794}:8794"   # ランナー向け（TLS）。8795 の中向けの口は公開しない
    restart: unless-stopped

  # 事業部の窓口（ADR 0030）。外の人（とその代理の Claude）が依頼と問い合わせを持ち込む口。操業コンソールより狭く、相談と依頼者に許した範囲のチケットの操作だけを受ける。
  # 認証は依頼者ごとのトークン（factoryctl desk token create）。既定は Mac の中だけで開く（http://localhost:8792）。外のマシンで動かすときは TLS と DESK_ALLOWED_HOSTS を足す
  desk:
    image: factory-dispatcher:p0
    command: ["python", "desk_api.py"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      DESK_PORT: 8792
      DESK_ALLOWED_HOSTS: ${DESK_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "127.0.0.1:${DESK_HOST_PORT:-8792}:8792"
    restart: unless-stopped

  # 出荷の shipper（ADR 0012）。Release のイメージを作り、製品の環境（staging・prod）を docker compose で起動し、Rollback する。
  # 依頼は events（factoryctl release ship / approve / rollback、操業コンソール）から受ける。判断は持たない
  shipper:
    build: { context: ./dispatcher, dockerfile: Dockerfile.shipper }
    image: factory-shipper:p2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      GH_TOKEN: ${GH_TOKEN:-}          # 製品のソースを取る（読むだけ）
      GH_APP_ID: ${GH_APP_ID:-}                            # GitHub App（ADR 0041）。入っていれば GH_TOKEN より優先し、ジョブごとに絞ったトークンを発行する
      GH_APP_PRIVATE_KEY_B64: ${GH_APP_PRIVATE_KEY_B64:-}  # App の秘密鍵（PEM を base64 で 1 行に）
      GH_APP_INSTALLATION_ID: ${GH_APP_INSTALLATION_ID:-}  # 任意。空なら製品の owner から引く
      SHIP_POLL_SEC: ${SHIP_POLL_SEC:-2}                   # Rollback の秒数に効くので短く
      PROD_WATCH_SEC: ${PROD_WATCH_SEC:-60}                # 本番の見張り（ADR 0057）。本番を立てる段階の製品の本番に版を聞く間隔。0 で止める
      PROD_WATCH_FAILS: ${PROD_WATCH_FAILS:-3}             # 続けて何回合わなければ止まったとするか
      SHIP_WORKDIR: /ship
      # 触れる環境（ADR 0028 の touchable_env）。端末ごとの値なのでここには書かず .env で渡す（README の「触れる環境」）。
      # SHIP_TOUCH_HOST はスマートフォンから届くこの機械の名前か IP（入口の URL と QR に使う）、SHIP_TOUCH_BIND は画面の待ち受け（例: 0.0.0.0）。
      # どちらも空なら 127.0.0.1 のまま（この機械からだけ開ける）
      SHIP_TOUCH_HOST: ${SHIP_TOUCH_HOST:-}
      SHIP_TOUCH_BIND: ${SHIP_TOUCH_BIND:-}
      EPHEMERAL_MAX: ${EPHEMERAL_MAX:-2}   # PR ごとの使い捨て環境（ADR 0043 の O7）を同時に立てる数（factoryctl の受け付けは既定の 2 で見る）
      STATUS_REPO: ${STATUS_REPO:-guccyon/factory-engine}   # 出荷の失敗を停止として知らせる先
      NOTIFIER: ${NOTIFIER:-github-issue}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shipwork:/ship
    restart: unless-stopped

  # ワーカーのイメージをビルドするためだけのサービス（常駐しない。docker compose build worker）
  worker:
    build: ./worker
    image: factory-worker:p0
    profiles: ["build-only"]
    command: ["true"]

  # デザイナー役のワーカー（ADR 0025）。先に worker を作ってから docker compose build worker-design
  worker-design:
    build: { context: ./worker, dockerfile: Dockerfile.design }
    image: factory-worker:design
    profiles: ["build-only"]
    command: ["true"]

volumes:
  runnergate:
  pgdata:
  shipwork:
  objectdata:
