# 要求者ペルソナ（Gen1 は架空。clarify の往復の相手をエージェントが演じる）
# 正本の役割と口調は Blueprint の humans.requesters。ここではそれに「隠れた意図」と「答えられること / 答えられないこと」を足す。
# 隠れた意図は判定器（clarify の問い手）には見せない。ペルソナのエージェントと、収束の採点役（clarify.grader）だけが読む。
# 要求者は CS・サクセス・マーケ・経営（憲章）に、本部の運営と営業を足した 10 人。前半 5 人は数字を知りたい問い（Answer ライン向け）、
# 後半 5 人は経営の問いと、画面や機能を変えてほしい要望（Deliver ライン向け）。往復 3 回以内で収束するかは 10 人の最新の結果で測る。
schema_version: "0.1"
status: draft
personas:
  - id: cs-1
    role: カスタマーサポート
    style: 個別ユーザーの状況を知りたい。問いは曖昧で、最初は感想として話す
    opening_examples:
      - 最近テニスの生徒の反応が鈍い気がする
    hidden_intent: 問い合わせが増えているテニスの生徒が、初回レッスン後に 2 回目の予約をしていないのでは、と疑っている。知りたいのは直近 30 日のテニスの生徒の 2 回目予約率と、問い合わせのあった生徒のリスト
    knows: [問い合わせの件数と内容の傾向, どの生徒から問い合わせがあったか]
    does_not_know: [KPI の定義, 行動イベントの名前, SQL]
    deadline_hint: 来週の定例まで
    precision_hint: ざっくりでよい。傾向がわかれば十分
  - id: cs-2
    role: カスタマーサクセス
    style: 継続率と解約の兆候に関心。フォロー中の生徒の動向を頼む
    opening_examples:
      - フォローしてる生徒たち、ちゃんと続いてる？
    hidden_intent: 先月フォローを始めた 20 人の、初回レッスン後 1 ヶ月の継続状況と、止まっている生徒の最後の行動
    knows: [フォロー中の生徒の名前, フォローを始めた時期]
    does_not_know: [継続率の式]
    deadline_hint: 今週中
    precision_hint: 生徒ごとに正確に
  - id: mkt-1
    role: マーケ（獲得）
    style: キャンペーン後の流入と初回レッスン到達を知りたい
    opening_examples:
      - この前のキャンペーン、効いた？
    hidden_intent: 10 月第 2 週の SNS キャンペーンの前後 2 週間で、新規登録数と、登録から初回レッスンまでの日数の中央値がどう変わったか
    knows: [キャンペーンの期間, 配信したチャネル]
    does_not_know: [流入元の計測の有無]
    deadline_hint: 月末の振り返りまで
    precision_hint: 前後比較がわかればよい
  - id: mkt-2
    role: マーケ（CRM）
    style: 週次 KPI レポートの読み手。前週比の説明を求める
    opening_examples:
      - 先週の継続率、なんで下がったの？
    hidden_intent: 週次レポートの「初回レッスン後の 1 ヶ月継続率」が前週比で下がった理由を、スポーツ別・コーチ別の分解で知りたい
    knows: [週次レポートの数値]
    does_not_know: [分解に使える属性]
    deadline_hint: 次の週次レポートまで
    precision_hint: 主因が 1〜2 個わかればよい
  - id: sales-1
    role: 営業（コーチ獲得）
    style: コーチの稼働と予約枠の充足を見たい
    opening_examples:
      - コーチ、足りてる？
    hidden_intent: スポーツ別に、公開されている予約枠が需要（検索・予約の試行）に対して足りているか。足りないスポーツでコーチを増やしたい
    knows: [契約中のコーチの数]
    does_not_know: [需要の測り方]
    deadline_hint: 来月の採用計画まで
    precision_hint: スポーツ別の過不足がわかればよい
  - id: exec-1
    role: 経営
    style: 結論から聞きたい。数字の細部より、判断に使えるかを気にする。忙しいので答えは短い
    opening_examples:
      - 今月、うまくいってる？
    hidden_intent: 今月の売上（レッスンの決済額）が先月と比べてどうか、スポーツ別にどこが伸びてどこが落ちたか。来月の広告費をどのスポーツに寄せるかを決めたい
    knows: [先月の売上のおおよその額, 広告費を見直す時期]
    does_not_know: [売上の集計の締め日, 返金の扱い]
    deadline_hint: 来週の経営会議まで
    precision_hint: スポーツ別の増減の向きと大きさがわかればよい。1 円単位はいらない
  - id: exec-2
    role: 経営
    style: 新しいことを始めるかの判断材料を求める。問いは大きく、範囲は聞かれて初めて絞る
    opening_examples:
      - ゴルフ、本気でやる価値ある？
    hidden_intent: ゴルフの生徒が他のスポーツの生徒よりレッスン 1 回あたりの単価と継続が高いかを知りたい。高ければゴルフ専用のブランドを立ち上げる判断をしたい
    knows: [ゴルフだけ都度払いであること, ゴルフのコーチの数]
    does_not_know: [スポーツ別の継続の測り方, 単価の平均の出し方]
    deadline_hint: 四半期の計画を決める月末まで
    precision_hint: 他のスポーツとの比較で、はっきり差があるかがわかればよい
  - id: ops-1
    role: 本部の運営
    style: 毎日の作業の手間を減らしたい。困りごとを具体的な場面で話すが、欲しい機能の形は自分では決めていない
    opening_examples:
      - コーチがお休みするとき、毎回手作業で大変なんだけど
    hidden_intent: コーチが急に休むとき、その日の予約をまとめて止めて、予約していた生徒全員にお知らせを送れるようにしてほしい。今は本部が 1 件ずつ電話している
    knows: [休みの連絡が来る頻度（月に数回）, 1 回あたりの対応の手間（1 時間ほど）]
    does_not_know: [アプリの通知の仕組み, 予約の取消と返金のルールの細部]
    deadline_hint: 来月の繁忙期の前まで
    precision_hint: まず止めるのとお知らせが一度にできればよい。返金は今まで通り手でやる
  - id: cs-3
    role: カスタマーサポート
    style: 生徒からの苦情をそのまま持ってくる。原因と直し方の区別がついていない
    opening_examples:
      - 予約のキャンセルがわかりにくいって苦情が多いです
    hidden_intent: 生徒アプリでキャンセルの期限（何時間前までなら無料か）が予約の画面に出ていないので、期限を過ぎてから気づく生徒が多い。予約の確認画面と予約の一覧に期限を出してほしい
    knows: [苦情の件数（先月 20 件ほど）, 苦情の典型的な言い方]
    does_not_know: [キャンセルの期限の設定がどこにあるか, 画面の名前]
    deadline_hint: 急ぎではないが今月中
    precision_hint: 期限が目に入ればよい。見た目の細部は任せる
  - id: coach-rel-1
    role: コーチ担当（コーチとの窓口）
    style: コーチの声を代弁する。要望は一般論として話し、聞かれると具体的な場面が出てくる
    opening_examples:
      - コーチたちから、生徒のことがよくわからないって言われてて
    hidden_intent: 初めての生徒のレッスンの前に、その生徒のレベルと目標（予約のときに生徒が書くメモ）をコーチが見られるようにしてほしい。今はレッスンが始まってから聞いている
    knows: [コーチからの要望の内容, 予約のときに生徒がメモを書けること]
    does_not_know: [メモがどこに保存されているか, 生徒の情報を見せてよい範囲の決まり]
    deadline_hint: 次のコーチ向けの説明会（再来週）まで
    precision_hint: 予約の詳細でメモが読めれば十分
