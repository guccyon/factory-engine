    title: デザインシステムの主の色を落ち着かせ、部品の見本とカタログを足す
    body: "## 概要\n\nデザインシステム（`specs/design/`、コンセプト rally-court）の見本を人が見て、次の 4 点を決めました。正本と両アプリのテーマに反映し、あわせて部品の見本（`components.yaml`\
      \ の `preview`）を足して、正本からカタログが組み立てられるようにします。\n\n## 背景\n\n- 正本は #496 / #505 で入った。人が見本のカタログで確かめ、青が強い・空の表示のボタンが読みにくいと指摘した\n\
      - 見本のカタログ（正本から手で作った 1 版目）: https://claude.ai/artifact/Nf3MTWJyg3Fkh4xJuwPebn 。人はこの版の色と見た目を「見やすくなった」と承認済み\n- サービスは日本国内のみに出す。書体の見本は日本語にする\n\
      \n## 決まったこと（人の判断、2026-11-02）\n\n1. **主の色の彩度を下げる**（色の役割の値の変更。governance の人の承認に当たる）\n\n   | 役割 | 旧 | 新 |\n   | --- | ---\
      \ | --- |\n   | primary / focus-ring / info-fg | #1E3FD0 | #3A54B0 |\n   | primary-pressed | #1A2FA8 | #2E4590 |\n \
      \  | primary-container / info-container | #E6EBFF | #E9EDF8 |\n   | on-primary-container / info-on-container | #14246E\
      \ | #1E2A5C |\n\n   コントラスト：primary は background で 6.83、surface で 6.15、primary-container で 5.83。primary-pressed と白の文字は\
      \ 8.86。on-primary-container と primary-container は 11.64。inverse-surface の上は 2.72（引き続き置かない）。\n2. **コンセプトの節**：コピー「コートの熱。次の練習へ、前のめりに。」の\
      \ 3 語をデザインに結びつける。カタログの README の冒頭の表を正本（`concept_tone.yaml` か `principles.yaml`）に写す\n   - コートの熱：濃い面 `inverse-surface`\
      \ にライム `secondary` の線と display の数字。熱は 1 画面 1 か所\n   - 次の練習へ：次の一手を一番前に、主なボタンは 1 つ。空の画面でも次の行動を示す\n   - 前のめりに：太い字（900・700）、-12°\
      \ の帯、動詞で言い切るボタン、待たせない動き。ただし回数・日時・規定・誤りは正確さを優先\n3. **empty_state のボタン**：画面にほかの主な操作がないときは primary。欄だけが空で画面に primary があるときは\
      \ secondary。surface の面の上の secondary は沈んで読みにくいので使わない。文字は `text-muted` から `text` に\n4. **書体の見本は日本語**：見本の文言は実際の画面の言葉にする\n\
      \n## 受け入れ条件\n\n- `specs/design/` の tokens・components・コンセプトの節が上の決定に合っている。`specs/design/CHANGELOG.md` に版を 1 つ足す\n- `components.yaml`\
      \ の各部品に `preview`（状態ごとの見本）があり、正本からカタログ（`catalog.html` と `catalog.png`）が組み立てられて、人が見られる\n- 両アプリのテーマの色の値が新しい正本に合っている（student-app\
      \ の `rally_tokens.dart`、admin-web の `globals.css` の `@theme` と `tests/designTokens.test.ts`）。admin-web の `EmptyState`\
      \ は決定 3 に合わせる\n- 見た目が変わる PR には前後のキャプチャを付ける\n- Web フォントは使わない\n\n## 範囲外\n\n- 個々の画面を部品に置き換える作業、書体ファイルの同梱、決済まわり\n\n<!--\
      \ factory:design-system -->\n## デザインシステムの正本\n\nデザインシステムのデザイナー役が書いた正本（いまのデザインシステムへの追加・変更）。実装役は次を同じ PR で行う（ADR 0025）。\n\
      - 下のファイルをそのまま `specs/design/` に置く（変わるファイルだけ。中身は直さない。直しが要れば PR の本文に書く）\n- 両アプリのテーマ（色・書体・余白・角丸）を tokens.yaml に合わせ、部品の一覧（components.yaml）にある基本の部品を用意する。画面の作り替えは別のタスク\n\
      - 今の画面の見た目が変わるので、PR に前後のキャプチャを付ける\n\n<details><summary>specs/design/tokens.yaml</summary>\n\n```yaml\n# 基礎（トークン）。アプリのテーマ（student-app\
      \ の ThemeData、admin-web の Tailwind の @theme）はこの名前と値に合わせる\n# 名前は <分類>.<役割>。アプリでは color-primary（CSS）・RallyColors.primary（Dart）のように写す\n\
      schema_version: \"0.1\"\nstatus: draft\nsection: foundations\nconcept: rally-court\n\ncolor:\n  roles:   # 明るい配色（Gen1\
      \ の既定で、唯一の配色）\n    primary: \"#3A54B0\"              # 主。主なボタン・リンク・選択中（0.2.0 で #1E3FD0 から彩度を下げた）\n    on_primary: \"\
      #FFFFFF\"\n    primary_pressed: \"#2E4590\"      # 押下のとき（白の文字と 8.86）\n    primary_container: \"#E9EDF8\"    # 選択中の行・情報の面\n\
      \    on_primary_container: \"#1E2A5C\"\n    secondary: \"#D4F53C\"            # 副（ライム）。文字の色にしない\n    on_secondary: \"\
      #10131A\"\n    text: \"#10131A\"\n    text_muted: \"#4A5163\"           # 補足の文字\n    background: \"#FFFFFF\"\n    surface:\
      \ \"#F1F3F8\"              # カード・欄の面\n    inverse_surface: \"#10131A\"      # 濃い面。1 画面に 1 か所\n    on_inverse_surface:\
      \ \"#FFFFFF\"\n    on_inverse_surface_muted: \"#B8BFCC\"\n    border: \"#DDE1EA\"               # 飾りの区切り線だけ（1.31。部品の輪郭に使わない）\n\
      \    border_strong: \"#7D8599\"        # 入力欄・押せる部品の輪郭（3.69）\n    focus_ring: \"#3A54B0\"           # 濃い面の上では secondary\n\
      \    scrim: \"rgba(16,19,26,0.56)\"    # ダイアログの後ろ\n  status:\n    info:    {fg: \"#3A54B0\", container: \"#E9EDF8\"\
