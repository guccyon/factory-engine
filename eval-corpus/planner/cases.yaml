    title: コーチがお休みするとき、毎回手作業で大変なんだけど
    body: "コーチがお休みするとき、毎回手作業で大変なんだけど\n\n（clarify の収束の計測。要求者 ops-1 は架空のペルソナで、往復は窓口と工場のエージェントが行う）\n\n<!-- factory-uxspec:v1\
      \ -->\n## 画面の設計（UXSpec）\n\nデザインの線で決まった案 `a`（人が選んだ）。画面の要素・振る舞い・状態はこの UXSpec に合わせて実装する（ADR 0025）。\n同じ PR で、この UXSpec を\
      \ `specs/ux/issue-455.yaml` に置く。見た目の細部は後から直してよい。\nデザインシステムに足りない部品は別のタスクで足す。画面に直書きしない。\n依存: #979\n\n```yaml\nprd:\n \
      \ goal: 本部の担当者（運営）として、コーチがお休みするときに、その期間の予約を 1 件ずつ探して生徒に連絡し、枠を片づける手作業をやめたい。 期間を入れて\n    1 回確かめれば、影響する生徒にもれなく知らせて片づけが終わるようにしたい。\n\
      \  scope:\n    in:\n    - 本部の画面「コーチのお休み」（期間の入力・影響の一覧・生徒への一言・確認・結果）\n    - コーチの様子の「このコーチで開く画面」のリンクの並びに「お休み」を足す\n    -\
      \ 本部による予約のまとめてのキャンセル、生徒ごとのお知らせ、期間の枠の取り下げ（新しい API。contract_needs）\n    out:\n    - ほかのコーチへの振替（代わりのコーチを探して予約し直す）。生徒が自分で探す（お知らせの本文で案内する）\n\
      \    - コーチ自身がお休みを申し出る画面（coach ロール）。今回はコーチから本部へ連絡が来る前提\n    - お休みの期間中にコーチが新しく枠を公開できないようにする仕組み（open_questions の 2）\n \
      \   - 受付の停止（期限のない停止は今の「コーチの受付」のまま。お休みは期間で区切る）\n    - お休みの取り消し（キャンセルした予約は元に戻せない）と、お休みの記録の一覧の画面\n    - 動画添削（非同期レッスン）の返却待ちの扱い。期間のある予約ではないので対象外（open_questions\
      \ の 4）\n  source: 'Issue guccyon/rally#455「コーチがお休みするとき、毎回手作業で大変なんだけど」（要求者 ops-1。本文はこの 1 文だけで、\n    受け入れ条件はない。手作業の中身は今の製品から読み取った:\
      \ 本部は受付を止められるが予約と枠はそのまま残り （openapi admin-web の suspendCoach）、本部は予約をキャンセルできず（今キャンセルできるのは生徒だけ。listCancelledBookings\n\
      \    の説明）、 枠の取り下げはコーチ本人だけ（withdrawMySlot）、お知らせは生徒全員かスポーツごとにしか送れない（sendAnnouncement））。\n    PRD の文書は specs/ にない。'\n \
      \ success: '本部がコーチの様子からこの画面を開き、お休みの期間を入れて、期間の予約（確定待ち・確定済み）と枠を画面で確かめ、 「お休みにする」を 1 回確かめて押すだけで、(1)\n    期間の予約がすべて本部のキャンセルになり（生徒のビデオ通話の枠を使わない）、\
      \ (2) 予約した生徒全員にお知らせが届き、(3) 期間の枠がすべて取り下げられて生徒の検索に出なくなる。\n    どの予約をキャンセルしたかは「キャンセルされた予約」（キャンセルした人: 本部）であとからたどれる。'\nnotes:\n\
      - 案は admin-web（PC の管理画面）なので desktop で撮った。今の本部の画面は幅 48rem の 1 段で、狭い幅でも同じ並びで縦に伸びる\n- 動くプロトタイプの入口は a.html。a-overview.html（コーチの様子）の「お休み」→\
      \ a.html の「お休みにする」→ a-confirm.html\n  の「キャンセルしてお休みにする」→ a-done.html → 「コーチの様子へ戻る」でひと回りする。a-loading・a-invalid・a-empty・a-sending・a-failed\n\
      \  は状態のコマ\n- 送信中（a-sending）の後ろの画面は案 a の代表と同じ中身を描いている。コマの中の「モックの注記」の文と、入口のリンクの薄い青の面はモックだけのもの\n- サンプルの名前・日時は架空（2026-11-05\
      \ を今日とした）\nstates:\n- 'hqCoachLeave コーチの読み込み中: 「読み込み中…」（frame loading とは別。コーチの欄だけ）'\n- 'hqCoachLeave コーチが見つからない（coach_id\
      \ なし・コーチでない ID）: 「このコーチは見つかりません。コーチの一覧から選び直してください。」入力欄は出さない'\n- 'hqCoachLeave 期間がまだ空: 期間の欄と「期間の予約と枠を確かめる」だけ。「お休みにする」は押せない'\n\
      - 'hqCoachLeave 入力の誤り: 日付の欄の下に error_text（frame invalid）'\n- 'hqCoachLeave 期間の予約と枠の読み込み中: ボタンの spinner と「期間の予約と枠を読み込んでいます…」・画面の上の\
      \ bar（frame loading）'\n- 'hqCoachLeave 中身あり: 期間の予約と枠の一覧・お知らせの見本・一言・知らせ・「お休みにする」（案 a の代表）'\n- 'hqCoachLeave 空（期間に予約も公開中の枠もない）:\
      \ empty_state（frame empty）'\n- 'hqCoachLeave 一覧の読み込みの失敗: 欄の中に notice（danger）。期間は残す'\n- 'hqCoachLeave 期間を変えたあと: 一覧は残し、「お休みにする」を押せなくして読み直しを促す'\n\
      - 'hqCoachLeave 確認: confirm_dialog（frame confirm）'\n- 'hqCoachLeave 送信中: confirm の spinner、「やめる」も押せない、「お休みにしています…」（frame\
      \ sending）'\n- 'hqCoachLeave お休みにした: 結果の知らせ（success）とキャンセル済み・終了の一覧、次のリンク（frame done）'\n- 'hqCoachLeave 送る失敗（確かめたあとに予約が変わった・重なるお休み・そのほか）:\
      \ 画面の上に notice（danger）。何も変えていないことを書き、入れた値は残す（frame\n  failed）'\n- 'hqCoachLeave 権限がない（本部以外・未ログイン）: RoleGate がログイン画面へ戻す。API\
      \ の 401・403 は失敗の文言'\n- 'hqCoachOverview: 既存の状態のまま（「お休み」のリンクは読み込みを待たずに出る）'\nticket: guccyon/rally#455\nchanges:\n- kind:\
      \ new\n  after: 新しい画面。コーチ 1 人（URL の ?coach_id=）とお休みの期間（始まりの日・終わりの日）を入れて「期間の予約と枠を確かめる」と、 期間の予約と予約のない枠が出る。生徒への一言（任意）を書き、「お休みにする」→\n\
      \    確認のダイアログで、予約のキャンセル・ 生徒へのお知らせ・枠の取り下げをまとめて行い、結果を同じ画面に出す。\n  screen: hqCoachLeave\n- kind: changed\n  after: 同じ並びの最後に「お休み」を足し、/headquarters/coaches/leave?coach_id=<コーチ\
      \ ID> へ移る。ほかは変えない。\n  before: コーチの様子（/headquarters/coach-overview）の上の「このコーチで開く画面」に、評価・低い評価・レッスンメニュー・予約のリンクが並ぶ。\n   \
      \ お休みの手続きの入り口はない（受付の停止はコーチの一覧の行から）。\n  screen: hqCoachOverview\nscreens:\n- id: hqCoachLeave\n  new: true\n  more:\n\
      \    copy:\n    - 画面の名前「コーチのお休み」。「お休み」は glossary にまだない語で、仮に使う（open_questions の 1。足すなら coach_leave「コーチのお休み」）\n    - 予約・スロット（画面では「枠」。今の\
      \ admin-web と同じ）・確定待ち・確定済み・キャンセル済み・公開中・終了・受付中・停止中・お知らせ・ビデオ通話は\n      glossary と今の画面の語\n    - ボタンは動詞で終える（「期間の予約と枠を確かめる」「お休みにする」「キャンセルしてお休みにする」「やめる」）。admin-web\
      \ なので感嘆符は使わない\n    - 日時は content.yaml の形（「11/10（火）19:00〜19:30」「11/10（火）〜11/16（月）」）。日本時間\n    - 生徒に届くお知らせの文面の正本はサーバー（notification\
      \ の本文）。画面は見本を出すだけ\n    analytics:\n    - 行動イベントは新しく足さない（本部の運営の操作で、suspendCoach と同じ扱い）\n    - キャンセルした予約ごとに booking.cancelled\
      \ が要るか、slot.withdrawn を本部の取り下げでも発火するかは、actor が\n      student / coach に決まっているので決めきれない（open_questions の 6）。KPI「コーチの予約枠充足率」の分母に効く\n\
      \    accessibility:\n    - 日付の欄・一言の欄に見えるラベル。誤りは aria-invalid と aria-describedby で欄に結ぶ\n    - 一覧は ul に aria-label（「期間の予約の一覧」）。行は「日時、生徒、状態」を\
      \ 1 つの文で読む\n    - 状態は色と文字（確定待ち・確定済み・キャンセル済み・公開中・終了）とアイコン\n    - 確認のダイアログは role=dialog・aria-modal。開いたら題へフォーカス、閉じたら「お休みにする」へ戻す\n\
      \    - 読み込み中・送信中・成功は role=status、失敗は role=alert\n    contract_needs:\n    - '1. GET /coaches/{coach_id}/leave-preview?from=YYYY-MM-DD&to=YYYY-MM-DD（本部だけ。照会だけ）。応答:\n\
      \      coach（coach_id・display_name・sports・acceptance_status）、 bookings（期間に始まる pending・confirmed\n      の予約。booking_id・slot_id・starts_at・ends_at・status・is_trial・lesson_menu\
      \ の名前・student_id・student_display_name。開始の早い順）、\n      open_slots（期間に始まる open で有効な予約のない枠。slot_id・starts_at・ends_at・capacity・lesson_menu\n\
      \      の名前）、 slot_count（取り下げる枠の数。予約のある枠を含む）、student_count（知らせる生徒の人数。同じ生徒は 1 人）、notification_preview（題と本文の見本）。\n    \
      \  期間の規則は listBookings と同じ（31 日まで・日本時間）に加え、from は明日以降（違えば 422 validation_failed）'\n    - '2. POST /coaches/{coach_id}/leaves（本部だけ）。本文:\
      \ from・to・note（0〜200 文字）・expected_booking_ids。\n      全部か何もしないかで、期間の有効な予約をすべて本部のキャンセル（cancelled_by: headquarters。キャンセル規定で回数を使わない＝BookingCancelled\n\
      \      の consumes_quota を false）にし、 予約した生徒ごとにお知らせ（notification の新しい種類。open_questions\n      の 7）を作ってプッシュ通知（受け取り設定に従う）、期間の枠をすべて取り下げる（closed）。\
      \ お休みの記録（期間・note・本部のアカウント・時刻・件数）を\n      1 件残す。応答: 記録と cancelled_booking_count・notified_student_count・withdrawn_slot_count。\n\
      \      409 leave_preview_outdated（今の期間の有効な予約の ID が expected_booking_ids と違う）、409 coach_leave_overlaps（期間の重なるお休みがある）、404（コーチでない）、422（期間・note）'\n\
      \    - 3. 境界間イベント BookingCancelled（scheduling → entitlement）に本部のキャンセルを載せ、回数を使わないことを判定は\n      scheduling の 1 か所で決める（不変条件\
      \ 3・ADR 0002）\n    microinteractions:\n    - loops: 押すたびに読み直す。自動では読み直さない\n      rules: 期間を確かめてから 1 回読む。期間を変えたら一覧は残し、送るボタンを止める\n\
      \      trigger: 「期間の予約と枠を確かめる」\n      feedback: ボタンの spinner と欄の「読み込んでいます…」。300ms より速く終わるときは出さない\n    - loops: なし（同じ期間の\
      \ 2 回目はサーバーが断る）\n      rules: 1 回だけ送る。送るのは確かめた予約の ID の一覧と期間と一言\n      trigger: 「キャンセルしてお休みにする」\n      feedback: confirm\
      \ の spinner と「お休みにしています…」、終わったら結果の知らせ（消えない）\n  route: /headquarters/coaches/leave?coach_id=<コーチ ID>\n  purpose: コーチのお休みの期間を決め、その期間の予約と枠を見て確かめてから、まとめて片づける画面。コーチの様子から入り、\
