      \ 「期間の予約と枠を確かめる」\n    required: true\n    component: button secondary\n  - name: 期間の予約\n    note: 並べ方は API の順（開始の早い順）のまま。キャンセル済みは出さない。グループレッスンの枠は生徒ごとに\
